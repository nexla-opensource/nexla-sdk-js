    file_data_source:
      type: object
      properties:
        source_config:
          type: object
          required:
            - start.cron
            - path
          properties:
            start.cron:
              type: string
              description: >
                __Scheduling Frequency__: The interval at which Nexla should
                scan this source for new files. This must be in the form of a
                cron expression.
              example: 0 0 22 10 11 ? 2022
            path:
              type: string
              description: >
                __Path to Scan__: The path of the folder to be scanned for new
                data.
            advanced_settings:
              type: string
              enum:
                - Auto Detect
                - Custom Text Format
                - XML
                - JSON
                - EDI
                - Log File
                - ORC
                - AVRO
                - Parquet
                - Excel
                - Fixed Width
                - PDF
                - Unstructured
                - SWIFT
                - Raw File Data
              description: >
                __Choose a pre-built File Processor__: Select a file processor
                that best matches the format of your files. The platform offers
                several built-in options to handle various file types and
                formats. You can also combine these with custom file parsing
                code for more advanced use cases.


                The platform's default configurations of automatically detecting
                Nexsets from file content are primarily driven by parsing
                appropriately based on file extensions.



                However, you can override the default parsing and further
                customize how the files are processed by selecting appropriate
                File Content Format choices.


                Some common scenarios are - 


                1. Files without extensions to indicate what type of parser
                should be applied


                2. Compressed Zip or Tar files. 

                Select Custom Text Format, and the platform will automatically
                un-compress and parse the un-compressed files based on those
                settings.

                3. Text files with fixed-width or custom column delimiters

                4. CSV files without a header row. The platform will
                automatically assign attribute names as __attribute1__,
                __attribute2__, etc.

                5. Structured files in which some lines have to be skipped
                before processing rows

                6. Files in which the name extension does not match the desired
                parser (e.g., JSON content in a .dat file)

                7. Files for which some customization has to be applied to
                designate how the default extension parser treats data.


                * `Auto Detect`: (Automatic) Automatically detect how to parse
                each file. Select this option for most use cases, even if the
                source contains files in more than one format. The platform will
                automatically detect the file format ( AVRO, CSV, EDI, Excel,
                JSON, ORC, Parquet, TSV, XML, etc.) based on the file
                extensions.

                * `Custom Text Format`: (Custom Text Parser) Force all files to
                be parsed as custom text files.

                * `XML`: (XML Parser) Force all files to be parsed as
                XML-formatted files.

                * `JSON`: (JSON Parser) Force all files to be parsed as
                JSON-formatted files.

                * `EDI`: (EDI Parser) Force all files to be parsed as
                EDI-formatted files.

                * `Log File`: (Log File Parser) Force all files to be parsed as
                Log File-formatted files.

                * `ORC`: (ORC Parser) Force all files to be parsed as
                ORC-formatted files.

                * `AVRO`: (AVRO Parser) Force all files to be parsed as AVRO
                files.

                * `Parquet`: (Parquet Parser) Force all files to be parsed as
                Parquet files.

                * `Excel`: (Excel Parser) Force all files to be parsed as Excel
                files.

                * `Fixed Width`: (Fixed Width File Parser) Force all files to be
                parsed as fixed-width files.  

                * `PDF`: (PDF Parser) Force all files to be parsed as PDF files.

                * `Unstructured`: (Unstructured.io Parser) This file parsing
                options leverages Unstructured.io's AI to parse unstructured
                data. Choose this option if you want customizations to how the
                files are parsed and Automatic parsing is not sufficient.

                * `SWIFT`: (SWIFT File Parser) This file parser is useful when
                all the files are SWIFT file. Choose this option if you want
                customizations to how the files are parsed and Automatic parsing
                is not sufficient.

                * `Raw File Data`: (Override with Custom File Processor) Use
                this option if you want to bypass Nexla's native parsers and
                only want to use custom file processors for parsing file
                content.
            overriden.extensions:
              type: string
              enum:
                - '*:txt'
                - '*:xml'
                - '*:json'
                - '*:edi'
                - '*:log'
                - '*:orc'
                - '*:avro'
                - '*:parquet'
                - '*:xlsx'
                - '*:fw'
                - '*:pdf'
                - '*:unstructured'
                - '*:swift'
              description: >
                __Force Files to detect to:__ Configure this setting to make the
                platform ignore file extensions and instead parse files as if
                they had a different extension.

                  For example, if the files have a `.dat` extension but contain JSON content, set this to `*:json`, and the platform will process the files as if they were JSON files.

                  __Required__ if `advanced_settings` is anything other than `Auto Detect`

                * `*:txt` if `advanced_settings` is `XML`

                * `*:xml` if `advanced_settings` is `JSON`

                * `*:json` if `advanced_settings` is `XML`

                * `*:edi` if `advanced_settings` is `EDI`

                * `*:log` if `advanced_settings` is `Log File`

                * `*:orc` if `advanced_settings` is `ORC`

                * `*:avro` if `advanced_settings` is `AVRO`

                * `*:parquet` if `advanced_settings` is `Parquet`

                * `*:xlsx` if `advanced_settings` is  `Excel`

                * `*:fw` if `advanced_settings` is `Fixed Width`

                * `*:pdf` if `advanced_settings` is `PDF`

                * `*:unstructured` if `advanced_settings` is `Unstructured`

                * `*:swift` if `advanced_settings` is `SWIFT`
            csv.delimiter:
              type: string
              description: >
                __Text Delimiter__: Delimiters are used to automatically split
                each row of data into multiple attributes. Select one of these
                common delimiters, or enter the character that you wish to use
                as a delimiter.


                Only applicable if `advanced_settings` is `Custom Text Format`

                Default Value: `,`


                Common Values: 

                * `,`: Comma

                * `\t`: Tab

                * `\\n`: Newline

                * `;`: Semicolon

                * `|`: Pipe

                * `^`: Caret
            csv.quote.char:
              type: string
              description: >
                __Text Qualifier Character__: Usually, text in one row is
                separated into multiple attributes based on the delimiter. A
                qualifier character is used to wrap together the text that
                should be treated as one attribute even if it includes
                occurrences of the delimiter.\\n\\n Leave this field blank if
                you wish to use the default qualifier `"`. For example, most CSV
                file generators use `"` as the qualifier; thus, `"one,two"` can
                be one attribute.


                Only applicable if `advanced_settings` is `Custom Text Format`

                Default Value: `"`
            csv.escape.char:
              type: string
              description: >
                __Escape Character__: When reading CSV files, delimiters (like
                commas) separate fields and text qualifiers (like quotes) wrap
                fields. But sometimes these special characters need to appear
                within the field values themselves. The escape character is used
                to indicate that the character following it should be treated as
                regular text, not as a delimiter or qualifier.


                By default, backslash (`\\`) is used as the escape character. If
                your data contains backslashes that should be treated as regular
                text (not as escape characters), you should leave this field
                empty.

                If your CSV parsing is failing, try leaving this field empty,
                especially if your data uses doubled quotes (`\"`) to escape
                quotes or if you want backslashes to be treated as regular
                characters.


                Only applicable if `advanced_settings` is `Custom Text Format`

                Default Value: `\\`
            csv.schema.detection:
              type: string
              description: >
                __Schema Attribute Detection Mode__: Configure this option to
                control how the platform should set Nexset schema attribute
                names for each column of data. Set this option to __generated__
                if your file does not have a row that should be treated as the
                header row, and the platform will assign attribute names like
                `attribute1` and `attribute2`.


                Only applicable if `advanced_settings` is `Custom Text Format`

                Default Value: `header`


                * `header`: Select this option if the file contains a header
                row. Detected Nexset attribute names will be derived from the
                column names in the header row.


                * `generated`: Select this option if the file does not contain a
                header row. Nexla will automatically assign attribute names to
                each column of data.
            csv.skip.first.lines:
              type: integer
              description: >
                __Skip Lines at the Head__: The platform can be configured to
                skip the first few lines of each file before it starts ingesting
                data into records. Set this option if a fixed number of rows in
                each file should be ignored.


                Only applicable if `advanced_settings` is `Custom Text Format`

                Default Value: `0`
            excel.schema.detection:
              type: string
              enum:
                - header
                - generated
              description: >
                __Schema Attribute Detection Mode__: Configure this option to
                control how the platform should set Nexset schema attribute
                names for each column of data. Set this option to __generated__
                if your file does not contain a row that should be treated as
                the header row, and the platform will assign attribute names
                like `attribute1` and `attribute2`.


                Only applicable if `advanced_settings` is `Excel`

                Default Value: `header`


                * `header`: Select this option if the file contains a header
                row. Detected Nexset attribute names will be derived from the
                column names in the header row.


                * `generated`: Select this option if the file does not contain a
                header. Nexla will automatically assign attribute names to each
                column of data.
            sheets:
              type: string
              description: >
                __(Optional) Data Records Cell Range__: Configure the relevant
                cell range if you want only specific cells in your sheets to be
                scanned.


                This is an optional field. Leave the field blank if you want all
                cells to be ingested. You can specify multiple ranges by using
                comma-separated values.


                For example, `sheet1!A1:B5,sheet2!C2:D5` will ingest cells
                `A1:B5` from `sheet 1` and cells `C2:D5` from `sheet2`.


                Only applicable if `advanced_settings` is set to `Excel`
            excel.range.additional:
              type: string
              description: >
                __(Optional) Metadata Cell Range__: By setting the `Data Records
                Cell Range` above you have configured the part of file that
                should be ingested by Nexla as individual records.


                But sometimes, you might want some common data in the file
                outside those cells that should be included in each record. Set
                this field to the appropriate cells path format and Nexla will
                include those attributes in each ingested record.


                1. General format is
                `<sheetname>_<attributecell>:<valuecell>|...|<attributecellN>:<valuecellN>`


                2. Split attribute cell from value cell by using `:` delimiter
                (`<attributecell>:<valuecell>`)


                3. Split different key-value pairs by using `|` delimiter
                (`<attributecell_1>:<valuecell_1>|<attributecell_2>:<valuecell_2>`)


                4. Specify sheetname following with `_` to read from the
                specific sheet.


                5. Do not specify sheetname if you want to read from first
                single sheet by default.


                Only applicable if `advanced_settings` is set to `Excel`  
                   
            excel.skip.merged.cells:
              type: boolean
              description: >
                __Skip Merged cells?__: The platform can be configured to skip
                merged cells when it is ingesting data into records. Select this
                option if you want merged cells to be skipped.


                Only applicable if `advanced_settings` is set to `Excel`

                Default Value: `false`
            json.mode:
              type: string
              enum:
                - row
                - entire.file
              description: >
                __JSON Ingestion Mode__: JSON text files generated by data
                processing systems are often saved in JSON Line format, in which
                each row in the file is a valid JSON object instead of the
                entire file being a valid JSON object.


                Only applicable if `advanced_settings` is set to `JSON`

                * `row`: Each row is a separate JSON object.

                * `entire.file`: The entire file is a valid JSON object.
            json.path:
              type: string
              description: >
                __JSON Path To Data (when Ingestion Mode = entire.file)__: When
                JSON Ingestion Mode is set to `entire.file`, you can configure
                the platform to only ingest part of the JSON object.


                Set this path in JSON Path format to configure the area of the
                file from this Source that should be processed.


                Only applicable if `advanced_settings` is set to `JSON` and
                `json.mode` is `entire.file`
            json.path.additional:
              type: string
              description: >
                __Path to Additional JSON data__: Setting the `JSON Path to
                Data` above configures the part of the data file that should be
                ingested by Nexla as individual records.


                However, sometimes, you might want some common data in the file
                that is located outside of the entered JSON Path to be included
                in each record. Set this field to the appropriate file content
                in JSON path format, and Nexla will include that attribute in
                each ingested record.


                Only applicable if `advanced_settings` is set to `JSON` and
                `json.mode` is `entire.file`
            xml.mode:
              type: string
              enum:
                - row
                - entire.file
              description: >
                __XML Ingestion Mode__: XML files generated by data processing
                systems are often saved such that each row of the file is a
                valid XML object instead of the entire file being a valid XML
                object.


                Only applicable if `advanced_settings` is set to `XML` 


                * `row`: Each row is a separate XML object.

                * `entire.file`: Entire file is a valid XML object.
            xml.xpath:
              type: string
              description: >
                __XPath to Data (when Ingestion Mode = entire.file)__: When XML
                Ingestion Mode is set to `entire.file` you can configure the
                platform to only ingest part of the XML object. 


                Set this path in XPath format to configure the area of the file
                from this Source that should be processed.


                Only applicable if `advanced_settings` is set to `XML`  and
                `xml.mode` is set to `entire.file`
            xml.xpath.additional:
              type: string
              description: >
                __Path to Additional XML data__: Setting the `XPath to Data`
                above configures the part of the data file that should be
                ingested by Nexla as individual records.


                However, sometimes, you might want some common data in the file
                that is located outside of the entered XPath to be included in
                each record. Set this field to the appropriate file content in
                XPath format, and Nexla will include that attribute in each
                ingested record.


                Only applicable if `advanced_settings` is set to `XML`  and
                `xml.mode` is set to `entire.file`
            edi.xpath:
              type: string
              description: >
                __EDI XPath__: Set the path (in XPath format) to the area of the
                file that should be processed as EDI content. Note that this
                option is necessary when the entire file isn't a valid EDI file
                and only a portion of the file content is valid EDI content


                Only applicable if `advanced_settings` is set to `EDI`
            grok.pattern:
              type: string
              enum:
                - '%{SYSLOGBASE}'
                - '%{COMBINEDAPACHELOG}'
                - '%{NAGIOSLOGLINE}'
                - '%{POSTGRESQL}'
                - '%{REDISLOG}'
                - '%{JAVASTACKTRACEPART}'
              description: >
                __Grok Pattern__: Each line of a log file is parsed into
                multiple attributes by applying a Grok Pattern.


                Grok works by combining text patterns into something that
                matches your logs. Select one of these predefined patterns, or
                write your own custom Grok Pattern that should be applied when
                parsing log files.

                **Predefined Patterns**: Depending on your log file content, one
                of these predefined patterns might be best suited for your use
                case.  Alternately you can also type in your own custom Grok
                Pattern. 

                - `%{SYSLOGBASE}`

                - `%{COMBINEDAPACHELOG}`

                - `%{NAGIOSLOGLINE}`

                - `%{POSTGRESQL}`

                - `%{REDISLOG}`

                - `%{JAVASTACKTRACEPART}`


                Only applicable if `advanced_settings` is set to `Log File`
            field.lengths:
              type: string
              description: >
                __Length of Each Field in File__: Enter the length of each field
                in the file. This should be entered as a comma-separated list of
                numbers, for ex: `10,12,8,15,20`.


                __Required__ and __applicable__ only if `advanced_settings` is
                set to `Fixed Width`. 
            fixed.width.schema.detection.mode:
              type: string
              enum:
                - header
                - generated
              description: >
                __Schema Attribute Detection Mode__: Configure this option to
                control how the platform should set Nexset schema attribute
                names for each column of data.


                * `header`: Select this option if the file contains a header
                row. Detected Nexset attribute names will be derived from the
                column names in the header row.


                * `generated`: Select this option if the file does not contain a
                header row. Nexla will automatically assign attribute names to
                each column of data.


                __Applicable__ only if `advanced_settings` is set to `Fixed
                Width`.
            padding.character:
              type: string
              description: >
                __Padding Character__: Choose or type the character that acts as
                the separator between fields. For ex: `_`. 


                Only applicable if `advanced_settings` is `Fixed Width`

                Default: single space ` `


                Common Values: 

                * ` `: Single Space

                * `` : No Padding

                * `,`: Comma

                * `\\t`: Tab

                * `\\n`: Newline

                * `;`: Semicolon

                * `|`: Pipe

                * `^`: Caret     
            line.separator.detection.enabled:
              type: boolean
              description: >
                __Auto detect line separators?__: Set this option on if you wish
                the platform to automatically detect line separators in the
                document. 


                Only applicable if `advanced_settings` is `Fixed Width`

                Default: true                                  
            line.separator:
              type: string
              description: >
                __Line Separation Character__: Specify the character that should
                be recognized by the platform as an indicator of a new line. 


                Only applicable if `advanced_settings` is `Fixed Width` and
                `line.separator.detection.enabled` is set to `true`.


                Default:  `\\n`


                Common Values: 

                * `\\t`: Tab

                * `\\n`: Newline
            remove.quotes.forced:
              type: boolean
              description: >
                __Remove Quote Characters?__: Set this option to true if you
                wish the platform to force remove quotes from strings where it
                is safe to do so. 


                Only applicable if `advanced_settings` is `Fixed Width`.

                Default: false 
            quote.char:
              type: string
              description: >
                __Quote Character__: Set the character to be treated as a quote
                character. This is relevant if the Remove Quotes Character
                setting is enabled.


                Leave this field blank if you wish to use the default qualifier
                `"` 


                Only applicable if `advanced_settings` is `Fixed Width` and
                `remove.quotes.forced` is set to `true`.  
            scalar.coercion:
              type: boolean
              description: >
                __Force Scalar Coercion of String Values?__: Set this option on
                if you wish to force coercion of string values to scalar types. 


                Only applicable if `advanced_settings` is `Fixed Width`

                Default: true
            fixed.width.skip.first.lines:
              type: integer
              description: >
                __Skip Lines at the Head__: The platform can be configured to
                skip the first few lines of each file before it starts ingesting
                data into records. Set this option if a fixed number of rows in
                each file should be ignored.


                Only applicable if `advanced_settings` is `Fixed Width`

                Default Value: `0`
            fixed.width.skip.last.lines:
              type: integer
              description: >
                __Skip Lines at the Tail__: The platform can be configured to
                skip the last few lines of each file before it starts ingesting
                data into records. Set this option if a fixed number of rows in
                each file should be ignored.


                Only applicable if `advanced_settings` is `Fixed Width`

                Default Value: `0`
            pdf.parsing.strategy:
              type: string
              enum:
                - text
                - semi-auto
                - auto-1
                - auto-2
                - image
              description: >
                __Parsing mode__: Choose the mode for extracting text from the
                PDF Files.


                The `text` strategy is used to extract the textual layer from
                the PDF file. It will emit one record per page. The `semi-auto`
                strategy uses hints to extract structured data from the PDF
                file.


                * `text`: This strategy is used to extract the textual layer
                from the PDF file. It will emit one record per page with two
                attributes: `type` with value `text`, and `text` with value
                equal to extracted content of entire page.


                * `semi-auto`: This strategy uses hints to extract structured
                data from the PDF file.


                * `auto-1`: (auto-textract) This strategy uses Textract for
                parsing PDF file.


                * `auto-2`: (auto-tesseract) This strategy uses Tesseract for
                parsing PDF file.


                * `image`: (image) This strategy exports each page as a
                Base64-encoded PNG image.


                __Applicable__ only if `advanced_settings` is set to `PDF`.
            pdf.rendering.strategy:
              type: string
              enum:
                - default
                - embedded
                - extended
                - table.as.message
                - document.as.message
              default: default
              description: >
                __Page Metadata Inclusion Mode__: Choose the mode for including
                page metadata in the generated content. This is relevant if you
                are generating embeddings from the source and wish to include
                information like page number in the embedded content.


                * `default`: (Default: Exclude From Data) This strategy is used
                to extract the textual layer from the PDF file. It will emit one
                record per page with two attributes: `type` with value `text`,
                and `text` with value equal to extracted content of entire page.


                * `embedded`:(Embedded: Include With Embeddings) Choose this
                option if you wish to include page metadata in embeddings. This
                is only relevant if you have opted into generating embeddings.


                * `extended`: (Extended: Include Without Embeddings)  Choose
                this option if you wish to include page metadata in the
                generated content when embeddings are not generated.


                * `table.as.message`: (Message Per Table) Choose this option if
                you wish to emit one message per table in the document. This
                option is useful if your processing logic requires table-level
                granularity.


                * `document.as.message`: (File Content as Message) Choose this
                option if you wish to emit one message for entire file. This
                option is useful if your processing logic requires file-level
                granularity.


                __Applicable__ only if `advanced_settings` is set to `PDF`.
            pdf.parsing.emitTextBlocks:
              type: boolean
              description: >
                __Extract Text Blocks?__: When parsing a PDF file only table
                blocks are extracted. This option allows you to extract
                additional text blocks between table blocks as record.


                __Applicable__ only if `advanced_settings` is set to `PDF` and
                `pdf.parsing.strategy` is `semi-auto`. 


                Default: true 
            pdf.document.password:
              type: string
              description: >
                __(Optional) Document Password__: Enter the password for opening
                and processing the PDF files if they are password protected.


                __Applicable__ only if `advanced_settings` is set to `PDF`.
            pdf.parsing.emptyValuePlaceholder:
              type: string
              description: >
                __Placeholder Text for empty values__: Set the text placeholder
                to be used if a cell in the parsed table is empty.


                __Applicable__ only if `advanced_settings` is set to `PDF`. 


                Default: `(blank)` 
            pdf.parsing.tables:
              type: string
              description: >
                __Configuration Settings for Extracting Tables__:  Set this
                property with all configuration settings required for extracting
                Nexla records from different slices of structured data in the
                file. This property must be a valid JSON object, with some or
                all of the keys listed below.


                1. `columns`: This must be an array of column names in the
                table. This is the only **required** property in this object.
                Column names should be listed from left to right or top to
                bottom. There are two special values : `(blank)` for a column
                without a name in the table and `(column)` or `(column=Desired
                Name)` for empty columns.


                2. `forceBoldHeaders`: A boolean that defaults to false. If
                true, this property only treats headers that are in bold as
                attribute names.


                3. `forceFullWidth`: A boolean that defaults to true. If true,
                the parser uses entire page width as table width, else the
                parser tries to treat least possible width as table width.


                4. `header`: Configures whether columns are defined horizontally
                (value `ROW`) or vertically (value `COLUMN`).


                5. `tupleNumber`: An integer value if the header mode is set to
                COLUMN and the table does not take up entire page width.


                6. `spacing`: A double data type used for tuning for complex
                documents. Defaults to 2.5 



                __Applicable and required__ if `advanced_settings` is set to
                `PDF` and `pdf.parsing.strategy` is `semi-auto`. 


                Example: `[{\n\t\"columns\": [  ]\n}]`
            pdf.parsing.auto-1.outputText:
              type: boolean
              description: >
                __Extract Text Blocks?__: Set this option to true if you wish to
                extract text blocks from the PDF file. 


                __Applicable__ only if `advanced_settings` is set to `PDF` and
                `pdf.parsing.strategy` is `auto-1`.


                Default Value: `true`
            pdf.parsing.auto-1.outputTables:
              type: boolean
              description: >
                __Extract Table Blocks?__: Set this option to true if you wish
                to extract table blocks from the PDF file. 


                __Applicable__ only if `advanced_settings` is set to `PDF` and
                `pdf.parsing.strategy` is `auto-1`.


                Default Value: `true`
            pdf.parsing.image.scale:
              type: string
              description: >
                __Image Scale__: Set the scale factor for the image.


                __Applicable__ only if `advanced_settings` is set to `PDF` and
                `pdf.parsing.strategy` is `image`.


                Default Value: `1.25`
            unstructured.gz.uncompressed.content.type:
              type: string
              enum:
                - application/pdf
              description: >
                __Content Type for Compressed Files__: In case the files in your
                file system are compressed files, set this to the expected
                content type of the files after they have been uncompressed.


                * `application/pdf`: Set this if the files are compressed PDF
                files.


                __Applicable__ only if `advanced_settings` is set to
                `Unstructured`.
            unstructured.encoding:
              type: string
              description: >
                __Content Encoding Method__: Set this to the content encoding
                method that should be used for decoding text input.


                __Applicable__ only if `advanced_settings` is set to
                `Unstructured`.
            unstructured.include.page.breaks:
              type: boolean
              default: false
              description: >
                __Include Page Breaks?__: Set this option to true if you wish to
                include page breaks in the extracted content.


                __Applicable__ only if `advanced_settings` is set to
                `Unstructured`.
            unstructured.pdf.infer.table.structure:
              type: boolean
              default: false
              description: >
                __Infer Table Structure In PDFs?__: Set this to true if you wish
                to include 'text_as_html' metadata for table elements within
                PDFs.


                __Applicable__ only if `advanced_settings` is set to
                `Unstructured`.
            unstructured.chunking.strategy:
              type: string
              enum:
                - ''
                - by_title
              description: >
                __Chunking Strategy__: Set this to the strategy for chunking the
                returned elements. Leave it blank for default strategy.


                * ``: Default strategy.

                * `by_title`: Chunk by title.


                __Applicable__ only if `advanced_settings` is set to
                `Unstructured`.
            unstructured.multipage.sections:
              type: boolean
              default: true
              description: >
                __Allow Sections to Span Multiple Pages__: Set this to true for
                allowing sections to span multiple pages. This is only
                applicable if chunking strategy has been set.


                __Applicable__ only if `advanced_settings` is set to
                `Unstructured` and `unstructured.chunking.strategy` is set to
                `by_title`.
            unstructured.combine.under.n.chars:
              type: integer
              default: 500
              description: >
                __Minimum # of characters for combing elements__: Set this to
                minimum number of characters in a section until which elements
                should be combined.


                __Applicable__ only if `advanced_settings` is set to
                `Unstructured` and `unstructured.chunking.strategy` is set to
                `by_title`.
            unstructured.new.after.n.chars:
              type: integer
              default: 1500
              description: >
                __(Soft) Maximum # of characters in a section__: Set this to
                (soft) maximum number of characters that can be present in a
                section. This is a soft maximum. A new section will be created
                soon after / before this number is hit.


                __Applicable__ only if `advanced_settings` is set to
                `Unstructured` and `unstructured.chunking.strategy` is set to
                `by_title`.
            unstructured.max.characters:
              type: integer
              default: 1500
              description: >
                __(Hard) Maximum # of characters in a section__: Set this to
                (hard) maximum number of characters that can be present in a
                section.


                __Applicable__ only if `advanced_settings` is set to
                `Unstructured` and `unstructured.chunking.strategy` is set to
                `by_title`.
            lenient:
              type: boolean
              default: true
              description: >
                __Is lenient?__: Indicates whether the parser is permissive or
                not. Defaults to true, meaning the parser will do a best effort
                to read as much from the message content as possible regardless
                of the content and block boundaries being valid or not.


                __Applicable__ only if `advanced_settings` is set to `SWIFT`.


                Default Value: `true`
            parse.text.block:
              type: boolean
              default: true
              description: >
                __Should Parse Text Block?__: Set this to true you if you wish
                the text block (block 4) to be parsed.


                __Applicable__ only if `advanced_settings` is set to `SWIFT`.


                Default Value: `true`
            parse.trailer.block:
              type: boolean
              default: true
              description: >
                __Should Parse Trailer Block?__: Set this to true you if you
                wish the trailer block (block 5) to be parsed.


                __Applicable__ only if `advanced_settings` is set to `SWIFT`.


                Default Value: `true`
            parse.user.block:
              type: boolean
              default: true
              description: >
                __Should Parse User Block?__: Set this to true you if you wish
                the user block to be parsed.


                __Applicable__ only if `advanced_settings` is set to `SWIFT`.


                Default Value: `true`
            runtime_data_credentials_id:
              type: integer
              description: >
                __Runtime Data Credentials For LLM__: Set the Nexla Credential
                Id for the OpenAI API that should be used for generating
                embeddings.


                __Applicable and required__ only if `post.processor` is set to
                `true`.
            model:
              type: string
              description: >
                __Embedding Model__: Set the model that should be used for
                generating embeddings.


                __Applicable and required__ only if `post.processor` is set to
                `true`.


                Example: `text-embedding-ada-002`
            property:
              type: string
              description: >
                __Attribute for embeddings__: Set the data property that should
                be used for generating embeddings. For example, if your input
                data has a property called `text` that you wish to use for
                embeddings, set this value to `text`.


                __Applicable and required__ only if `post.processor` is set to
                `true`.


                Example: `text`
            chunk_threshold:
              type: integer
              default: 1000
              description: >
                __Chunking Limit__: Set the size segments that the parsed text
                should be broken down to.


                __Applicable__ only if `post.processor` is set to `true`.


                Default Value: `1000`
            ai.function.id:
              type: integer
              description: >
                __AI Function ID__: Set the Nexla AI function to be used for
                post-processing these files before the data is delivered to the
                Nexset.


                __Applicable__ only if `ai.function` is set to `true`.
            ignore.files.older.than.ms:
              type: integer
              format: epoch
              description: >
                __Only read files modified after:__ Set this property to
                indicate whether the platform should skip the ingestion of some
                files based on the file modification date.


                Note that the platform always keeps track of whether or not a
                file has been processed. Therefore, changes to a previously
                ingested (or ignored) file that cause a change in its
                modification date do result in the file being processed again.


                Default value: ''
            path_exclusions:
              type: boolean
              description: >
                __Customize Paths to be Scanned/Ignored__: Once you have
                selected a root bucket/folder/path to be scanned for data, you
                can further indicate specific path patterns to be scanned or
                ignored within the selected pattern.


                Enable this setting and configure the relevant path patterns if
                you want the platform to scan (or ignore) all sub-folders or
                files that match a pattern.


                Default Value: `false`
            whitelist.pathmatchers:
              type: string
              description: >
                __Paths to be scanned Eg. **/Done/__: Configure a path pattern
                if you want to only scan sub-folders or files that match a
                pattern. For example, enter `**/ABC/*` if you would like to only
                scan files in the subfolder ABC.


                **Note**:

                1. Patterns must match the **Apache Ant Path Pattern**. See
                [Apache Ant Path
                Documentation](https://ant.apache.org/manual/dirtasks.html) for
                examples.

                2. Patterns must start from the root of the location accessible
                to the credentials.

                3. You will still need to select a base folder (root or a
                subfolder). Only pattern matches that are inside the selected
                base folder will be scanned.

                 Only applicable if  `path_exclusions` is `true`
            blacklist.pathmatchers:
              type: string
              description: >
                __Paths NOT to be scanned. E.g., **/archives/__: Configure a
                path pattern if you do __NOT__ want to scan sub-folders or files
                that match a pattern. For example, enter `**/ABC/*` if you would
                like to ignore files that are in the subfolder ABC.

                **Note** 

                1. Patterns must match the **Apache Ant Path Pattern**. See
                [Apache Ant Path
                Documentation](https://ant.apache.org/manual/dirtasks.html) for
                examples.

                2. Patterns must start from the root of the location accessible
                to the credentials.

                3. You will still need to select a base folder (root or a
                subfolder). Only pattern matches that are inside the selected
                base folder will be ignored.


                Only applicable if  `path_exclusions` is `true`
            timezone:
              type: string
              description: |
                __Timezone for Path Format__
                Only applicable if  `path_exclusions` is `true`
            schema.detection.once:
              type: boolean
              description: >
                __Force a Single Schema__: The platform's automatic Nexset
                detection mechanism ensures that similar files are always
                processed as the same Nexset, even if the file extensions are
                different.


                However, sometimes, it might be beneficial to bypass Nexset
                detection and enforce a single schema. Use this setting to force
                the platform to only detect one Nexset for this Source.


                For example, you might want to force a single schema in the
                following scenarios:

                1. Your business case requirement is time-sensitive to any
                processing latencies, and you know that the data will always be
                in the same structure. While the Schema Detector does not incur
                a large overhead per file, for high file volumes, bypassing this
                additional processing might result in noticeable improvement.

                2. You know that files should always be processed as the same
                Nexset, but there is a high likelihood of sparse data. As the
                Detector might not find significant overlap in the case of
                sparse data, enforcing a single schema will ensure that the
                detector will only grow the Nexset, regardless of the presence
                or absence of overlapping.


                Default Value: `false`
            allowGrouping:
              type: boolean
              description: >
                __Enable Grouping__: Set this option and associated settings if
                you have files in which rows of data need to be combined based
                on the value of a key.


                For example, this is useful if you have CSV files with a column
                __order_number__ in addition to other columns of information
                about that order, and instead of including each row as a unique
                record, you want a Nexset in which all orders with the same
                number are concatenated as one record at the time of ingestion.
                To produce a Nexset with the record structure including the
                attribute __order_number__ and another attribute
                __order_details__, with an array of objects containing the
                values of the other columns, you can set __order_number__ as the
                __Grouping Key Attribute__ and __order_details__ as the
                __Grouped Field Name__.


                Default Value: `false`
            group.by.keys:
              type: string
              description: >
                __Grouping Key Attribute__: The name of the column/attribute
                based on which grouping needs to be performed.


                For example, if you have CSV files with a column
                __order_number__ in addition to other columns of information
                about that order and grouping needs to be performed based on the
                column __order_number__, set the value in this box to
                __order_number__. Data will now be grouped by the
                __order_number__.


                Required and only applicable if ` allowGrouping` is `true`.    
            group.field.name:
              type: string
              description: >
                __Grouped Field Name__: Enter the attribute name for the grouped
                object in the resulting Nexset.


                For example, if you have CSV files with a column
                __order_number__ in addition to other columns of information
                about that order, and grouping needs to be performed based on
                the __order_number__, set this input to __order_details__. The
                resulting Nexset will contain the attribute __order_details__,
                which will include an array of objects containing the content of
                each row of grouped data.


                Required and only applicable if ` allowGrouping` is `true`.
                      
            group.publish.null.key:
              type: string
              description: >
                __Publish value of null key in grouping__: You can configure how
                the platform should process rows of data in which the Grouping
                Key Attribute is missing.


                Turn on this setting, and the platform will assign such rows to
                a Grouping Key Attribute with the value `null`. Turn off this
                setting, and the platform will ignore such rows.


                Only applicable if ` allowGrouping` is `true`
    azure_blb_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/file_data_source'
    azure_data_lake_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/file_data_source'
    azure_synapse_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
    bigquery_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
    box_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/file_data_source'
    WithCDCSupport:
      type: object
      properties:
        source_config:
          type: object
          required:
            - start.cron
            - db_query_mode
          properties:
            start.cron:
              type: string
              description: >
                __Scheduling Frequency__: The interval at which Nexla should
                scan this source for new data. This must be in the form of a
                cron expression.
              example: 0 0 22 10 11 ? 2022
            db_query_mode:
              type: string
              enum:
                - Default
                - Query
              description: >
                __Database Fetch Mode__: Database connectors are designed to
                support self-serve capabilities for use cases ranging from
                simple table ingestion to ingestion based on complex custom
                queries. 


                * `Default`: Equivalent to running a simple (but optimized)
                SELECT clause on any database table, along with some additional
                customizations for filtering rows. 


                * `Query`: Execute data fetching based on a custom database
                query using the syntax and convention supported by the
                underlying database/warehouse.
            query:
              type: string
              description: >
                __Query__: Set the Query to be executed during each ingestion
                cycle.


                __Required__ if `db_query_mode` is `Query`
            database:
              type: string
              description: >
                __Database__: Database whose table needs to be scanned for
                data. 


                __Required__ if `db_query_mode` is `Default`
            table:
              type: string
              description: |
                __Table__: Table that needs to be scanned for data. 

                __Required__ if `db_query_mode` is `Default`
            mode:
              type: string
              enum:
                - none
                - incrementing
                - timestamp
                - incrementing,timestamp
              description: >
                __Table Scan Mode__: The default configuration of Table Mode is
                set to read all data in a table in each ingestion cycle, which
                is equivalent to a running `SELECT` clause on the table.
                However, when the table contains much more historical data than
                you wish to scan, you can instruct the platform to begin loading
                from a specific __id__ (stored in a numeric column),
                __timestamp__ (stored in a date-time column) or __both id and
                timestamp__.


                You can use the relevant Table Scan Mode to address this use
                case of partial loading from a table.


                Note that this can also be achieved by writing a properly
                structured query in Query Mode.


                Only applicable if `db_query_mode` is `Default` and
                `cdc.enabled` is `false`

                Default Value: `none`


                * `none`: Read the whole table


                * `incrementing`: Start reading from a specific ID


                * `timestamp`: Start reading from a specific timestamp


                * `incrementing,timestamp`: Start reading from a specific ID and
                timestamp
            incrementing.column.name:
              type: string
              description: >
                __ID Column__: The ID column that should be used for executing
                partial data loading from the selected table. This must be a
                numeric column.


                Only applicable if `db_query_mode` is `Default` and `mode` is
                `incrementing` or `incrementing,timestamp`
            incrementing.load.from:
              type: string
              description: >
                __Starting ID__: The starting ID value of __ID Column__ from
                which the platform should start ingesting data.


                Only applicable if `db_query_mode` is `Default` and `mode` is
                `incrementing` or `incrementing,timestamp`
            timestamp.column.name:
              type: string
              description: >
                __Timestamp Column__: The timestamp column that should be used
                for executing partial data loading from the selected table. This
                must be a date-time column.


                Only applicable if `db_query_mode` is `Default` and `mode` is
                `timestamp` or `incrementing,timestamp`
            timestamp.load.from:
              anyOf:
                - type: integer
                - type: string
                  format: date-time
              description: >
                __Starting Timestamp__: The timestamp value of the __Timestamp
                Column__ from which the platform should start ingesting data.
                This must be a UNIX epoch- (milliseconds) or ISO-formatted date
                value (e.g., 2016-01-01T12:13:14).


                Only applicable if `db_query_mode` is `Default` and `mode` is
                `timestamp` or `incrementing,timestamp`
            commit.on.read:
              type: string
              format: boolean
              enum:
                - 'false'
                - 'true'
              description: >
                __Perform Database Commit after Read?__: You can instruct the
                platform to execute a database commit if the query includes
                statements that should also be committed to the database after
                ingestion. This is typically not the case, so most of the time,
                the value should be left as false.


                Only applicable if `db_query_mode` is `Query`


                Default Value: `"false"`
            cdc.enabled:
              type: boolean
              description: >
                __Enable Change Data Capture (CDC)__: Select this option if you
                would like the platform to monitor database transaction logs to
                determine data ingestion.


                Note that your DBA will need to grant necessary Change Data
                Capture permissions to allow Nexla to access transaction logs.
                Contact Nexla support for relevant instructions.


                If limitations that prevent you from enabling CDC controls on
                your database are in place, you can still set up this source for
                incremental ingestion by disabling this option and instead
                selecting incremental table ingestion rules.


                Default value: `false`


                __Applicable__ if `db_query_mode` is `Default`
            cdc.snapshot.enabled:
              type: boolean
              description: >
                __CDC: Ingest Initial Snapshot__: Choose this option if you want
                to perform a one-time historical load of all data in the table
                during the first ingestion from the source. If this option is
                disabled, only events observed after the source is first
                activated will be processed.


                Default value: `false`


                __Applicable__ if `db_query_mode` is `Default` and `cdc.enabled`
                is `true`
            cdc.capture.delete:
              type: boolean
              description: >
                __CDC: Track Deletions__: Choose this option if you also need to
                track deletions.


                You might want this option enabled if you intend to link this
                source to a destination that needs to be kept in sync with the
                source by tracking and removing any rows that have been deleted.


                With this option enabled, the detected Nexset will include a
                Nexset record for each deletion event. This record will always
                contain a `nexla_op` attribute with the value `DELETE`.
                Additionally, it will include either the primary key of the
                deleted row or, if the table contains no primary key columns,
                the content of the entire row.


                Default value: `false`


                __Applicable__ if `db_query_mode` is `Default` and `cdc.enabled`
                is `true`
    cloudsql_mysql_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithCDCSupport'
    cloudsql_postgres_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithCDCSupport'
    cloudsql_sqlserver_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithCDCSupport'
    stream_data_source:
      type: object
      properties:
        source_config:
          type: object
          required:
            - start.cron
            - parser.type
          properties:
            start.cron:
              type: string
              description: >
                __Scheduling Frequency__: The interval at which Nexla should
                scan this source for new files. This must be in the form of a
                cron expression.
              example: 0 0 22 10 11 ? 2022
            parser.type:
              type: string
              enum:
                - json
                - csv
                - tsv
                - txt
                - xml
              description: >
                __Data Format__: Select the data format parser for the data in
                the topic. This is usually JSON.
    confluent_kafka_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/stream_data_source'
        - type: object
          properties:
            source_config:
              type: object
              required:
                - topic
              properties:
                topic:
                  type: string
                  description: |
                    __Topic__: Select the topic for your data.
                offset.mode:
                  type: string
                  enum:
                    - earliest
                    - from_date
                    - latest
                    - manual
                  description: >
                    __Offset Mode__: You can configure the default offset mode
                    to be used for reading data from the topic.


                    Usually set to `earliest`
                start.from.date:
                  type: string
                  description: >
                    __Consume Data From Date__: You can choose to configure this
                    source for reading data from a specific date. Enter the
                    starting date for data ingestion.


                    __Required__ if `offset.mode` is `from_date`
                start.from.offsets:
                  type: string
                  description: >
                    __Consume Data From Offset__: You can choose to configure
                    this source for reading data from a specific offset. Enter
                    the starting offset for data ingestion.


                    __Required__ if `offset.mode` is `manual`
                parser.type:
                  type: string
                  enum:
                    - json
                    - csv
                    - tsv
                    - txt
                    - xml
                    - avro
                  description: >
                    __Data Format__: Select the data format parser for the data
                    in the topic. This is usually JSON.              
                key.deserializer:
                  type: string
                  description: >
                    __Key Deserializer__: Enter the type of key deserializer
                    that should be used to read keys from the Kafka topic. This
                    is usually in the form
                    `org.apache.kafka.common.serialization.StringDeserializer`.


                    Recommended default value: 

                    - `org.apache.kafka.common.serialization.StringDeserializer`
                    if `parser.type` is `csv`, `tsv`, `txt`, `xml`, or `json`

                    -
                    `org.apache.kafka.common.serialization.ByteArrayDeserializer`
                    if `parser.type` is `avro`
                value.deserializer:
                  type: string
                  description: >
                    __Value Deserializer__: Enter the type of value deserializer
                    that should be used to read from the Kafka topic. This is
                    usually in the form
                    `org.apache.kafka.common.serialization.StringDeserializer`.


                    Recommended default value: 

                    - `org.apache.kafka.common.serialization.StringDeserializer`
                    if `parser.type` is `csv`, `tsv`, `txt`, `xml`, or `json`

                    -
                    `org.apache.kafka.common.serialization.ByteArrayDeserializer`
                    if `parser.type` is `avro`
                serialization.variant:
                  type: string
                  description: >
                    __Serialization Variant__: Set the variant of serializer for
                    processing data. This is required for AVRO parser. Typically
                    this should be set to `confluent`.


                    __Applicable__ if `parser.type` is `avro`
    databricks_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
    db2_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
    dropbox_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/file_data_source'
    nosql_data_source:
      type: object
      properties:
        source_config:
          type: object
          required:
            - start.cron
            - collection
            - mode
          properties:
            start.cron:
              type: string
              description: >
                __Ingestion Frequency__: The interval at which Nexla should scan
                this source for new data. This must be in the form of a cron
                expression.
              example: 0 0 22 10 11 ? 2022
            database:
              type: string
              description: >
                __Database__: The database whose collection needs to be scanned
                for data.


                __Required__ if the `data_credentials` access for this
                destination is not limited to one database.
            collection:
              type: string
              description: >
                __Collection__: The collection that needs to be scanned for
                data.
            mode:
              type: string
              enum:
                - default
                - timestamp
                - query
              description: >
                __Filter Collections__: Instead of reading all the documents in
                a collection in each ingestion cycle, you can instruct the
                platform to ingest only some documents.


                In some scenarios, when the collection contains much more
                historical data than you wish to scan, you might want to
                instruct the platform to begin loading from a specific
                __timestamp__. You can also write your filter queries to set
                rules based on which documents from the collection should be
                ingested.


                - `default`: Read all documents in the collection.

                - `timestamp`: Start reading from a specific timestamp.

                - `query`: Filter using Query.
              default: default
            timestamp.key:
              type: string
              description: >
                __Timestamp Attribute__: Set the document metadata attribute
                that should be used to execute partial data loading from the
                selected collection. This must be an attribute containing a
                date-time value, such as `created_at`.


                __Applicable and required__ if `mode` is `timestamp`.
            timestamp.load.from:
              type: string
              description: >
                __Starting Timestamp__: Set the timestamp value of the
                __Timestamp Key__ from which the platform should start ingesting
                data. This must be a UNIX epoch (milliseconds) or ISO-formatted
                date-time value (e.g., 2016-01-01T12:13:14).


                __Applicable and required__ if `mode` is `timestamp`.
            timestamp.load.to:
              type: string
              description: >
                __Ending Timestamp__: Set the timestamp value of the __Timestamp
                Key__ at which the platform should end ingesting data. This must
                be a UNIX epoch (milliseconds) or ISO-formatted date-time value
                (e.g., 2016-01-01T12:13:14).


                __Applicable__ if `mode` is `timestamp`.
    dynamodb_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/nosql_data_source'
        - type: object
          properties:
            source_config:
              type: object
              properties:
                dynamodb.filter.expression:
                  type: string
                  description: >
                    __DynamoDB Filter Expression__: Enter a valid DynamoDB Query
                    expression to filter collections.


                    See
                    https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Query.html#Query.FilterExpression
                    for information about the Filter Expression structure.


                    Example: `#name = :name_value`.


                    __Applicable and required__ if `mode` is `query`.
                dynamodb.filter.attributes.values:
                  type: string
                  description: >
                    __Filter Expression: Attribute Values__: Set attribute
                    values for attributes that are used in your filter
                    expression.


                    See
                    https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Query.html#Query.FilterExpression
                    for information about the Filter Expression structure.


                    For example, for the above expression, this value is
                    `{":name_value":{"S":"My Name"}}`.


                    __Applicable__ if `mode` is `query`.
                dynamodb.filter.attributes.names:
                  type: string
                  description: >
                    __Filter Expression: Attribute Names__: Set attribute names
                    for attributes that are used in your filter expression.


                    See
                    https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Query.html#Query.FilterExpression
                    for information about the Filter Expression structure.


                    For example, for the above expression, this value is
                    `{"#name":"name_column"}`.


                    __Applicable__ if `mode` is `query`.
    file_upload_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/file_data_source'
    firebase_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/nosql_data_source'
        - type: object
          properties:
            source_config:
              type: object
              properties:
                firebase.query:
                  type: string
                  description: >
                    __Query Expression__: Set the Query to be executed during
                    each ingestion cycle. The query content should be a valid
                    JSON object in Nexla Firebase query DSL. Please contact
                    Nexla support for tips on writing valid queries.


                    Example: `{"filters": [ { "fieldName": "name", "operator":
                    "EQUAL", "fieldType": "string", "stringValue": "test" }]}`
                    results in documents containing a `name` property with the
                    value `test`.


                    __Applicable and required__ if `mode` is `query`.
    firebolt_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
    ftp_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/file_data_source'
    gcp_alloydb_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithCDCSupport'
    gcp_spanner_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
        - type: object
          properties:
            source_config:
              type: object
              properties:
                enable.spanner.data.boost:
                  type: boolean
                  description: >
                    __Enable Spanner Data Boost?__: Set this option to True if
                    you want to leverage Spanner Data Boost capability for this
                    source. Note that the service account used in the credential
                    must have `spanner.databases.useDataBoost` IAM permission
                    for successfully running the query with Data Boost.


                    Default: `false`
    gcs_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/file_data_source'
    gdrive_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/file_data_source'
    google_pubsub_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/stream_data_source'
        - type: object
          properties:
            source_config:
              type: object
              required:
                - subscription
              properties:
                subscription:
                  type: string
                  description: |
                    __Subscription__: Select the subscription for your data.
                offset.mode:
                  type: string
                  enum:
                    - earliest
                    - from_date
                    - latest
                    - manual
                  description: >
                    __Offset Mode__: You can configure the default offset mode
                    used to read data from the topic.


                    Usually set to `earliest`
                start.from.date:
                  type: string
                  description: >
                    __Consume Data From Date__: You can choose to configure this
                    source for reading data from a specific date. Enter the
                    starting date for data ingestion.


                    __Required__ if `offset.mode` is `from_date`
                start.from.offsets:
                  type: string
                  description: >
                    __Consume Data From Offset__: You can choose to configure
                    this source for reading data from a specific offset. Enter
                    the starting offset for data ingestion.


                    __Required__ if `offset.mode` is `manual`
                key.deserializer:
                  type: string
                  description: >
                    __Key Deserializer__: Enter the type of key deserializer
                    that should be used for reading keys from the topic. This is
                    usually in the form
                    `org.apache.kafka.common.serialization.StringDeserializer`.


                    Default value:
                    `org.apache.kafka.common.serialization.StringDeserializer`
                value.deserializer:
                  type: string
                  description: >
                    __Value Deserializer__: Enter the type of value deserializer
                    that should be used for reading from the topic. This is
                    usually in the form
                    `org.apache.kafka.common.serialization.StringDeserializer`.


                    Default value:
                    `org.apache.kafka.common.serialization.StringDeserializer`
    hana_jdbc_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
    hive_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
    jms_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/stream_data_source'
        - type: object
