              type: object
              required:
                - source.type
                - source.name
              properties:
                source.type:
                  type: string
                  enum:
                    - topic
                    - queue
                  description: >
                    __Type of Source__: Select whether the source is a `topic`
                    or `queue`.
                source.name:
                  type: string
                  description: >
                    __Topic or Queue Name__: Configure the topic or queue from
                    which data needs to be ingested.
    kafka_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/stream_data_source'
        - type: object
          properties:
            source_config:
              type: object
              required:
                - topic
              properties:
                topic:
                  type: string
                  description: |
                    __Topic__: Select the topic for your data.
                offset.mode:
                  type: string
                  enum:
                    - earliest
                    - from_date
                    - latest
                    - manual
                  description: >
                    __Offset Mode__: You can configure the default offset mode
                    to be used for reading data from the topic.


                    Usually set to `earliest`
                start.from.date:
                  type: string
                  description: >
                    __Consume Data From Date__: You can choose to configure this
                    source for reading data from a specific date. Enter the
                    starting date for data ingestion.


                    __Required__ if `offset.mode` is `from_date`
                start.from.offsets:
                  type: string
                  description: >
                    __Consume Data From Offset__: You can choose to configure
                    this source for reading data from a specific offset. Enter
                    the starting offset for data ingestion.


                    __Required__ if `offset.mode` is `manual`
                key.deserializer:
                  type: string
                  description: >
                    __Key Deserializer__: Enter the type of key deserializer
                    that should be used to read keys from the Kafka topic. This
                    is usually in the form
                    `org.apache.kafka.common.serialization.StringDeserializer`.


                    Default value:
                    `org.apache.kafka.common.serialization.StringDeserializer`
                value.deserializer:
                  type: string
                  description: >
                    __Value Deserializer__: Enter the type of value deserializer
                    that should be used to read from the Kafka topic. This is
                    usually in the form
                    `org.apache.kafka.common.serialization.StringDeserializer`.


                    Default value:
                    `org.apache.kafka.common.serialization.StringDeserializer`
    min_io_s3_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/file_data_source'
    mongo_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/nosql_data_source'
        - type: object
          properties:
            source_config:
              type: object
              properties:
                mongo.query.expression:
                  type: string
                  description: >
                    __Query Expression__: Set the Mongo query expression to be
                    executed during each ingestion cycle. See
                    https://www.mongodb.com/docs/compass/current/query/filter/
                    for tips on constructing a valid query.


                    Example: `{$query: {name: 'John'}, $orderby: {name: -1}}`.


                    __Applicable and required__ if `mode` is `query`.
    mysql_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithCDCSupport'
    netsuite_jdbc_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
    rest_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - type: object
          properties:
            source_config:
              type: object
              required:
                - rest.iterations
              properties:
                rest.iterations:
                  type: array
                  description: >
                    With Nexla you can configure chains of API calls to fetch
                    data from APIs before records land in the Nexset. Each step
                    in the chain can be configured to fetch multiple pages of
                    data based on the iteration type. Each step is an object in
                    this array.


                    Typically, you want to fetch multiple pages of data from a
                    REST API. This is done by configuring one object in this
                    array and setting an appropriate `iteration.type` in that
                    object.


                    But if you want to fetch data from multiple APIs in a chain,
                    configure multiple objects in this array. Assign a unique
                    `key` to each object, and then you can reference the results
                    of each step in subsequent steps using the `<key>.<path>`
                    syntax.
                  items:
                    type: object
                    required:
                      - key
                      - url.template
                      - method
                      - iteration.type
                    properties:
                      key:
                        type: string
                        description: >
                          __Step Key__: Unique key for this iteration step. This
                          can be any string that is unique within all rest
                          iterations steps for this source. The key is used for
                          referencing results from a step in subsequent steps.
                          We typically use `step_<number>` as the key.
                      url.template:
                        type: string
                        description: >
                          __API URL__: The API URL to fetch data from. You can
                          use Nexla macros in the URL:

                          • Date/Time macros: Use `now` with optional offsets
                          (e.g. `now-1`)

                          • Response macros: Reference data from previous steps
                          using `step_<key>.<path>` syntax

                          • User-defined variables: Use
                          `{variable_name=default_value}` syntax to define
                          variables that can be set at runtime


                          Examples:

                          • `https://api.example.com/data?date=${now-1}`

                          •
                          `https://api.example.com/users?token=${step_1.token}`

                          •
                          `https://api.example.com/orders?status={status=pending}&limit={limit=100}`
                      method:
                        type: string
                        enum:
                          - GET
                          - POST
                          - PUT
                        description: |
                          __HTTP Method__: HTTP method for the request. 
                          • GET: Retrieve data from the server
                          • POST: Submit data to be processed
                          • PUT: Update or replace existing data
                      date.format:
                        type: string
                        enum:
                          - yyyy-MM-dd
                          - MM/dd
                          - yy
                          - yyyy
                          - MM
                          - MMM
                          - MMMM
                          - hh
                          - hh:mm
                          - HH
                          - HH:mm
                          - DD
                          - eeee
                          - ssss
                          - yyyy-MM-dd'T'HH:mm:ss'Z'
                        description: >
                          __Date Format__: The format of the date to be used in
                          the API URL. You can use Nexla macros in the date
                          format:

                          • Date/Time macros: Use `now` with optional offsets
                          (e.g. `now-1`)

                          • Response macros: Reference data from previous steps
                          using `step_<key>.<path>` syntax

                          • User-defined variables: Use
                          `{variable_name=default_value}` syntax to define
                          variables that can be set at runtime


                          Examples:

                          • `%Y-%m-%d`

                          • `%Y-%m-%d %H:%M:%S`

                          • `%Y-%m-%d %H:%M:%S %z`
                      date.time.unit:
                        type: string
                        enum:
                          - yyyy
                          - MM
                          - dd
                          - HH
                          - mm
                          - ss
                        description: >
                          __Time Unit for Operations__: The unit of date or time
                          for performing mathematical operations on Nexla
                          date-time macro.
                      body.template:
                        type: string
                        description: >
                          __Request Body__: Enter the payload for this request.


                          **For REST APIs:**

                          1. Enter a valid JSON object

                          2. You can use Nexla macros in the payload


                          **For GraphQL APIs:**

                          1. If using GraphQL pagination (page or cursor), enter
                          your GraphQL query directly

                          2. For other GraphQL requests that you wish to send as
                          a standard REST API POST request, wrap your query in a
                          JSON object with `"query"` field


                          **Example REST payload:**

                          `{ "user_id": 123 }`


                          **Example GraphQL with pagination:**

                          `query {\n  characters(page: $page) {\n    results
                          {\n      name\n      species\n    }\n  }\n}`


                          **Example GraphQL without pagination:**

                          `{ "query": "query { users { id name } }" }`
                      response.format:
                        type: string
                        enum:
                          - xml
                          - json
                        description: >
                          __Response Format__: Select the format of the response
                          from the API. This is used to parse the response from
                          the API into a format that can be used by Nexla.
                      response.data.path:
                        type: string
                        description: >
                          __Response Data Path__: Specify path to data in API
                          response.

                          You can choose which part of the API response should
                          be treated as relevant data by Nexla. For ex: when
                          pulling a list of items from a REST API endpoint, the
                          API will usually return an array of records along with
                          some metadata. You can configure this field such that
                          Nexla can treat each element of that array as a
                          record.

                          For JSON API response, please specify the JSON Path to
                          point to the object or array you want Nexla to
                          consider as relevant data, and for XML API use XPATH.

                          For ex: JSONPath could be $.data[*] if the response
                          has an array named data at the top level. Select one
                          of the smart tokens generated when you test the API,
                          or try out JSON Path examples at https://jsonpath.com
                      response.data.path.additional:
                        type: string
                        description: >
                          __Response Data Path Additional__: Specify path to
                          metadata in response (Optional).

                          By choosing Path to Data in Response above you had
                          defined which part of the API response should be
                          treated by Nexla as a record. But sometimes there can
                          be API response data outside that path to data that
                          you also wish to include in each record. Set this
                          property if you wish to include that common metadata
                          in each record.

                          For JSON API response, please specify the JSON Path to
                          point to the object or array you want Nexla to
                          consider as relevant data, and for XML API use XPATH.
                          Try out JSON Path examples at https://jsonpath.com
                      request.headers:
                        type: string
                        description: >
                          __Request Headers__: Add any optional request headers
                          that must be sent as part of this request. You do not
                          need to repeat headers already present in credentials.
                          Please input as comma-separated values e.g
                          `header1:value1,header2:value2`.
                      map.id:
                        type: string
                        description: >
                          __Lookup ID__: You can use values of a column in a
                          Nexla lookup as a macro for API URL. Select the lookup
                          you wish to use for generating API macros.
                      iteration.type:
                        type: string
                        enum:
                          - paging.incrementing
                          - paging.incrementing.offset
                          - paging.next.token
                          - paging.next.url
                          - link.header
                          - response.id.number
                          - response.id.string
                          - graphql.page
                          - graphql.cursor
                          - data.map.key.queue
                          - async.poll
                          - body.as.file
                          - static.url
                        description: >
                          __Type of Iteration__: Type of iteration to use for
                          fetching data. Set instructions for how the connector
                          should iterate requests over multiple pages in this
                          step before moving on to the next step.

                          • static.url: No Iteration

                          • paging.incrementing: Page Number

                          • paging.incrementing.offset: Offset

                          • paging.next.token: Next Token In Response

                          • paging.next.url: Next URL in Response

                          • link.header: Next URL in Response Header

                          • response.id.number: ID (number) in Response

                          • response.id.string: ID (String) In Response

                          • graphql.page: GraphQL Page

                          • graphql.cursor: GraphQL Cursor

                          • data.map.key.queue: Data Map Iteration

                          • async.poll: Asynchronous Job Status API

                          • body.as.file: Process API Response as File
                      param.id:
                        type: string
                        description: >
                          __URL parameter for ID / Token / Page__: Enter the URL
                          parameter name that is used to set the id / page
                          number / token for this type of iteration.
                      start.page.from:
                        type: integer
                        description: >
                          __Start From Page__: Set the starting value for the
                          URL page number parameter. Nexla will automatically
                          iterate through subsequent pages of data till there is
                          no more data to be fetched.
                      end.page.to:
                        type: integer
                        description: >
                          __(Optional) Stop After Page No__: You can configure
                          the platform to stop fetching after receiving a
                          specific page number. Leave blank to fetch all
                          relevant data.
                      param.page.size:
                        type: string
                        description: >
                          __URL Param for Items per page__: Enter the URL
                          parameter name that is used to set the the number of
                          items that are returned in each page.

                          API developers usually set the default number of items
                          returned to a low number, but for data ingestion we
                          recommend setting the property to maximum allowed by
                          the API you are trying to access.
                      page.expected.rows:
                        type: integer
                        description: >
                          __Items Per Page__: Set the value for number of items
                          to be fetched in page of data.
                      link:
                        type: string
                        description: >
                          __Response Header containing Next Page URL__: Set the
                          name of the response header that contains the next
                          page URL. Often API developers send this data in the
                          `Link` header.
                      param.offset:
                        type: string
                        description: >
                          __URL Param For Offset__: Enter the URL parameter name
                          that is used to set the offset for this type of
                          iteration.
                      start.offset.from:
                        type: integer
                        description: >
                          __Start From Offset__: Set the starting value of
                          offset that should be used for the first request.
                      end.offset.to:
                        type: integer
                        description: >
                          __(Optional) Stop After Offset__: You can configure
                          the platform to stop fetching after receiving a
                          specific offset. Leave blank to fetch all relevant
                          data.
                      request.parallelism.count:
                        type: integer
                        description: >
                          __Parallel Requests__: You can configure multiple
                          requests to be executed in parallel by changing this
                          number.

                          __Recommendation__:  A high parallelism count can
                          result in being flagged for rate-limiting by the API
                          vendor, so usually you should leave this to the
                          default setting of 1. Modify this setting only if the
                          source is taking longer to iterate through all pages
                          than is acceptable for your use case.
                      response.next.token.data.path:
                        type: string
                        description: >
                          __Path to next token__: Choose which part of the API
                          response should be treated as relevant token for the
                          next request. This must be a valid JSON Path (for JSON
                          responses) or XPath (for XML responses).
                      end.token.to:
                        type: string
                        description: >
                          __(Optional) Stop After Token__: You can configure the
                          platform to stop fetching after receiving a specific
                          token. Leave blank to fetch all relevant data.
                      response.next.url.data.path:
                        type: string
                        description: >
                          __Path to next URL__: Choose which part of the API
                          response should be treated as relevant urls for the
                          next request. This must be a valid JSON Path (for JSON
                          responses) or XPath (for XML responses).
                      end.url.to:
                        type: string
                        description: >
                          __(Optional) Stop After URL__: You can configure the
                          platform to stop fetching after receiving a specific
                          URL. Leave blank to fetch all relevant data.
                      start.id.from:
                        type: string
                        description: >
                          __Start ID from__: Set the starting value of ID that
                          should be used for the first request.
                      end.id.to:
                        type: integer
                        description: >
                          __(Optional) Stop After ID__: You can configure the
                          platform to stop fetching after receiving a specific
                          ID. Leave blank to fetch all relevant data.
                      response.id.field.name:
                        type: string
                        description: >
                          __ID Name__: Specify Path to ID in API response.
                          Choose which part of the API response should be
                          treated as relevant IDs for the next request. This
                          must be a valid JSON Path (for JSON responses) or
                          XPath (for XML responses).
                      param.id.inclusive:
                        type: boolean
                        description: >
                          __Next ID Inclusive?__: Set this to true if the
                          highest ID in current response should be used as the
                          starting ID for fetching next page of data.
                      graphql.page.name:
                        type: string
                        description: >
                          __Page Variable Name__: Enter the name of the variable
                          used for pagination in your GraphQL query. This
                          variable will be automatically incremented in
                          subsequent requests until empty results are returned.

                          __Applicable__ if `iteration.type` is `graphql.page`.
                      graphql.page.start:
                        type: string
                        description: >
                          __Starting Page Number__: Enter the initial page
                          number to start fetching data from. This number will
                          be used as the first value for your page variable and
                          will be incremented in subsequent requests.

                          __Applicable__ if `iteration.type` is `graphql.page`.
                      graphql.cursor.name:
                        type: string
                        description: >
                          __Cursor Variable Name__: Enter the name of the
                          variable used for cursor-based pagination in your
                          GraphQL query. This variable will be updated with the
                          cursor value from each response to fetch the next page
                          of results.


                          Example: If your query uses `$cursor`, enter
                          `"cursor"`

                          __Applicable__ if `iteration.type` is
                          `graphql.cursor`.
                      graphql.cursor.template:
                        type: string
                        description: >
                          __Initial Cursor Source__: Advanced: Only needed for
                          specific APIs like Monday.com where the initial cursor
                          query has a different structure than subsequent
                          queries.


                          Most GraphQL APIs don't need this - only use if your
                          API requires:

                          1. A different query structure to get the first cursor

                          2. A different query structure for subsequent pages


                          Format: `stepKey.path` (e.g., `step1.cursor`)


                          Example: Monday.com needs this because:

                          - First query: `query { boards { items_page {
                          cursor... } } }`

                          - Later queries: `query { next_items_page(cursor:
                          $cursor) { ... } }`


                          __Applicable__ if `iteration.type` is
                          `graphql.cursor`.
                      response.graphql.cursor.path:
                        type: string
                        description: >
                          __Path to Next Cursor__: Specify where to find the
                          next cursor value in the GraphQL response. The cursor
                          from this path will be used in the next request.
                          Iteration stops when a blank cursor is returned.


                          Example: For a response like `{ data: { products: {
                          edges: [{ cursor: "abc" }] } } }`, use
                          `$.data.products.edges[-1:].cursor`


                          __Applicable__ if `iteration.type` is
                          `graphql.cursor`.
                      async.iteration.path:
                        type: string
                        description: >
                          __Job Status Param__: Choose which part of the API
                          response should be treated as relevant property for
                          evaluating the status of the asynchronous job. This
                          must be a valid JSON Path (for JSON responses) or
                          XPath (for XML responses).
                      async.iteration.value:
                        type: string
                        description: >
                          __Job Completion Value__: Set the value of Job Status
                          Param that would indicate completion of the
                          asynchronous job.
                      file.response.format:
                        type: string
                        enum:
                          - csv
                          - json
                          - txt
                          - xml
                        description: >
                          __Data Format of Response File__: When an API endpoint
                          returns a file in response (or response body is plain
                          text that should be parsed as a file), the platform
                          can be configured to parse the response content
                          accordingly.
                      results.pass.through:
                        type: boolean
                        description: >
                          __Include Previous Step Results__: When enabled, this
                          setting preserves results from all steps in a
                          multi-step REST workflow, rather than only keeping the
                          final step's results.


                          For example, in a two-step workflow:

                          Step 1 returns: `{ "data": 1, "cursor": "abc123" }`

                          Step 2 returns: `{ "data": 2, "cursor": null }`


                          With this enabled, the final output includes both:

                          `[ { "data": 1, "cursor": "abc123" }, { "data": 2,
                          "cursor": null } ]`


                          Without this (default), only the last step's results
                          are kept:

                          `[ { "data": 2, "cursor": null } ]`


                          This is particularly useful for:

                          • API calls that require initial requests to get
                          pagination tokens

                          • Multi-step workflows where early responses contain
                          important metadata

                          • Cases where discarding intermediate results would
                          lose valuable information


                          __Applicable__ if `iteration.type` is
                          `paging.incrementing`, `paging.incrementing.offset`,
                          `paging.next.token`, `paging.next.url`, `link.header`,
                          `response.id.number`, `response.id.string`,
                          `graphql.page`, `graphql.cursor`,
                          `data.map.key.queue`, `async.poll`, `body.as.file`,
                          `static.url`.

                          Default value: `false`.
                start.cron:
                  type: string
                  description: >
                    __Fetch Data__: The interval at which Nexla should scan this
                    source for new data. This must be in the form of a cron
                    expression.

                    Example: `0 0 22 10 11 ? 2022`.
    nexla_monitor_data_source:
      allOf:
        - $ref: '#/components/schemas/rest_data_source'
    nexla_rest_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - type: object
          properties:
            source_config:
              type: object
              required:
                - webhook.auth_type
                - hash.enabled
                - schema.detection.once
              properties:
                webhook.auth_type:
                  type: string
                  enum:
                    - Nexla API Key
                    - Payload Hash
                  description: >
                    __Webhook Authorization Type__: Webhooks are usually
                    authorized via a Nexla API key. 


                    An additional layer of authorization can be enabled via
                    Hash-Based Message Authentication Code(HMAC). Some third
                    parties send a hash along with the payload. In such cases,
                    Nexla can validate that the incoming call was generated by
                    the authorized partner. Set the HMAC properties that will be
                    used by Nexla for validation against the incoming hash. 


                    Default Value: `Nexla API Key`
                schema.detection.once:
                  type: boolean
                  description: >
                    Set this to `true` if you want to enforce the detection of
                    only one Nexset.


                    Set this to `false` to instruct the platform to monitor each
                    call to the webhook for changes in the Nexset schema.


                    Default value: `true` 
                hash.enabled:
                  type: boolean
                  description: >
                    Set to `true` to support incoming webhook authentication via
                    the payload hash.


                    Default value: `false`
                hash_algorithm:
                  type: string
                  enum:
                    - HmacSHA1
                    - HmacSHA256
                    - HmacSHA384
                    - HmacSHA512
                    - HmacMD5
                  description: >
                    __Hashing Algorithm__: The hash algorithm used to generate
                    the hash during payload hashing.


                    __Required__ if `hash.enabled` is `true`
                hash_request_param:
                  type: string
                  description: >
                    Parameter/header name in the incoming request containing the
                    hash.


                    __Required__ if `hash.enabled` is `true`
                hash_secret_key:
                  type: string
                  description: |
                    The hash secret key for payload hashing.

                    __Required__ if `hash.enabled` is `true`
    oracle_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithCDCSupport'
    oracle_autonomous_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
    vector_db_data_source:
      type: object
      properties:
        source_config:
          type: object
          required:
            - start.cron
          properties:
            start.cron:
              type: string
              description: >
                __Scheduling Frequency__: The interval at which Nexla should
                scan this source for new data. This must be in the form of a
                cron expression.
              example: 0 0 22 10 11 ? 2022
    pinecone_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/vector_db_data_source'
        - type: object
          properties:
            source_config:
              type: object
              required:
                - database
                - query_type
              properties:
                database:
                  type: string
                  description: >
                    __Index__: Specify the name of the index to be queried
                    within the selected Pinecone database.
                collection:
                  type: string
                  description: >
                    __Namespace__: Set the namespace to query within the
                    selected Pinecone database.

                    You can use the default namespace or specify a custom
                    namespace.
                  default: ''
                query_type:
                  type: string
                  description: >
                    __Query Type__: Define the type of operation to perform,
                    such as fetching vectors,

                    performing similarity search, or retrieving vectors by ID.

                    - `fetch_vectors` (Fetch Vectors): Retrieve vectors from the
                    Pinecone database.

                    - `similarity_search` (Similarity Search): Retrieve similar
                    vectors to a given vector.

                    - `fetch_ids` (Fetch IDs): Retrieve vectors by their unique
                    identifiers.
                  default: similarity_search
                  enum:
                    - fetch_vectors
                    - similarity_search
                    - fetch_ids
                topK:
                  type: string
                  description: >
                    __Top K Similar Vectors__: Specify the number of top similar
                    vectors to retrieve.

                    Applicable when `query_type` is `similarity_search`.
                  default: '20'
                pinecone.filter:
                  type: string
                  description: >
                    __Search Filter__: Specify a filter to refine which vectors
                    are retrieved from the database.

                    Applicable when `query_type` is `similarity_search`.
                  default: ''
                search_by:
                  type: string
                  description: >
                    __Search By Criteria__: Specify the type of search to
                    perform for similarity search.

                    - `dense_vector` (Dense Vector): Provide a dense vector for
                    similarity search.

                    - `vector_id` (Vector Identifier): Provide the unique
                    identifier of the vector to fetch.


                    Applicable when `query_type` is `similarity_search`.
                  default: dense_vector
                  enum:
                    - dense_vector
                    - vector_id
                dense_vector:
                  type: string
                  description: >
                    __Dense Vector__: Provide the dense vector for similarity
                    search.


                    Required when `query_type` is `similarity_search` and 
                    `search_by` is `dense_vector`.
                sparse_vector_indices:
                  type: string
                  description: >
                    __Sparse Vector Indices__: List the indices of non-zero
                    values in the sparse vector for similarity search.


                    Applicable when `query_type` is `similarity_search` and 
                    `search_by` is `dense_vector`.
                sparse_vector_values:
                  type: string
                  description: >
                    __Sparse Vector Values__: Provide the values corresponding
                    to the indices of the sparse vector for similarity search.


                    Applicable when `query_type` is `similarity_search` and 
                    `search_by` is `dense_vector`.
                vector_id:
                  type: string
                  description: >
                    __Vector Identifier__: Unique identifier of the vector to
                    fetch.


                    This field is required when using the `similarity_search`
                    query type and `search_by` is `vector_id`.
                pinecone.prefix:
                  type: string
                  description: >
                    __Pinecone Prefix__: Specify a prefix to refine which
                    vectors are retrieved from the database.


                    Applicable when `query_type` is `similarity_search` or
                    `fetch_vectors`.
                pinecone.includeValues:
                  type: boolean
                  description: >
                    __Include Values?__: Set this field to `true` to include the
                    values of the vectors in the output.

                    Applicable when `query_type` is `similarity_search`.
                  default: true
                pinecone.includeMetadata:
                  type: boolean
                  description: >
                    __Include Metadata?__: Set this field to `true` to include
                    the metadata of the vectors in the output.

                    Applicable when `query_type` is `similarity_search`.
                  default: true
    postgres_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithCDCSupport'
    redshift_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
    s3_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/file_data_source'
    s3_iceberg_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - type: object
          properties:
            source_config:
              type: object
              required:
                - start.cron
                - iceberg.warehouse.dir
                - iceberg.table.name
                - iceberg.timetravel.modes
              properties:
                start.cron:
                  type: string
                  description: >
                    __Check for data__: The interval at which Nexla should scan
                    this source for new data. This must be in the form of a cron
                    expression.
                  example: 0 0 22 10 11 ? 2022
                iceberg.warehouse.dir:
                  type: string
                  description: >
                    __Warehouse Directory__: Path to the directory containing
                    the Iceberg table. 

                    Nexla uses the path-based Hadoop catalog to discover tables
                    in S3. So if your Iceberg table `sales` is in
                    `s3://my-nexla-bucket/product/sales`, then set this property
                    to `my-nexla-bucket`.
                iceberg.table.name:
                  type: string
                  description: >
                    __Table Name__: Name of the table from which data will be
                    read. 

                    Nexla uses the path-based Hadoop catalog to discover tables
                    in S3. So if your Iceberg table `sales` is in
                    `s3://my-nexla-bucket/product/sales`, then set this property
                    to `product.sales` to read from the table.
                iceberg.timetravel.modes:
                  type: string
                  enum:
                    - none
                    - branch
                    - tag
                    - timestamp
                    - snapshot
                    - incremental
                  description: >
                    __Table Scan Modes__: Select the mode to query the table
                    using Apache Iceberg time travel features.

                    The default value can be used to skip timetravel features.
                    The other modes can be used to query table as-of a branch,
                    tag, timestamp, snapshot or read appended data between two
                    snapshots.


                    * `none` - (Do not use time travel features) Select this
                    mode if you do not want to use any time travel features and
                    want to read all data from the table.

                    * `branch` - (Branch) Select this mode if you want to query
                    the table as of a branch.

                    * `tag` - (Tag) Select this mode if you want to query the
                    table as of a tag.

                    * `timestamp` - (Timestamp) Select this mode if you want to
                    query the table as of a timestamp.

                    * `snapshot` - (Snapshot) Select this mode if you want to
                    query the table as of a snapshot.

                    * `incremental` - (Incremental) Select this mode if you want
                    to read appended data between two snapshots.
                iceberg.timetravel.as.of.branch:
                  type: string
                  description: >
                    __Branch to Query__: Branch to query using Apache Iceberg
                    time travel features. Not compatible with time travel by
                    timestamp.


                    __Applicable and required__ if `iceberg.timetravel.modes` is
                    set to `branch`.
                iceberg.timetravel.as.of.tag:
                  type: string
                  description: >
                    __Tag to Query__: Tag to query using Apache Iceberg time
                    travel features. Not compatible with time travel by
                    timestamp.


                    __Applicable and required__ if `iceberg.timetravel.modes` is
                    set to `tag`.
                iceberg.timetravel.as.of.snapshot:
                  type: string
                  description: >
                    __Snapshot ID to Query__: Snapshot ID to query using Apache
                    Iceberg time travel features.


                    __Applicable and required__ if `iceberg.timetravel.modes` is
                    set to `snapshot`.
                iceberg.timetravel.as.of.timestamp:
                  type: string
                  description: >
                    __Timestamp to Query__: Timestamp to query using Apache
                    Iceberg time travel features. Supported formats: `YYYY-MM-DD
                    HH:MM:SS` or Unix timestamp in seconds.


                    __Applicable and required__ if `iceberg.timetravel.modes` is
                    set to `timestamp`.
                iceberg.incremental.start-snapshot-id:
                  type: string
                  description: >
                    __Snapshot ID to start reading from__: Read appended data
                    between two snapshots with the incremental read feature.
                    This is the starting snapshot ID and is required for this
                    feature. Incremental reads are not compatible with other
                    time travel features nor with upserts and deletes.


                    __Applicable and required__ if `iceberg.timetravel.modes` is
                    set to `incremental`.
                iceberg.incremental.end-snapshot-id:
                  type: string
                  description: >
                    __Snapshot ID to end reading at__: Read appended data
                    between two snapshots with the incremental read feature.
                    This is the ending snapshot ID and is optional, if the
                    starting snapshot ID is specified but the ending snapshot ID
                    is not provided will read all subsequent data. Incremental
                    reads are not compatible with other time travel features nor
                    with upserts and deletes.


                    __Applicable__ if `iceberg.timetravel.modes` is set to
                    `incremental`.
    sharepoint_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/file_data_source'
    snowflake_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
    soap_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - type: object
          properties:
            source_config:
              type: object
              required:
                - start.cron
                - soap.wsdl.url
                - soap.service
                - soap.binding
                - soap.operation
                - soap.port.type
                - soap.service.port
                - soap.params
              properties:
                start.cron:
                  type: string
                  description: >
                    __Scheduling Frequency__: The interval at which Nexla should
                    scan this source for new data. This must in the form of a
                    cron expression.
                  example: 0 0 22 10 11 ? 2022
                soap.wsdl.url:
                  type: string
                  description: >
                    __WSDL URL__: Enter the WSDL URL of the Soap service to
                    which you wish to connect.
                soap.service:
                  type: string
                  description: >
                    __SOAP Service Name__: Enter the name of the SOAP Service
                    that you wish to access.
                soap.binding:
                  type: string
                  description: >
                    __SOAP Binding Name__: Enter the name of the SOAP binding
                    element.


                    The SOAP binding element defines the message format and
                    protocol details for each port. The binding element has two
                    attributes: the name attribute and the type attribute.
                soap.operation:
                  type: string
                  description: >
                    __SOAP Operation Name__: Select the operation for the
                    binding that you wish to access.
                soap.port.type:
                  type: string
                  description: >
                    __SOAP Binding Port Type__: Enter the port type of the SOAP
                    binding element.


                    The SOAP binding element defines the message format and
                    protocol details for each port. The binding element has two
                    attributes: the name attribute and the type attribute.
                soap.service.port:
                  type: string
                  description: >
                    __SOAP Service Port__: Select the Service Port that you wish
                    to access.
                soap.params:
                  type: string
                  description: >
                    __Operation Parameters and Values__: Enter a dictionary of
                    operation parameters and relevant operation parameter values
                    for this source.


                    example:

                    ```
                      {
                          "TrackRequest/ClientDetail/AccountNumber": "12345",
                          "TrackRequest/TransactionDetail/Localization/LanguageCode": "EN"
                      }
                    ```
                  additionalProperties:
                    type: string
                    x-additionalPropertiesName: soap_operation_param
                    description: >
                      __SOAP Operation Parameter__: Operation parameter whose
                      value needs to be configured.
    sqlserver_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithCDCSupport'
    sybase_data_source:
      allOf:
        - $ref: '#/components/schemas/data_source'
        - $ref: '#/components/schemas/WithoutCDCSupport'
    teradata_data_source:
