    gdrive_data_sink:
      allOf:
        - $ref: '#/components/schemas/data_sink'
        - type: object
          properties:
            sink_config:
              type: object
              required:
                - path
                - data_format
              properties:
                path:
                  type: string
                  description: >
                    __Path to Write__: Set the path to which you want to write
                    all files. 


                    For Google Drive, this is the unique ID of the file/folder
                    into which you want to write the data.


                    Example: `1MZhNV996K77b-kLYC4yIdG7PJiUUGBwV`
                ui.display_path:
                  type: string
                  description: >
                    __Path (display format)__: This should be the human-readable
                    Google Drive path. This is not required but is useful for
                    keeping track of the actual folder path.


                    Example: `demo/demodata`
                ui.selected_file_mime_type:
                  type: string
                  enum:
                    - application/vnd.google-apps.spreadsheet
                  description: >
                    You can choose to always write the Nexset records to a
                    specific Google spreadsheet instead of creating new files in
                    a Google Drive folder.


                    Add this property and set its value to
                    `application/vnd.google-apps.spreadsheet` if you want to
                    write your data to a specific spreadsheet instead of
                    creating new files in the target folder.
                output.dir.name.pattern:
                  type: string
                  description: >
                    __Subfolder Path Format__: You can configure the platform to
                    automatically create sub-folders and partition files into
                    those sub-folders.


                    Use Nexla system macros like `{YYYY}`, `{MM}`, etc. to
                    create datetime sub-folders. You can also split folders
                    based on the values of an attribute in the Nexset by using
                    the macro `{record.<attribute-name>}`.


                    Default Value: `{YYYY}/{MM}/{dd}`


                    __Applicable__: Only if `ui.selected_file_mime_type` is
                    absent
                file.name.prefix:
                  type: string
                  description: >
                    __Custom File Name Prefix__: Generated file names are in the
                    format <prefix>-<nexset-identifier>-<randomizer>. Set this
                    property to define the prefix of each file.


                    You can use Nexla system macros like `{YYYY}`, `{MM}`, etc.
                    to create datetime patterns.


                    __Applicable__: Only if `ui.selected_file_mime_type` is
                    absent
                max.file.size.mb:
                  type: integer
                  description: >
                    __Maximum File Size (in MB)__: The maximum size (MB) of each
                    generated file. Data will be automatically partitioned into
                    multiple files.


                    Default Value: `4096`


                    __Applicable__: Only if `ui.selected_file_mime_type` is
                    absent
                data_format:
                  type: string
                  enum:
                    - csv
                    - tsv
                    - json
                    - xml
                    - xlsx
                    - edi
                    - avro
                    - parquet
                    - orc
                    - GOOGLE_SPREADSHEET
                  description: >
                    __File Format__: Set the output format of the generated
                    files.
                insert.mode:
                  type: string
                  enum:
                    - OVERWRITE
                    - INSERT_ROWS
                  description: >
                    __Row Insertion Mode__:  If you are writing the Nexset to a
                    specific sheet, choose whether Nexla should completely
                    overwrite an existing sheet while writing out data during
                    the latest execution or always append new records as new
                    rows.


                    __Applicable and required__: only if
                    `ui.selected_file_mime_type` is
                    `application/vnd.google-apps.spreadsheet`.
                range:
                  type: string
                  description: >
                    __Configure Sheet Name And Starting Cell__: If you are
                    writing the Nexset to a specific sheet, you can configure
                    the name of the sheet and/or starting cell for the data
                    output.


                    This is an optional step that allows you to define the exact
                    sheet name and/or starting cell for the generated
                    spreadsheet.


                    __Applicable__: only if `ui.selected_file_mime_type` is
                    `application/vnd.google-apps.spreadsheet`.
                clear.range:
                  type: string
                  description: >
                    __Cell Range To Clear Before Writing Data__: If you are
                    writing the Nexset to a specific sheet, you can configure
                    the platform to clear a specific cell range before writing a
                    new batch of records.


                    __Applicable__: only if `ui.selected_file_mime_type` is
                    `application/vnd.google-apps.spreadsheet`.
        - $ref: '#/components/schemas/file_data_sink'
