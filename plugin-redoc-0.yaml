          schema:
            type: string
            format: date-time
            example: '2023-01-17'
        - name: aggregate
          in: query
          required: true
          description: >
            This should be set to 1 for fetching daily aggregated metrics over
            the specified time range.
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/user_metrics'
        '403':
          description: Forbidden
        '404':
          description: Not found error
