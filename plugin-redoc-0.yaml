  /{resource_type}/{resource_id}/metrics/run_summary:
    get:
      tags:
        - Metrics
      operationId: get_resource_metrics_by_run
      summary: Get Metrics By Run ID for a Resource of a Flow
      description: >
        Retrieves data processing metrics of a `data_source`, `data_set`, or
        `data_sink`. The reported metrics are grouped by run id to indicate the
        number of records processed during each ingestion cycle of this flow.
      parameters:
        - name: resource_type
          in: path
          description: |
            The type of resource that metrics should be fetched for.
          required: true
          schema:
            type: string
            enum:
              - data_sources
              - data_sinks
              - data_sets
        - name: resource_id
          in: path
          description: >
            The unique id of the resource you wish to fetch metrics for.  For
            ex, set this to id of the `data_source` if you want to fetch metrics
            of a specific `data_source`.
          required: true
          schema:
            type: integer
        - name: groupby
          in: path
          schema:
            type: string
            enum:
              - runId
              - lastWritten
          description: >
            Specify the rule based on which metrics should be grouped for
            aggregation. 


            Default API behavior is to group by `runId`. This choice is only
            applicable for data sinks where the run summary could be reported by
            `runId` ( for reporting number of records written out per ingestion
            cycle) or `lastWritten` (for reporting number of records written out
            in each destination write batch).
        - name: orderby
          in: path
          schema:
            type: string
            enum:
              - runId
              - lastWritten
          description: >
            Specify the order in which paginated results should be sorted.
            Default API behavior is to order by `runId`. This choice is only
            applicable for data sinks where the run summary could be reported by
            `runId` ( for reporting number of records written out per ingestion
            cycle) or `lastWritten` (for reporting number of records written out
            in each destination write batch).
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          $ref: '#/components/responses/ResourceMetricsByRuns'
        '403':
          description: Forbidden
        '404':
          description: Not found error
  /data_flows/{resource_type}/{resource_id}/metrics:
