        status:
          type: string
        sink_type:
          type: string
    DataSet:
      type: object
      properties:
        id:
          type: integer
          format: int32
        owner:
          $ref: '#/components/schemas/UserSimplified'
        org:
          $ref: '#/components/schemas/OrgSimplified'
        name:
          type: string
        description:
          type: string
        status:
          type: string
        data_source_id:
          type:
            - integer
            - 'null'
          description: >
            Id of the data source this Nexset was detected from. This is only
            relevant for detected Nexsets.
        data_source:
          $ref: '#/components/schemas/DataSource'
          description: >
            Details about the data source this Nexset was detected from. This is
            only relevant for detected Nexsets.
        parent_data_sets:
          type: array
          description: >
            Details about the Nexset this Nexset is derived from. This element
            is empty in case of detected Nexsets and has 1 item in case of
            derived Nexsets.
          items:
            minItems: 0
            maxItems: 1
            $ref: '#/components/schemas/DataSetBrief'
        data_sinks:
          type: array
          description: |
            Details about every data sink this Nexset is directly connected to.
          items:
            $ref: '#/components/schemas/DataSinkSimplified'
        access_roles:
          $ref: '#/components/schemas/AccessRoles'
        transform_id:
          type:
            - integer
            - 'null'
          description: >
            The ID of the Transform entity that has been used to create the
            output of this Nexset from the parent Nexset.


            This element is null for detected Nexsets.
        output_schema:
          type: object
          description: |
            JSON schema of this Nexset's output.
        copied_from_id:
          type: integer
          format: nullable
          description: >
            Reference ID of the Nexset that this Nexset was created as a copy
            of. This is only valid if the Nexset was created by issuing a
            request to the `copy` endpoint of another Nexset.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        flow_type:
          type: string
          description: |
            The flow type of the origin node.
    DataSetMutable:
      allOf:
        - oneOf:
            - type: object
              properties:
                has_custom_transform:
                  type: boolean
                  enum:
                    - false
                  description: >
                    Set this to `false` to indicate that the payload contains
                    the `transform` code that should be used for creating the
                    output schema.
                transform:
                  type: object
                  description: |
                    Transform code that should be applied on the parent Nexset.
            - type: object
              properties:
                has_custom_transform:
                  type: boolean
                  enum:
                    - true
                  description: >
                    Set this to `true` to indicate that the payload contains the
                    `transform_id` of a transform that should be applied for
                    creating the output schema.
                transform_id:
                  type: integer
                  description: >
                    Id of a reusable record transform that should be applied on
                    the parent Nexset.
        - type: object
          properties:
            name:
              type: string
            description:
              type: string
            parent_data_set_id:
              type: integer
              description: >
                Nexset ID of the parent Nexset on which all the rules should be
                applied for creating this Nexset.
            output_schema_annotations:
              type: object
              description: >
                You can document details about important Nexset attributes by
                annotating them with short descriptions.


                Set descriptions for all such attributes by adding them to this
                object. Attributes should be added in standard JSON schema path
                format. You can refer to Nexset's output schema structure for
                guidance.
              properties:
                properties:
                  additionalProperties:
                    x-additionalPropertiesName: nexset_attribute_name
                    type: object
                    properties:
                      description:
                        type: string
                        description: |
                          Set a short description for this attribute.
            output_schema_validation_enabled:
              type: boolean
              description: >
                Set this to true and attach the relevant
                `output_validation_schema` if you want all records to be
                validated against some JSON schema validation rules.


                Records that fail validation will be routed to the Nexset error
                queue instead of the Nexset output.
            output_validation_schema:
              type: object
              description: >
                You can set JSON Schema validation rules that should be applied
                on every record of this Nexset.


                See
                https://json-schema.org/learn/getting-started-step-by-step.html
                for guidance on writing JSON schema validation rules.
              additionalProperties:
                x-additionalPropertiesName: json_schema_validation_rule
                type:
                  - object
                  - string
            data_sinks:
              type: array
              description: >
                You can choose to attach one or more data sinks to this Nexset.
                Each data sink will receive the output of this Nexset when the
                Nexset generates output records.
              items:
                anyOf:
                  - type: integer
                    description: |
                      The ID of the data sink.
                  - type: object
                    description: >
                      The payload for creating a Nexla data sink with this
                      request. The platform will automatically create a data
                      sink and attach its ID as a reference.
            custom_config:
              type: object
              description: >
                `Reserved for Nexla UI`: This field is used by Nexla UI for
                display instructions when displaying this Nexset on the UI. This
                entry has no impact on how the Nexla data plane processes data
                for this Nexset.
            tags:
              type: array
              items:
                type: string
    DataSetCreate:
