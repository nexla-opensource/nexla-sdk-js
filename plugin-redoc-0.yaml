    rest_data_sink:
      allOf:
        - $ref: '#/components/schemas/data_sink'
        - type: object
          properties:
            sink_config:
              type: object
              required:
                - url.template
                - method
                - content.type
                - body.template
              properties:
                url.template:
                  type: string
                  description: >
                    __URL__: Set the URL you wish to send data to.

                    You can use Nexla system macros like `{YYYY}`, `{MM}`, etc.,
                    and the output will be automatically converted into the
                    corresponding time values. You can also set dynamic URLs
                    based on the values of an attribute in the record by using
                    the macro `{record.<attribute-name>}`.
                method:
                  type: string
                  enum:
                    - POST
                    - PUT
                    - GET
                    - PATCH
                    - DELETE
                  description: >
                    __Method__: HTTP method used for this rest endpoint. This
                    will usually be `POST`, `PUT`, `GET`, `PATCH`, or `DELETE`.
                content.type:
                  type: string
                  enum:
                    - application/json
                    - application/xml
                  description: >
                    __Content Format__: Content format used for this rest
                    endpoint. Usually, this will be `application/json`.
                body.template:
                  type: string
                  description: >
                    __Nexset Record to Payload Template__: In the case of 1 API
                    call per Nexset record, you can customize how a Nexset
                    record is added to the API payload. The record itself is
                    referenced as a `{message.json}` macro.

                    Default and recommended value: `{message.json}`

                    Note:

                    1. Usually, we recommend formatting the API payload with a
                    Nexset transform.

                    2. This property should not be used to format the payload
                    when multiple Nexset records have to be batched together
                    into 1 API call. In this case, please use the `batch.mode`
                    and `body.transform.function` properties.
                batch.mode:
                  type: boolean
                  description: >
                    __Would you like to batch your records together?__: Select
                    this option if you would like to combine multiple records in
                    each API request. You can set the batching algorithm by
                    configuring the related properties.

                    Default Value: `false`

                    __Supported__ only if `content.type` is `application/json`.
                max.poll.records:
                  type: integer
                  description: >
                    __Maximum Poll Records__: Set the maximum number of records
                    that can be batched together when combining multiple records
                    into an API call.

                    __Applicable and required__ if `batch.mode` is `true`.
                body.transform.function:
                  type: string
                  description: >
                    __Batching Algorithm__: You can define how the platform
                    should combine multiple records in a single API call with a
                    Scala function. Use `messages` to reference records within
                    your Scala function.

                    Sample Scala Functions:

                    1. Payload: JSON array of records:

                    `"body.transform.function": "messages"`

                    2. Payload: JSON object containing array of records as a
                    property (e.g., items):

                    `"body.transform.function": "Map(\"items\" -> messages)"`

                    3. Payload: JSON object with each record modified before
                    batching:

                    `"body.transform.function": "Map(\"items\"-> messages.map(m
                    => {\nm.put(\"attributes\" , Map(\"type\"-> \"Account\"))\n
                    m\n})\n)"`

                    will result in

                    `{
                      "items:[
                      { ...record1, "attributes": {"type": "Account"}}, 
                      { ...record2, "attributes": {"type": "Account"}}
                      ]
                    }`
                create.datasource:
                  type: boolean
                  description: >
                    __Capture API Response__: Set this to `true` if you would
                    like to capture the API response for each API call.
                    Responses, along with requests, will be pushed to an
                    autogenerated Nexla webhook.

                    Default value: `false`.
