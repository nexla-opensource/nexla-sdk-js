                    integration record.


                    __Applicable and required__  if `tba_enabled` is `true`
                token_secret:
                  type: string
                  description: >
                    __Token Secret__: Token Secret generated when the Access
                    Token was created.


                    __Applicable and required__  if `tba_enabled` is `true`
                server_zone_id:
                  type: string
                  description: >
                    __Server Zone ID__: A timestamp is needed to generate a
                    token password. This timestamp must be within plus or minus
                    five (+ or – 5) minutes of the server time. If your server
                    is not in the UTC zone, please specify the correct server
                    time zone.


                    Default value: `UTC`


                    __Applicable__  if `tba_enabled` is `true`
                database_name:
                  type: string
                  description: >
                    __Database Name__: Enter the database name if you want to
                    connect to a specific database.
                schema_name:
                  type: string
                  description: >
                    __Schema Name__: Enter the schema name for the tables in
                    which you are interested.   
