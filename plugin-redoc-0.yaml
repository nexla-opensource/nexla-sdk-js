  /{resource_type}/{resource_id}/flow:
    get:
      tags:
        - Flows
      operationId: get_flow_by_resource_id
      summary: Get Flow (by Resource ID)
      description: >
        Returns a flow object if a valid resource type and resource ID is
        provided.


        > Note: This is a variant of flow endpoints where the flow node can
        referenced not by its own ID, but by the ID of the unique resource that
        is linked to that flow node.      
      parameters:
        - name: resource_type
          in: path
          description: >
            The type of node linked to the flow you want to reference. For ex,
            set this to `data_sources` if you want to refer to the flow
            originating in a `data_source`.
          required: true
          schema:
            type: string
            enum:
              - data_sources
              - data_sinks
              - data_sets
        - name: resource_id
          in: path
          description: >-
            The unique id of the resource whose flow you want to reference.  For
            ex, set this to id of the `data_source` if you want to refer to the
            flow originating in a specific `data_source`.
          required: true
          schema:
            type: integer
        - name: flows_only
          in: query
          schema:
            type: integer
            enum:
              - 1
            description: >
              By default, flows responses include sub-lists of the resources
              included in the `flows`, such as `data_sources`, `data_sets` and
              `data_sinks`. If you do not need resource details and just need
              flow chain, include the `flows_only` query parameter in your
              request. This option can improve request response time
              significantly.
                      
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          $ref: '#/components/responses/FlowsOne'
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags:
        - Flows
      operationId: delete_flow_by_resource_id
      summary: Delete a Flow (by Resource ID)
      description: >
        Deletes a flow from your Nexla account.


        > Note: This is a variant of flow endpoints where the flow node can
        referenced not by its own ID, but by the ID of the unique resource that
        is linked to that flow node.
      parameters:
        - name: resource_type
          in: path
          description: >
