                - security.protocol
              properties:
                target.bootstrap.servers:
                  type: string
                  description: >
                    __Kafka Bootstrap Servers__: Enter the addresses of the
                    Kafka brokers. These are usually in the form of Virtual IP
                    addresses.
                security.protocol:
                  type: string
                  enum:
                    - PLAINTEXT
                    - SASL_PLAINTEXT
                    - SASL_SSL
                    - SSL
                  description: >
                    __Security Protocol__: Choose the appropriate security
                    protocol for your Kafka channels.


                    * `PLAINTEXT`: Un-authenticated, non-encrypted channel


                    * `SASL_PLAINTEXT`: SASL-authenticated non-encrypted channel


                    * `SASL_SSL`: SASL-authenticated SSL channel


                    * `SSL`: SSL channel
                sasl.jaas.config:
                  type: string
                  description: >
                    __Authentication Configuration (SASL JAAS format)__: Enter
                    the Java Authentication and Authorization Service (JAAS)
                    configuration to be used for SASL Authentication. This is
                    usually in the format
                    `org.apache.kafka.common.security.plain.PlainLoginModule
                    required username=<user_in_quotes>
                    password=<pwd_in_quotes>;`.


                    __Required__ if `security.protocol` is `SASL_PLAINTEXT` or
                    `SASL_SSL`
                group.id.prefix:
                  type: string
                  description: >
                    __Consumer Group ID__: Enter the  Group ID of the group to
                    which Nexla consumers will belong.


                    This is usually set to `nexla-consumer`.
