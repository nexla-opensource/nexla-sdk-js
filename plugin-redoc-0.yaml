      summary: Create a Static Data Map
      description: >
        Creates a new static data map in the authenticated user's account.
        Dynamic data maps can only be created by creating a Destination (Sink)
        of the type `data_map`. 


        For statically assigned data maps, you can choose to add data rows to
        the data map by either of the following methods:

        1. Send data map entries with this request. In this case, the rows of
        data are sent as a `data_map` array of objects.

        2. Send data map entries as a separate call to add/update entries. 


        You must include `map_primary_key` to specify which map attribute should
        be used for data matching.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataMapCreate'
      responses:
        '200':
          $ref: '#/components/responses/data_maps_one'
        '401':
