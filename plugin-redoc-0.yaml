  /notification_settings:
    get:
      operationId: list_notification_settings
      summary: List Notification Settings
      description: >
        This endpoint lists all notification settings in the authenticated
        user's account.



        Notification settings contain the following user settings:

        1. Whether the user wants to be notified about a specific event
        (`status` of a `notification_type` on a `notification_resource_type`)

        2. If yes, on what `channel` the user wants to be notified 

        3. The configuration of the channel (`notification_channel_setting_id`)

        4. Configuration parameters affect when the notification should be
        fired. This is usually left empty to use platform defaults, but it is
        relevant when users want to override the default settings of some
        notifications, such as `Source Data Delayed`  
      tags:
