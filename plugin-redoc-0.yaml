    probe_sample:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
          description: >
            Response status code from the third-party storage system to which
            this credential connects. `Ok` indicates that the request resulted
            in a valid response from the storage system.
        message:
          type: string
          enum:
            - Ok
          description: >
            Message string indicating response validity from the underlying
            storage system. `Ok` indicates that the request resulted in a valid
            response from the storage system.

            Errors are returned as relevant message strings indicating the
            failure reasons.
        connection_type:
          allOf:
            - $ref: '#/components/schemas/ConnectorTypeFile'
            - $ref: '#/components/schemas/ConnectorTypeDatabase'
            - $ref: '#/components/schemas/ConnectorTypeNoSql'
            - $ref: '#/components/schemas/ConnectorTypeKafka'
            - $ref: '#/components/schemas/ConnectorTypeVectorDB'
            - type: string
              enum:
                - rest
            - type: string
              enum:
                - soap
        output:
          oneOf:
            - type: object
              description: >
                Response structure of sample file content from a file-type
                store.
              properties:
                contentType:
                  type: string
                  description: >
                    File content type. Usually, this is `application/json`,
                    `text/plain`, or `application/binary`.
                statusCode:
                  type: integer
                  description: >
                    Storage system status code for the sample request. Usually,
                    this is 200 for a successful sample attempt and other status
                    codes for unsuccessful sample attempts.
                response:
                  type: string
                  description: |
                    Sample lines from the file.
            - type: object
              description: |
                Response structure of sample rows from a database-type store.
              properties:
                contentType:
                  type: string
                  description: |
                    Response content type. Usually, this is `application/json`.
                statusCode:
                  type: integer
                  description: >
                    Storage system status code for the sample request. Usually,
                    this is 200 for a successful sample attempt and other status
                    codes for unsuccessful sample attempts.
                response:
                  type: object
                  properties:
                    columns:
                      type: array
                      description: |
                        An array of column names in the sample response.
                      items:
                        type: string
                    data:
                      type: array
                      description: |
                        An array of data rows in the sample response.
                      items:
                        type: object
                        additionalProperties:
                          type:
                            - integer
                            - string
                            - object
                          x-additionalPropertiesName: column_name
                          description: |
                            Value of the column in this row of data.
            - type: object
              description: >
                The response structure for sample documents from a NoSQL
                document store.
              properties:
                contentType:
                  type: string
                  enum:
                    - application/json
                  description: |
                    Response content type. Usually, this is `application/json`.
                statusCode:
                  type: integer
                  description: >
                    Storage system status code for the sample request. Usually,
                    this is 200 for a successful sample attempt and other status
                    codes for unsuccessful sample attempts.
                response:
                  type: string
                  description: >
                    JSON string in which each key is a document name and the
                    value of each key is the content of the corresponding
                    document.
            - type: object
              description: >
                The response structure for the API response from a rest/soap
                connector.
              properties:
                contentType:
                  type: string
                  description: >
                    Connector response content type. Usually, this is
                    `application/json`, `text/plain`, or `application/binary`.
                statusCode:
                  type: integer
                  description: >
                    Storage system status code for the sample request. Usually,
                    this is 200 for a successful sample attempt and other status
                    codes for unsuccessful sample attempts.
                response:
                  type: string
                  description: >
                    API response from the 3rd party (connector)
                    API.                  

                      
                                     
