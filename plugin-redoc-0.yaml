          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                description: >-
                  Should be 200 or "ok" for normal response. If GenAI service is
                  not available, you will get another status code.
                example: ok
              output:
                type: object
                properties:
                  response:
                    type: string
                    description: >-
                      The response message from GenAI service. Contains Markdown
                      text.  If there is an error, this field will not be
                      present.
                  statusCode:
                    type: integer
                    description: The status code from external GenAI service.
                    example: 200
                  errorMessage:
                    type: string
                    description: >-
                      If there is an error, this field will contain the error
                      message, and 'response' field will not be present.
                    example: >-
                      GenAI Integration has not been enabled for your Nexla
                      organization. Please contact your organization admin or
                      Nexla support for enabling the integration.
