          rest: '#/components/schemas/rest_data_credential'
          s3: '#/components/schemas/s3_data_credential'
          s3_iceberg: '#/components/schemas/s3_iceberg_data_credential'
          sharepoint: '#/components/schemas/sharepoint_data_credential'
          snowflake: '#/components/schemas/snowflake_data_credential'
          snowflake_dcr: '#/components/schemas/snowflake_dcr_data_credential'
          soap: '#/components/schemas/soap_data_credential'
          sqlserver: '#/components/schemas/sqlserver_data_credential'
          sybase: '#/components/schemas/sybase_data_credential'
          teradata: '#/components/schemas/teradata_data_credential'
          tibco: '#/components/schemas/tibco_data_credential'
          webdav: '#/components/schemas/webdav_data_credential'
    database_data_credential:
      type: object
      properties:
        credentials:
          type: object
          properties:
            has_ssh_tunnel:
              type: boolean
              description: >
                __Requires SSH Tunnel for access?__: If your database is not
                publicly accessible, Nexla enables connecting via an SSH tunnel.
                When using this method, Nexla will connect to a bastion host via
                SSH, and the database connection will occur from the SSH host.


                Default value: `false`
            tunnel.bastion.host:
              type: string
              description: >
                __SSH Tunnel Host__: To connect via an SSH tunnel, you need to
                use a bastion host running an SSH tunnel server with access to
                your database. Enter the SSH tunnel hostname or IP address of
                the bastion host.


                __Required__ if `has_ssh_tunnel` is `true`
            tunnel.bastion.port:
              type: integer
              description: >
                __SSH Tunnel Port__: Enter the port of the tunnel bastion host
                to which Nexla can connect.


                __Required__ if `has_ssh_tunnel` is `true`


                Default Value: `22`
            tunnel.bastion.user:
              type: string
              description: >
                __Username for tunnel__: As part of setting up the bastion host,
                you also need to create an SSH user for Nexla. Enter that
                username here. Usually, this is set to `nexla`.


                __Required__ if `has_ssh_tunnel` is `true`
    as400_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - host
                - port
                - username
                - password
              properties:
                host:
                  type: string
                  description: >
                    __Host__: Enter the hostname for your database. This is
                    usually an IP address or text in the format
                    __company.domain.com__. Do not include the connection
                    protocol.
                port:
                  type: integer
                  description: |
                    __Port__: Enter the port used to access your database.
                username:
                  type: string
                  description: >
                    __Username__: Enter the username used to access your
                    database.
                password:
                  type: string
                  description: >
                    __Password__: Enter the password used to access your
                    database.
                database_name:
                  type: string
                  description: >
                    __Database Name__: Enter the database name if you want to
                    connect to a specific database.
        - $ref: '#/components/schemas/database_data_credential'
    aws_athena_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - aws.auth.type
                - access.key.id
                - secret.key
                - aws.region
                - schema_name
                - s3.output.location
              properties:
                aws.auth.type:
                  type: string
                  description: >
                    __Authentication Method__: Credentials can be configured to
                    grant access via various AWS permission mechanisms. Please
                    select the authentication method you wish to use.
                  enum:
                    - Access Key
                  default: Access Key
                access.key.id:
                  type: string
                  description: >
                    __AWS Access Key__: AWS Access Key ID for Athena database
                    access.
                secret.key:
                  type: string
                  description: >
                    __AWS Secret Key__: AWS Secret Key ID for Athena database
                    access.
                aws.region:
                  type: string
                  description: |
                    __AWS Region__: AWS region of the Athena database.
                  default: us-east-1
                schema_name:
                  type: string
                  description: >
                    __Schema Name__: Specify the schema or database containing
                    the tables you wish to query.
                  default: default
                s3.output.location:
                  type: string
                  description: >
                    __S3 Path For Query Results__: Specify an S3 path in the
                    current region to save query results. Use the format
                    `s3://bucket-name/path/to/object/`.
        - $ref: '#/components/schemas/database_data_credential'
    file_data_credential:
      type: object
      properties:
        credentials:
          type: object
          properties:
            file_encryption_enabled:
              type: boolean
              description: >
                __Handle File Encryption/Decryption?__: The platform can be
                configured to process encrypted files such that a Source will
                decrypt files before scanning, and a Destination will encrypt
                the generated files before uploading them to your storage.


                Default value: `false`
            encrypt.standard:
              type: string
              description: >
                __File Encryption Protocol__: The type of file encryption
                protocol that should be used be used for encrypting/decrypting
                files.


                __Required__ if `file_encryption_enabled` is `true`


                Default value: `pgp`
              enum:
                - pgp
            external.user.id:
              type: string
              description: >
                __External User ID__: The ID of the user whose public key is to
                be used for encryption/decryption.


                __Required__ if `file_encryption_enabled` is `true` and
                `encrypt.standard` is `pgp`
            external.public.key:
              type: string
              description: >
                __External User's Public Key__: The external user's public key
                that will be used for the encryption/decryption of files.


                __Required__ if `file_encryption_enabled` is `true` and
                `encrypt.standard` is `pgp`
            encrypt.user.id:
              type: string
              description: >
                __Your User ID for Private Key__: Set this to the user ID used
                to generate the PGP private key.


                __Required__ if `file_encryption_enabled` is `true` and
                `encrypt.standard` is `pgp`
            encrypt.private.password:
              type: string
              description: >
                __Your Password for Private Key__: Set this to the password of
                the user ID used to generate the PGP private key.


                __Required__ if `file_encryption_enabled` is `true` and
                `encrypt.standard` is `pgp`
            encrypt.private.key:
              type: string
              description: >
                __Your Private Key__: Enter your PGP private key. This private
                key (and the associated user id and password) will be used for
                encrypting/decrypting files.
                 
                __Required__ if `file_encryption_enabled` is `true` and
                `encrypt.standard` is `pgp`
    azure_blb_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - azure_blb.auth.type
              properties:
                storage.account.name:
                  type: string
                  description: >
                    __Azure Storage Account Name__: The name of the storage
                    account that you wish to access.


                    __Applicable and required__ if `azure_blb.auth.type` is `SAS
                    Token` or `Storage Account Key`
                azure_blb.auth.type:
                  type: string
                  enum:
                    - SAS Token
                    - Connection String
                    - Storage Account Key
                  description: >
                    __Authentication Mechanism__: Credentials can be configured
                    to allow Azure access through different authentication
                    mechanisms. Select the type of Authentication method you
                    wish to use.


                    * `SAS Token` for Shared Access Signature Token
                    authentication.


                    * `Connection String` for Key Connection String
                    authentication.


                    * `Storage Account Key` for Storage Account Key
                    authentication.
                sas.token:
                  type: string
                  description: >
                    __Shared Access Signature Token__: Enter the shared access
                    signature token for the Azure storage that you wish to
                    access.


                    __Required__ if `azure_blb.auth.type` is `SAS Token`
                key.connection.string:
                  type: string
                  description: >
                    __Key Connection String__: Enter the Azure connection string
                    for the Azure storage that you wish to access.


                    __Required__ if `azure_blb.auth.type` is `Connection String`
                storage.account.key:
                  type: string
                  description: >
                    __Storage Account Key__: Enter the Azure storage account key
                    for the Azure storage that you wish to access.


                    __Required__ if `azure_blb.auth.type` is `Storage Account
                    Key`
        - $ref: '#/components/schemas/file_data_credential'
    azure_data_lake_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - storage.account.name
                - azure_dl.auth.type
              properties:
                storage.account.name:
                  type: string
                  description: >
                    __Azure Storage Account Name__: The name of the storage
                    account that you wish to access.
                azure_dl.auth.type:
                  type: string
                  enum:
                    - SAS Token
                    - Connection String
                    - Storage Account Key
                  description: >
                    __Authentication Mechanism__: Credentials can be configured
                    to allow Azure access through different authentication
                    mechanisms. Select the type of Authentication method you
                    wish to use.


                    * `SAS Token` for Shared Access Signature Token
                    authentication.


                    * `Connection String` for Key Connection String
                    authentication.


                    * `Storage Account Key` for Storage Account Key
                    authentication.
                sas.token:
                  type: string
                  description: >
                    __Shared Access Signature Token__: Enter the shared access
                    signature token for the Azure storage that you wish to
                    access.


                    __Required__ if `azure_dl.auth.type` is `SAS Token`
                key.connection.string:
                  type: string
                  description: >
                    __Key Connection String__: Enter the Azure connection string
                    for the Azure storage that you wish to access.


                    __Required__ if `azure_dl.auth.type` is `Connection String`
                storage.account.key:
                  type: string
                  description: >
                    __Storage Account Key__: Enter the Azure storage account key
                    for the Azure storage that you wish to access.


                    __Required__ if `azure_dl.auth.type` is `Storage Account
                    Key`
        - $ref: '#/components/schemas/file_data_credential'
    azure_synapse_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - host
                - port
                - username
                - password
              properties:
                host:
                  type: string
                  description: >
                    __Host__: Enter the hostname for your database. This is
                    usually an IP address or text in the format
                    __company.domain.com__. Do not include the connection
                    protocol.
                port:
                  type: integer
                  description: |
                    __Port__: Enter the port used to access your database.
                username:
                  type: string
                  description: >
                    __Username__: Enter the username used to access your
                    database.
                password:
                  type: string
                  description: >
                    __Password__: Enter the password used to access your
                    database.
                database_name:
                  type: string
                  description: >
                    __Database Name__: Enter the database name if you want to
                    connect to a specific database.
                schema_name:
                  type: string
                  description: >
                    __Schema Name__: Enter the schema name for the database to
                    which you wish to connect.
                database.field.applicationIntent:
                  type: string
                  enum:
                    - readonly
                    - readwrite
                  description: >
                    __Connection Mode / Application Intent__: You can restrict
                    database connectivity capabilities by specifying the
                    connection mode. Select __Read Only__ to connect to the
                    database in __readonly__ mode.


                    * `readonly`: Connect in read-only mode.


                    * `readwrite`: Connect in read-write mode.


                    Default value: `readwrite`           
        - $ref: '#/components/schemas/database_data_credential'
    bigquery_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - is_service_account
                - project_id
              properties:
                is_service_account:
                  type: boolean
                  description: >-
                    __Is Service Account Authentication?__ We support multiple
                    ways of authenticating your BigQuery account. We recommend
                    using the Google Service Account (System User
                    Authentication) method, as it is best suited for accessing
                    your data and is tied to the service account instead of the
                    individual user account.

                    * Set to `true` if you wish to choose Google Service Account
                    (System User Authentication). 

                    * Set this to `false` if you wish to authenticate using
                    3-legged OAuth. 

                    Default Value: `false`
                project_id:
                  type: string
                  description: >
                    __Project ID__: The Project ID to which the database you
                    wish to access belongs.
                json_creds:
                  type: object
                  description: >
                    __Service Account JSON credentials content__: This is the
                    content of the service account credentials JSON file
                    generated by Google Cloud IAM, which is added to the payload
                    as a JSON object.


                    __Required__ if `is_service_account` is `true`
                auth.type:
                  type: string
                  enum:
                    - OAUTH2
                  description: >
                    __End User Authentication Type__: This must be set to
                    `OAUTH2` if you are choosing the 3-legged OAuth
                    authentication mechanism.


                    __Required__ if `is_service_account` is `false`
                oauth2.client.id:
                  type: string
                  description: |
                    __Client ID__: The Client ID of your OAuth 2.0 client.

                    __Required__ if `is_service_account` is `false`
                oauth2.client.secret:
                  type: string
                  description: >
                    __Client Secret__: The Client Secret of your OAuth 2.0
                    client.


                    __Required__ if `is_service_account` is `false`
                oauth2.access.token.url:
                  type: string
                  enum:
                    - https://www.googleapis.com/oauth2/v4/token
                  description: >
                    __Access Token URL__: The OAuth 2.0 Token URL used for
                    fetching the token from the API token server. This must be
                    `https://www.googleapis.com/oauth2/v4/token`.


                    __Required__ if `is_service_account` is `false`  
                oauth2.token.type.override:
                  type: string
                  enum:
                    - Bearer
                  description: >
                    __Token Type__: The token type that should be used when
                    attaching the OAuth2.0 token to the request. This must be
                    `Bearer`.


                    __Required__ if `is_service_account` is `false`  
                oauth2.access.token.method:
                  type: string
                  enum:
                    - POST
                  description: >
                    __Access Token URL method__: The request method used for the
                    OAuth 2.0 Token URL. This must be `POST`.


                    __Required__ if `is_service_account` is `false`  
                vendor.name:
                  type: string
                  enum:
                    - bigquery
                  description: >
                    __Nexla OAuth 2.0 connector codename__: Unique codename for
                    the Nexla token refresh mechanism, which is used to identify
                    this connector. This must be `bigquery`.


                    __Required__ if `is_service_account` is `false`  
                vendor.token_type:
                  type: string
                  enum:
                    - Bearer
                  description: >
                    __Token Type__: The token type that should be used when
                    attaching the OAuth2.0 token to the request. This must be
                    `Bearer`.


                    __Required__ if `is_service_account` is `false`  
                vendor.auth_scheme:
                  type: string
                  enum:
                    - header
                  description: >
                    __Authentication Payload Mode__: Set how the OAuth 2.0
                    Client ID and Client Secret should be sent with the Token
                    URL. This must be set to `header`.


                    __Required__ if `is_service_account` is `false`  
                vendor.scopes:
                  type: string
                  enum:
                    - >-
                      https://www.googleapis.com/auth/bigquery
                      https://www.googleapis.com/auth/devstorage.read_write
                  description: >
                    __API Scopes__: Scopes that should be added to the OAuth
                    token calls. This should be
                    `https://www.googleapis.com/auth/bigquery
                    https://www.googleapis.com/auth/devstorage.read_write`.


                    __Required__ if `is_service_account` is `false`  
                vendor.refresh_url:
                  type: string
                  enum:
                    - https://www.googleapis.com/oauth2/v4/token
                  description: >
                    __Refresh Token URL__: The OAuth 2.0 Token Refresh URL that
                    is used for fetching a new access token using the current
                    access token and refresh token. This must be
                    `https://www.googleapis.com/oauth2/v4/token`.


                    __Required__ if `is_service_account` is `false`  
                vendor.has_token_expiration_ts:
                  type: boolean
                  enum:
                    - true
                  description: >
                    __Requires Auto-Refresh of Token__: Access tokens are
                    short-lived, and the platform should automatically
                    continuously refresh the token to retain a valid access
                    token. This must be `true`.


                    __Required__ if `is_service_account` is `false`  
                vendor.token_expires_in:
                  type: integer
                  description: >
                    __Access token expiration time__: Set this to the expiration
                    time (in seconds) of the access token received when you made
                    the first token request as part of the 3-legged OAuth 2.0
                    token fetching sequence. This is usually `3599` for a
                    3-legged OAuth workflow.


                    __Required__ if `is_service_account` is `false`
                access_token:
                  type: string
                  description: >
                    __Access Token__: Set this to the access token received when
                    you made the first token request as part of the the 3-legged
                    OAuth 2.0 token fetching sequence.


                    __Required__ if `is_service_account` is `false`
                vendor.access_token:
                  type: string
                  description: >
                    __Access Token__: Set this to the access token received when
                    you made the first token request as part of the the 3-legged
                    OAuth 2.0 token fetching sequence. Note that this is the
                    same as `access_token` above but is required in the payload
                    to allow Nexla to automatically continuously refresh tokens.


                    __Required__ if `is_service_account` is `false`
                vendor.refresh_token:
                  type: string
                  description: >
                    __Refresh Token__: Set this to the refresh token received
                    when you made the first token request as part of the the
                    3-legged OAuth 2.0 token fetching sequence.


                    __Required__ if `is_service_account` is `false`
                gcs.location:
                  type: string
                  description: >
                    __GCS Location for staging data__: Before loading data
                    from/to Bigquery, we might need to stage the data in a
                    temporary GCS location. This temporary location is created
                    by the platform automatically if the user has permission to
                    create a bucket/path.


                    But you can override bucket creation and instead name a
                    specific GCS location where temporary staging files will be
                    created.
                temp.table.dataset:
                  type: string
                  description: >
                    __Temporary Dataset__: Before loading data from/to BigQuery
                    we might need to stage the data in a temporary dataset. This
                    temporary dataset is created by the platform automatically
                    if the user has permission to create a dataset.


                    However, you can override dataset creation and instead name
                    a specific existing dataset as the temporary dataset to be
                    used.
        - $ref: '#/components/schemas/file_data_credential'
