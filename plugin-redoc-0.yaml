  /data_maps/{data_map_id}/entries:
    put:
      tags:
        - Data Maps
      operationId: upsert_data_map_entries
      summary: Upsert Static Data Map Entries
      description: >
        Updates the entries in a static data map. Use this endpoint to add new
        entries or update the row corresponding to a specific key.
      parameters:
        - $ref: '#/components/parameters/accept'
        - name: data_map_id
          in: path
          description: The unique ID of the data map that needs to be updated.
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  description: >
                    Enter the array of data map entries that you wish to upsert.
                    This call will result in an upsert on the data map, i.e.,
                    new rows will be added for keys not present in the data map,
                    and relevant rows will be updated for keys that are already
                    present.
                  items:
                    type: object
                    additionalProperties:
                      type:
                        - string
                        - number
                      x-additionalPropertiesName: data_map_key
                      description: >
                        Each property in this object should be keyed by the
                        desired key name, and the value should be equal to the
                        desired value of that key.
                    example:
                      OrderNo: '1002'
                      Price: '40.38'
                      key: '1002_4'
                      ItemNo: '4'
                      Qty: '10000'
      responses:
        '200':
          $ref: '#/components/responses/data_map_entries'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /data_maps/{data_map_id}/entries/{entry_keys}:
    get:
      tags:
        - Data Maps
      operationId: check_data_map_entries
      summary: Check Data Map Entries
      description: >
        Returns the rows of data from the data map that matches a desired key or
        key pattern.


        This endpoint can be used to check whether the data map contains rows of
        data that match the desired key, keys, or key patterns. Key names should
        be provided in the path in the format described below.
      parameters:
        - $ref: '#/components/parameters/accept'
        - name: data_map_id
          in: path
          description: The unique ID of the data map that needs to be fetched.
          required: true
          schema:
            type: integer
        - name: entry_keys
          in: path
          description: >
            One or more comma-separated keys for accessing data map entries.
            These keys may contain simple matching expressions with `*` wildcard
            characters. The response will contain entries whose primary key
            values match the pattern.
          required: true
          schema:
            type:
              - string
              - integer
      responses:
        '200':
          $ref: '#/components/responses/data_map_entries'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    delete:
      tags:
        - Data Maps
      operationId: delete_data_map_entries
      summary: Delete Data Map Entries
      description: |
        Deletes specific entries from the data map.

        Use this endpoint to remove specific entries from the data map.
      parameters:
        - $ref: '#/components/parameters/accept'
        - name: data_map_id
          in: path
          description: The unique ID of the data map that needs to be fetched.
          required: true
          schema:
            type: integer
        - name: entry_keys
          in: path
          description: >
            One or more comma-separated keys for accessing access data map
            entries. These keys may contain simple matching expressions with `*`
            wildcard characters. 
          required: true
          schema:
            type:
              - string
              - integer
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
