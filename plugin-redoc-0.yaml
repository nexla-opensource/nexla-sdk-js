    AsyncResponse:
      type: object
      description: >
        This object represents the response of an asynchronous operation. The
        response can be a dictionary or an array of dictionaries. The format of
        the response depends on the operation that was executed.
      properties:
        request_id:
          type: integer
          description: >
            The unique ID of the request that was executed. This ID can be used
            to track the status of the request.
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
        request_started_at:
          type: string
          format: date-time
          description: |
            The date and time when the request was started.
        progress:
          type: integer
          description: >
            The progress of the request (value from 0 to 100). This value is a
            percentage of the total progress of the request. Applicable only to
            certain types of async operations.
        result:
          type: object
          description: |
            The result of the async operation. Format depends on the task type.
          additionalProperties: true
        request_stopped_at:
          type: string
          format: date-time
          description: >
            The date and time when the request was stopped. This field is only
            present if the request has been stopped (due to cancellation or
            error).
        request_completed_at:
          type: string
          format: date-time
          description: >
            The date and time when the request was completed. This field is only
            present if the request has been completed successfully.
    probe_response_with_async_results:
      oneOf:
        - $ref: '#/components/schemas/AsyncResponse'
        - type: object
          properties:
            output:
              type: object
              description: |
                The output of the probe operation.
              additionalProperties: true
