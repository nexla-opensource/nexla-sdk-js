    file_data_sink:
      type: object
      properties:
        sink_config:
          type: object
          required:
            - sink_type
            - path
            - data_format
          properties:
            path:
              type: string
              description: >
                __Path to Write__: Set the path to which you want to write all
                files.
            output.dir.name.pattern:
              type: string
              description: >
                __Subfolder Path Format__: You can configure the platform to
                automatically create subfolders and partition files into those
                subfolders.


                Use Nexla system macros like `{YYYY}`, `{MM}`, etc. to create
                date-time subfolders. You can also split folders by values of an
                attribute in the Nexset by using the macro
                `{record.<attribute-name>}`.


                Default Value: `{YYYY}/{MM}/{dd}`
            file.name.prefix:
              type: string
              description: >
                __Custom File Name Prefix__: Generated file names are in the
                format <prefix>-<nexset-identifier>-<randomizer>. Set this
                property to define the prefix of each file.


                You can use Nexla system macros like `{YYYY}`, `{MM}`, etc. to
                create date-time patterns. 
            max.file.size.mb:
              type: integer
              description: >
                __Maximum File Size (in MB)__: The maximum size (MB) of each
                generated file. Data will automatically be partitioned into
                multiple files.


                Default Value: `4096`
            data_format:
              type: string
              enum:
                - csv
                - tsv
                - json
                - xml
                - xlsx
                - edi
                - avro
                - parquet
                - orc
                - fw
              description: >
                __File Format__: Set the output format of the generated files.


                * `csv`: Files where column values are separated by commas.

                * `tsv`: Files where column values are separated by tabs.

                * `json`: Files where each row is a valid JSON object. Note that
                this is a JSON-line file with a `.json` extension.

                * `xlsx`: Excel files.

                * `edi`: EDI files.

                * `avro`: AVRO files.

                * `parquet`: Parquet files.

                * `orc`: ORC files.

                * `fw`: Fixed width files where each column has a fixed width.
            xml.root:
              type: string
              description: >
                __Parent XML Tag__: Data from each record is wrapped around a
                parent XML tag when writing to XML files. Set the wrapper tag
                that should be used. The default wrapper tag is `root`.


                Only valid if `data_format` is `orc`


                Default Value: `root`
            orc.compress:
              type: string
              enum:
                - none
                - zlib
                - snappy
                - lzo
                - lz4
              description: >
                __ORC Compression Type__: Select the type of compression
                algorithm that should be used to compress file contents into ORC
                files.


                Only valid if `data_format` is `orc`


                Default Value: `zlib`
            write.header:
              type: boolean
              description: >
                __Write Attribute Names As Header?__: Set this option if you
                want the attribute names to be added as a header row on each
                file.


                Only applicable if `data_format` is `fw`.


                Default Value: `true`
            field.lengths:
              type: string
              description: >
                __Length of Each Field in File__: Enter the length of each field
                in the file. This should be entered as a comma-separated list of
                numbers, for ex: `10,12,8,15,20`.


                Only applicable if `data_format` is `fw`.
            padding.character:
              type: string
              description: >
                __Padding Character__: Choose or type the character that should
                be used to separate fields. For ex: `_`. 


                Only applicable if `data_format` is `fw`.

                Default: single space ` `


                Common Values: 

                * ` `: Single Space

                * `` : No Padding

                * `,`: Comma

                * `\\t`: Tab

                * `\\n`: Newline

                * `;`: Semicolon

                * `|`: Pipe

                * `^`: Caret           
            line.separator:
              type: string
              description: >
                __Line Separation Character__: Specify the character that should
                be recognized by the platform as an indicator of a new line. 


                Only applicable if `data_format` is `fw`.


                Default:  `\\n`


                Common Values: 

                * `\\t`: Tab

                * `\\n`: Newline
            mapping:
              type: object
              required:
                - mode
                - tracker_mode
              description: >
                __Mapping__: Set rules for how Nexset record attributes should
                be written into the generated files.
              properties:
                mode:
                  type: string
                  enum:
                    - auto
                    - manual
                  description: >
                    Based on the desired `data_format`, Nexla automatically
                    converts Nexset records into appropriate contents in output
                    files.


                    However, for some `data_formats` such as `csv` that support
                    the concept of additional rules like the column order, you
                    can choose to manually assign Nexset attributes to output
                    row mapping.



                    * `auto` : Automatically map Nexset attributes to output
                    files. Recommended for data_formats `json`, `xml`, `edi`,
                    `avro`, `parquet`, and `orc`. 


                    * `manual`: Explicitly define attribute mapping and columns
                    in the output file. Recommended for data_formats `csv`,
                    `tsv`, `xlsx`, and `GOOGLE_SPREADSHEET`.
                mapping:
                  type: object
                  description: >
                    __Attribute to File Column Mapping__: Define how attributes
                    should be mapped to database columns.


                    __Required__ if `mapping.mode` is `manual`


                    __Object Definition Rules__: 


                    Each Nexset record attribute that needs to be written to one
                    or more columns should be listed as a property of this
                    `mapping` object. In the example, the properties are
                    `nexset_attr_1` and `nexset_attr_2`.


                    __Example__
                      ```
                      {
                          "nexset_attr_1": [
                              "file_col_1",
                              "file_col_2"
                            ],
                          "nexset_attr_2": [
                              "file_col_3"
                            ]
                      }
                    ```
                  additionalProperties:
                    type: array
                    x-additionalPropertiesName: nexset_attribute_name
                    description: >
                      Property Name: The Nexset attribute name that needs to be
                      written out.


                      Property Value: The array of file column header names for
                      this attribute.
                    items:
                      type: string
                fields_order:
                  type: array
                  format: strings
                  description: >
                    __Field Order__: The order of the column names in the output
                    file.


                    __Required__ if `mapping.mode` is `manual`
                header_template:
                  type: string
                  description: >
                    __Optional Header Content__: You can choose to add a
                    predefined header in each generated output file. The format
                    of this string should match the format of a row of data in
                    that `data_format`.


                    For example, if the `data_format` is `xml`, the header would
                    be an XML object like `<hdate>{now}</hdate>`, but if the
                    desired value is a JSON string, it would be
                    `"{\"header\":\"{now}\"}`.


                    Note that this field supports Nexla date-time macros like
                    `{now}`.
                tracker_mode:
                  type: string
                  enum:
                    - NONE
                    - RECORD
                  description: >
                    __Tracker Mode__: Each record that flows through Nexla has
                    an associated unique tracker ID. Set this to `RECORD` to
                    configure the tracker ID to be written out to a column along
                    with the Nexset record.


                    * `NONE`: The tracker won't be written to the database.

                    * `RECORD`: The short-form tracker containing all required
                    lineage information will be written out in the relevant
                    column.
                tracker_name:
                  type: string
                  description: >
                    __Column Name for Nexla Tracker__: The column name for the
                    Nexla record tracker information.


                    __Applicable and Required__ if `tracker.mode` is set to
                    `RECORD`.    
