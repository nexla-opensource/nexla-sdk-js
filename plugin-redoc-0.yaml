          type: integer
        metric:
          type: object
          properties:
            records:
              type: integer
            size:
              type: integer
            errors:
              type: integer
    FlowLogEntry:
      type: object
      properties:
        timestamp:
          type: integer
          format: unix epoch in milliseconds
          example: 1695442864636
          description: |
            Timestamp at which this log entry was generated.
        resource_id:
          type: integer
          description: |
            The ID of the resource that generated this log entry.
        resource_type:
          type: string
          description: |
            The type of flow resource that generated this log entry.  
          enum:
            - SOURCE
            - DATASET
            - SINK
        log:
          type: string
          example: Processed records=100, errors=0, size=94162"
          description: >
            Detailed information about the data processing events on the flow
            resource.
        log_type:
          type: string
          description: >
            Indicates the type of event reflected by log entry.


            * `SUMMARY`: Log entry describing high level summary of data
            processing event.

            * `LOG`: Log entry describing details of data processing status.
          enum:
            - LOG
            - SUMMARY
        severity:
          type: string
          description: |
            Indicates the severity of the event reflected by this log entry.
          enum:
            - INFO
            - WARNING
            - ERROR
    LogEntry:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: |
            Unique ID of this change event.
        item_type:
          type: string
          example: DataSource
          description: |
            The type of resource that the change was performed on.
        item_id:
          type: integer
          format: int32
          description: |
            Unique ID of resource that the change was performed on.
        event:
          type: string
          example: association_added
          description: |
            The type of change event that was executed.
        change_summary:
          type: array
          items:
            type: string
            example: status
            description: >
              Summary of types of changes executed during this change event.
              This is usually a comma-separated list of properties or types of
              properties that were modified as a result of some user action.
        object_changes:
          type: object
          description: >
            This object contains before and after information on each property
            that was modified as a result of this change event.


            Each key in this object is the name of the property that was
            modified. The value of each property is a 2-element array. The first
            element shows the value of the property before the change event was
            executed and the second element shows the value of this property
            after the change event was executed. 


            For example, the values below should be interpreted as resource
            `status` was changed from `ACTIVE` to `PAUSED` and resource `name`
            was changed from `before` to `after`. 


            ```
             {
               "status": ["ACTIVE", "PAUSED"],
               "name": ["before", "after"]

             }

            ```     
          additionalProperties:
            x-additionalPropertiesName: property_name
            description: >
              The object key shows the resource property name that was modified.
              The value of each property is a 2-element array. The first element
              shows the value of the property before the change event was
              executed and the second element shows the value of this property
              after the change event was executed. 
            type: array
            items:
              type:
                - string
                - number
                - integer
                - boolean
                - object
                - array
                - 'null'
              minItems: 2
              maxItems: 2
        association_resource:
          type: object
          format: nullable
          description: >
            Sometimes change events result in updates to relationships between
            resources. This object reflects information about the resource
            relationship that was modified.
          properties:
            type:
              type: string
              description: >
                The resource type of the resource whose relationship with this
                resource was modified.
            id:
              type: integer
              format: int32
              description: >
                The ID of the resource whose relationship with this resource was
                modified.          
        request_ip:
          type: string
          format: ipv4
          example: 1.2.3.4
          description: |
            IP Address of the device where this change event request originated.
        request_user_agent:
          type: string
          description: >
            User Agent of the browser where this change event request
            originated.
        request_url:
          type: string
          format: url
          description: >
            Nexla UI or API URL that was accessed by the user to trigger this
            change event.
        user:
          type: object
          description: >
            Details about the user who triggered this change event. Note that if
            changes were triggered by a Nexla support team member acting on
            behalf of a user then this field reflects information about that
            user while `impersonator_id` reflects information about the Nexla
            support team member.
          properties:
            id:
              type: integer
              format: int32
            email:
              type: string
              format: email
              example: user@nexla.com
        impersonator_id:
          type: string
          format: nullable
          description: >
            If the changes were made by a Nexla support team member acting on
            behalf of a user then this field reflects information about the
            Nexla support team member.      
        org_id:
          type: integer
          format: int32
          description: |
            The ID of the organization that this resource belongs to.
        owner_id:
          type: integer
          format: int32
          description: |
            The ID of the user that this resource belongs to.  
        owner_email:
          type: string
          description: |
            Email ID of the user that this resource belongs to. 
        created_at:
          type: string
          format: date-time
          example: '2022-11-08T22:51:47.720Z'
