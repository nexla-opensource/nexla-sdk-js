        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                description: >
                  Status of the report request. This must be 200 for the data
                  object in the response to be considered valid.               
              message:
                type: string
                description: >
                  Message signifying status of the report request. This must be
                  `Ok` for the data object in the response to be considered
