            Set this to `true` if you wish to send any custom headers to be
            included in the ingested records as part of the request. 


            The platform will ignore standard headers like `Authorization` and
            `Content-Type`. Any custom headers will be added as a
            `header_<header_name>` attribute in the record.


            Example: The request header `NEX-HEADER: test` will be ingested as
            the attribute `header_NEX-HEADER` with the value `test`.


            Default value: `false`
          schema:
            type: boolean
        - name: include_url_params
          in: path
          description: >
            Set this to `true` if you wish to send any custom query parameters
            to be included in the ingested records as part of the request. 


            The platform will ignore standard query parameters like `api_key`.
            Any custom query parameters will be added as a
            `url_param_<param_name>` attribute in the record.


            Example: The request query parameter `abc=def` will be ingested as
            the attribute `url_param_abc` with the value `def`.


            Default value: `false`
          schema:
            type: boolean
        - name: force_schema_detection
          in: path
          description: >
            Usually, the platform performs Nexset schema detection only for the
            first few records from a new webhook. This is to avoid any
            unnecessary latencies in webhook record processing. 


            Set this to `true` if you wish to enforce any webhook event to
            trigger schema detection. 


            Default value: `false`
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nexset_record'
            example:
              id: 1
              name: one
          application/xml:
            schema:
              type: object
              properties:
                root:
                  $ref: '#/components/schemas/nexset_record'
                  xml:
                    name: root
                    wrapped: true
            example: |
              <root>
                <id>1</id>
                <name>one</name>
              </root>
      responses:
        '200':
          description: Returns the 200 status to indicate that data was received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetId:
                    type: integer
                    description: Nexset ID of the Nexset to which this record is sent.
                  processed:
                    type: integer
                    description: Number of records successfully processed by Nexla.
        '403':
          description: Request failed authentication
        '500':
          description: Returned when the service is not able to consume the data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: |
                      Descriptive text about the error reason. 
                    example: 'Source #1000 is PAUSED'
  send_many_records:
    post:
      summary: Send many records to Webhook
      description: >
        Send an array of JSON objects. Nexla will treat each object as a unique
        record for the webhook.
      operationId: send_many_records
      tags:
        - Webhooks
      security:
        - NexlaApiKeyQuery: []
        - NexlaApiKeyHeader: []
      parameters:
        - name: include_headers
          in: path
          description: >
            Set this to `true` if you wish to send any custom headers to be
            included in the ingested record as part of the request. 


            The platform will ignore standard headers like `Authorization` and
            `Content-Type`. Any custom headers will be added as a
            `header_<header_name>` attribute in the record.


            Example: The request header `NEX-HEADER: test`  will be ingested as
            the attribute `header_NEX-HEADER` with the value `test`.


            Default value: `false`
          schema:
            type: boolean
        - name: include_url_params
          in: path
          description: >
            Set this to `true` if you wish to send any custom query parameters
            to be included in the ingested records as part of the request. 


            The platform will ignore standard query parameters like `api_key`.
            Any custom query parameters will be added as a
            `url_param_<param_name>` attribute in the record.


            Example: The request query parameter `abc=def` will be ingested as
            the attribute `url_param_abc` with the value `def`.


            Default value: `false`
          schema:
            type: boolean
        - name: force_schema_detection
          in: path
          description: >
            Usually, the platform performs Nexset schema detection only for the
            first few records from a new webhook. This is to avoid any
            unnecessary latencies in webhook record processing. 


            Set this to `true` if you wish to enforce any webhook event to
            trigger schema detection. 


            Default value: `false`
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/nexset_record'
      responses:
        '200':
          description: Returns the 200 status to indicate that data was received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetId:
                    type: integer
                    description: Nexset ID of the Nexset to which this record is sent.
                  processed:
                    type: integer
                    description: Number of records successfully processed by Nexla.
        '403':
          description: Request failed authentication
        '500':
          description: Returned when the service is not able to consume the data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: |
                      Descriptive text about the error reason. 
                    example: 'Source #1000 is PAUSED'
components:
  securitySchemes:
    NexlaSessionToken:
      type: http
      scheme: Bearer
      bearerFormat: JWT
      description: >
        The first step in calling the Nexla API or Nexla CLI is to fetch a
        Session access token by logging on to your Nexla UI instance. This
        ensures that your authentication is performed through your
        organization's preferred Identity Provider.


        To fetch an access token from the Nexla UI, simply go to your Nexla UI
        instance, and try the route `/token`. For example, if your Nexla UI
        instance is at `https://dataops.nexla.io`, open
        `https://dataops.nexla.io/token` in the browser. 


        This will automatically route you to a login page, ask you to
        authenticate using your preferred Identity Provider, and, upon
        successful authentication, route you to a page where you can copy the
        Access Token.


        Usage format: `Bearer <JWT>`.
    NexlaApiKeyQuery:
      type: apiKey
      name: api_key
      in: query
      description: >
        > **Important:** Never share your API keys. Keep them guarded and
        secure. If you think the key has been compromised, you can rotate the
        API key by calling relevant API Key management endpoints.


        The platform generates a unique API key for this resource. Add the API
        key as a query parameter to authenticate this request.

        Usage: `?api_key=<api-key>`
    NexlaApiKeyHeader:
      type: http
      scheme: Basic
      description: >
        > **Important:** Never share your API keys. Keep them guarded and
        secure. If you think the key has been compromised, you can rotate the
        API key by calling relevant API Key management endpoints.


        The platform generates a unique API key for this resource. Add the API
        key as an authorization header to authenticate this request.

        Usage format: `Basic <api-key>`
    basicAuth:
      type: http
      scheme: basic
    GoogleSSOToken:
      type: http
      scheme: Bearer
      bearerFormat: JWT
      description: |
        The token that is used when logging into Nexla via Google SSO.
  parameters:
    access_roles:
      name: access_role
      in: query
      schema:
        type: string
        enum:
          - collaborator
          - operator
          - admin
          - owner
        description: >
          Add this query parameter to a request to view resources for which the
          authenticated user has permission. 


          1. `collaborator`: Resources to which the user has access via the
          collaborator or higher permissions.

          2. `operator`: Resources to which the user has access via the operator
          or higher permissions.

          3. `admin`: Resources to which the user has access via the
          administrator or owner permissions.

          4. `owner`: Resources created by the user.

          Note that the absence of this property in the request is treated as
          `owner`, so you do not need to set `access_role=owner` in the query.
        externalDocs:
          description: Nexla API access roles
          url: https://developers.nexla.com/docs/access-modes
    accept:
      name: Accept
      in: header
      schema:
        type: string
        enum:
          - application/vnd.nexla.api.v1+json
          - application/json
        description: |
          Setting to `application/vnd.nexla.api.v1+json` is recommended.
    expand:
      name: expand
      in: query
      schema:
        type: integer
        enum:
          - 1
        description: >
          Add this parameter to a resource fetch request to receive details
          about related resources in the response.
    page:
      name: page
      in: query
      schema:
        type: integer
        description: >
          Add this parameter to a resource fetch request to fetch a specific
          page of data.
    per_page:
      name: per_page
      in: query
      schema:
        type: integer
        description: >
          Add this parameter to a resource fetch request to set the number of
          items that should be returned in each request.
    size:
      name: size
      in: query
      schema:
        type: integer
        description: >
          Add this parameter to a resource fetch request to set the number of
          items that should be returned in each request.
  schemas:
    owner:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
    org:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email_domain:
          type: string
        email:
          type: 'null'
        client_identifier:
          type: 'null'
    AccessRoles:
      type: array
      description: >
        This property reflects all the permissions the user/team/organization
        has to this resource. 


        1. `collaborator`: The user/team/organization can view the resource but
        not make any modifications to it.

        2. `operator`: The user/team/organization can view the resource and can
        activate/pause it, but not make any other modifications to it.

        3. `administrator`: The user/team/organization has complete
        administrative rights to this resource.

        4. `owner`: This user created the resource and so has complete
        administrative rights to it. 
      items:
        type: string
        enum:
          - owner
          - collaborator
          - operator
          - admin
    data_credential:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        credentials_type:
          type: string
      discriminator:
        propertyName: credentials_type
        mapping:
          as400: '#/components/schemas/as400_data_credential'
          aws_athena: '#/components/schemas/aws_athena_data_credential'
