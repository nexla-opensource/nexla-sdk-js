    file_probe_tree:
      allOf:
        - $ref: '#/components/schemas/probe_tree_common'
        - type: object
          properties:
            object:
              type: object
              description: >
                This object reports the folder-file structure in a nested JSON
                format for visualizing the file storage hierarchy tree.


                The unique name/identifier of any element in the storage system
                is set as the key of the relevant node. Each node entry contains
                the following:

                1. a `type` property that defines whether the element is a
                `folder`, `file`, or `meta` (Nexla probe response meta-data).

                2. the top-level node has a special `meta` key that contains
                response metadata (of the type `meta`) and a key that indicates
                the name/unique ID of the root folder.
                  - for storage systems like `s3` that have a bucket concept, the top-level keys are all bucket names to which this credential has access.
                  - for storage systems like `gdrive` that have a unique ID and synthetic display names, the keys represent unique IDs instead of folder names.
                  - for storage systems like `ftp`, `dropbox`, and `box` that do not have buckets, the top-level entry is `/` to signify the credential root folder. 
                2. a `value` property that defines the children of that node. 
                  - For a folder, the `value` is an object, with each subfolder and file as an entry.
                  - For a file, the `value` is an empty object `{}` because files do not have any children.
                3. `file`-type nodes have `created_at`, `updated_at`, and `size`
                properties that indicate the corresponding values for that file.

                4. For Google Drive-type systems, wherein the storage assigns a
                unique identifier instead of constraining the display name to be
                unique, the `value` object contains a `display_name` property to
                indicate the name of that entry.


                __Example__ Sample value of `output` in the probe tree response:

                ```

                {
                  "/": {
                    "type": "folder",
                    "value": {
                      "subfolder_1": {
                        "type": "folder",
                        "value": {
                          "subfolder_1a": {
                            "type": "folder"
                            "value": {}
                          }
                        },
                      "subfolder_2": {
                        "type": "folder",
                        "value": {
                          "subfolder_2a": {
                            "type": "folder"
                            "value": {}
                          },
                          "file_1": {
                            "type": "file",
                            "created_at": 1664998398000,
                            "updated_at": 1664998398000,
                            "size": 152,
                            "value": {}
                          }
                        },
                      }
                  }
                ```  
              properties:
                folder_name:
                  type: object
                  description: >
                    Name or unique identifier of the folder/subfolder. This
                    value might be `/` at the root of the hierarchy for some
                    storage types, like `dropbox` and `ftp`.
                  properties:
                    type:
                      type: string
                      enum:
                        - folder
                      description: >
                        The type `folder` indicates that this property is the
                        name of a folder.
                    display_name:
                      type: string
                      description: >
                        This value indicates the display name of this folder and
                        is only present for storage systems like `gdrive`, in
                        which display names are not unique. 
                    value:
                      type: object
                      description: |
                        List of subfolders and files in this folder.
                      properties:
                        file_name:
                          type: object
                          description: |
                            Name of the file.
                          properties:
                            type:
                              type: string
                              enum:
                                - file
                            created_at:
                              type: integer
                              description: |
                                File creation time in epoch time (milliseconds).
                            updated_at:
                              type: integer
                              description: >
                                File modification time (most recent) in epoch
                                time (milliseconds).
                            size:
                              type: integer
                              description: |
                                File size in bytes. 
                            display_name:
                              type: string
                              description: >
                                This value indicates the display name of the
                                file and is only present for storage systems
                                like `gdrive`, in which display names are not
                                unique.
                meta:
                  type: object
                  description: >
                    A special metadata object that indicates the relevant
                    response Nexla metadata for probe responses. This is only
                    present at the root level.
                  properties:
                    type:
                      type: string
                      enum:
                        - meta
                    value:
                      type: object
    database_probe_tree:
      allOf:
        - $ref: '#/components/schemas/probe_tree_common'
        - type: object
          properties:
            object:
              type: object
              description: >
                This object reports the database-table-column structure in a
                nested JSON format for visualizing the database hierarchy tree.


                The unique name/identifier of any element in the storage system
                is set as the key of the relevant node. Each node entry contains
                the following:

                1. a `type` property that defines whether the element is a
                `database`, `table`, or `column`.

                2. a `value` property that defines the children of that node. 
                  - For a database, the `value` is an object, with each table included as a property of the object.
                  - For a table, the `value` is an array of objects, with each object matching a column of the database.
                  - Column objects do not have any `value` property because columns do not have any children.
                3. `column`-type nodes have `name`, `primaryKey` and
                `defaultValue` properties that define the column properties.


                __Example__ Sample value of `output` in the probe tree response.

                ```

                {
                  "DEMO_DB": {
                    "type": "database",
                    "value": {
                      "DEMO_TABLE": {
                        "type": "table",
                        "value": [
                          {
                            "name": "CREATIONDATE",
                            "primaryKey": false,
                            "type": "VARCHAR",
                            "defaultValue": null
                          },
                          {
                            "name": "PROJECTNAME",
                            "primaryKey": false,
                            "type": "VARCHAR",
                            "defaultValue": null
                          },
                          {
                            "name": "PROJECTYEAR",
                            "primaryKey": false,
                            "type": "VARCHAR",
                            "defaultValue": null
                          }
                        ]
                      }
                  }
                ```  
              properties:
                db_name_1:
                  type: object
                  description: |
                    Name of database.
                  properties:
                    type:
                      type: string
                      enum:
                        - database
                      description: >
                        The type `database` indicates that this property is the
                        name of a database.
                    value:
                      type: object
                      description: |
                        List of tables in the database.
                      properties:
                        table_name_1:
                          type: object
                          description: |
                            Name of the table.
                          properties:
                            type:
                              type: string
                              enum:
                                - table
                            value:
                              type: array
                              items:
                                type: object
                                description: >
                                  An array of objects, wherein each object is a
                                  column in the database.
                                properties:
                                  type:
                                    type: string
                                    enum:
                                      - column
                                  name:
                                    type: string
                                    description: |
                                      Name of the column.
                                  primaryKey:
                                    type: boolean
                                    description: >
                                      Whether or not this column is a primary
                                      key for the table. 
                                  defaultValue:
                                    type:
                                      - 'null'
                                      - string
                                      - number
                                    description: >
                                      Whether or not the column has a default
                                      value.               
    nosql_probe_tree:
      allOf:
        - $ref: '#/components/schemas/probe_tree_common'
        - type: object
          properties:
            object:
              type: object
              description: >
                This object reports the database-collection structure in nested
                JSON format for visualizing the database hierarchy tree.


                The unique name/identifier of any element in the storage is set
                as the key of the relevant node. Each node entry contains the
                following:

                1. a `type` property that defines whether the element is a
                `database` or `collection`.

                2. a `value` property that defines the children of that node. 
                  - For a database, the `value` is an object, with each collection as a property of the object.
                  - For a collection, this is an empty object (`{}`), as the platform does not list documents inside the collection as part of this response. Use the `probe/sample` endpoint to obtain sample documents from the collection. 

                __Example__ Sample value of `output` in the probe tree response:

                ```

                {
                  "DEMO_DB": {
                    "type": "database",
                    "value": {
                      "demo collection_1": {
                        "type": "collection",
                        "value": {}
                      },
                      "demo collection_2": {
                        "type": "collection",
                        "value": {}
                      }                

                  }
                ```  
              properties:
                db_name_1:
                  type: object
                  description: |
                    Name of the database.
                  properties:
                    type:
                      type: string
                      enum:
                        - database
                      description: >
                        The type `database` indicates that this property is the
                        name of a database,
                    value:
                      type: object
                      description: |
                        List of collections in the database.
                      properties:
                        collection_name_1:
                          type: object
                          description: |
                            Name of the collection.
                          properties:
                            type:
                              type: string
                              enum:
                                - collection
                            value:
                              type: object
                              enum:
                                - {}
    probe_tree_with_async:
      oneOf:
        - $ref: '#/components/schemas/probe_tree_common'
        - $ref: '#/components/schemas/AsyncResponse'
