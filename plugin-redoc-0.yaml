    gcs_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - is_service_account
                - project_id
              properties:
                is_service_account:
                  type: boolean
                  description: >-
                    __Is Service Account Authentication?__ We support multiple
                    ways of authenticating your GCS account. We recommend using
                    the Google Service Account (System User Authentication)
                    method, as it is best suited for accessing your data and is
                    tied to the service account instead of the individual user
                    account.

                    * Set to `true` if you wish to choose Google Service Account
                    (System User Authentication). 

                    * Set this to `false` if you wish to authenticate using
                    3-legged OAuth. 

                    Default Value: `false`
                project_id:
                  type: string
                  description: >
                    __Project ID__: The Project ID to which the GCS paths you
                    wish to access belong.
                json_creds:
                  type: object
                  description: >
                    __Service Account JSON credentials content__: This is the
                    content of the service account credentials JSON file
                    generated by Google Cloud IAM, which is added to the payload
                    as a JSON object.


                    __Required__ if `is_service_account` is `true`
                auth.type:
                  type: string
                  enum:
                    - OAUTH2
                  description: >
                    __End User Authentication Type__: This must be set to
                    `OAUTH2` if you are choosing the 3-legged OAuth
                    authentication mechanism.


                    __Required__ if `is_service_account` is `false`
                oauth2.client.id:
                  type: string
                  description: |
                    __Client ID__: The Client ID of your OAuth 2.0 client.

                    __Required__ if `is_service_account` is `false`
                oauth2.client.secret:
                  type: string
                  description: >
                    __Client Secret__: The Client Secret of your OAuth 2.0
                    client.


                    __Required__ if `is_service_account` is `false`
                oauth2.access.token.url:
                  type: string
                  enum:
                    - https://www.googleapis.com/oauth2/v4/token
                  description: >
                    __Access Token URL__: The OAuth 2.0 Token URL used for
                    fetching the token from the API token server. This must be
                    `https://www.googleapis.com/oauth2/v4/token`.


                    __Required__ if `is_service_account` is `false`  
                oauth2.token.type.override:
                  type: string
                  enum:
                    - Bearer
                  description: >
                    __Token Type__: The token type that should be used when
                    attaching the OAuth2.0 token to the request. This must be
                    `Bearer`.


                    __Required__ if `is_service_account` is `false`  
                oauth2.access.token.method:
                  type: string
                  enum:
                    - POST
                  description: >
                    __Access Token URL method__: The request method used for the
                    OAuth 2.0 Token URL. This must be `POST`.


                    __Required__ if `is_service_account` is `false`  
                vendor.name:
                  type: string
                  enum:
                    - gcs
                  description: >
                    __Nexla OAuth 2.0 connector codename__: Unique codename for
                    the Nexla token refresh mechanism, which is used to identify
                    this connector. This must be `gcs`.


                    __Required__ if `is_service_account` is `false`  
                vendor.token_type:
                  type: string
                  enum:
                    - Bearer
                  description: >
                    __Token Type__: The token type that should be used when
                    attaching the OAuth2.0 token to the request. This must be
                    `Bearer`.


                    __Required__ if `is_service_account` is `false`  
                vendor.auth_scheme:
                  type: string
                  enum:
                    - header
                  description: >
                    __Authentication Payload Mode__: Set how the OAuth 2.0
                    Client ID and Client Secret should be sent with the Token
                    URL. This must be set to `header`.


                    __Required__ if `is_service_account` is `false`  
                vendor.scopes:
                  type: string
                  enum:
                    - https://www.googleapis.com/auth/devstorage.read_write
                  description: >
                    __API Scopes__: Scopes that should be added to the OAuth
                    token calls. This should be
                    `https://www.googleapis.com/auth/devstorage.read_write`.


                    __Required__ if `is_service_account` is `false`  
                vendor.refresh_url:
                  type: string
                  enum:
                    - https://www.googleapis.com/oauth2/v4/token
                  description: >
                    __Refresh Token URL__: The OAuth 2.0 Token Refresh URL used
                    for fetching a new access token using the current access
                    token and refresh token. This must be
                    `https://www.googleapis.com/oauth2/v4/token`.


                    __Required__ if `is_service_account` is `false`  
                vendor.has_token_expiration_ts:
                  type: boolean
                  enum:
                    - true
                  description: >
                    __Requires Auto-Refresh of Token__: GCS Access tokens are
                    short-lived, and the platform should automatically
                    continuously refresh the token to retain a valid access
                    token. This must be `true`.


                    __Required__ if `is_service_account` is `false`  
                vendor.token_expires_in:
                  type: integer
                  description: >
                    __Access token expiration time__: Set this to the expiration
                    time (in seconds) of the access token received when you made
                    the first token request as part of the 3-legged OAuth 2.0
                    token fetching sequence. This is usually `3599` for a GCS
                    3-legged OAuth workflow.


                    __Required__ if `is_service_account` is `false`
                access_token:
                  type: string
                  description: >
                    __Access Token__: Set this to the access token received when
                    you made the first token request as part of the 3-legged
                    OAuth 2.0 token fetching sequence.


                    __Required__ if `is_service_account` is `false`
                vendor.access_token:
                  type: string
                  description: >
                    __Access Token__: Set this to the access token received when
                    you made the first token request as part of the 3-legged
                    OAuth 2.0 token fetching sequence. Note that this is the
                    same as `access_token` above but is required in the payload
                    to allow Nexla to automatically continuously refresh tokens.


                    __Required__ if `is_service_account` is `false`
                vendor.refresh_token:
                  type: string
                  description: >
                    __Refresh Token__: Set this to the refresh token received
                    when you made the first token request as part of the
                    3-legged OAuth 2.0 token fetching sequence.


                    __Required__ if `is_service_account` is `false`
                test.path:
                  type: string
                  description: >
                    __GCS Path list access is limited to__ : Set this property
                    to `<bucket-name>` or `<bucket-name>/<folder-name>` if your
                    GCS admin has restricted access to only a specific bucket or
                    a path inside a bucket.
        - $ref: '#/components/schemas/file_data_credential'
