                    __Applicable and required__  if `tba_enabled` is `true`
                consumer_key:
                  type: string
                  description: >
                    __Consumer key__: The consumer key for the integration
                    record. This string was created when you created the
                    integration record.


                    __Applicable and required__  if `tba_enabled` is `true`
                consumer_secret:
                  type: string
                  description: >
