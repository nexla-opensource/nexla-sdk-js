                    __Oracle Wallet__: Oracle Autonomous connections require a
                    wallet that contains a collection of files, including key
                    and other information required to connect to your database.

                      Add the content of your Oracle wallet file downloaded from the database. This wallet is a zip file. Encode the zip file content as a Base64-encoded string in the request.
                username:
                  type: string
                  description: >
                    __Username__: Enter the username used to access your
                    database.
                password:
                  type: string
                  description: >
                    __Password__: Enter the password used to access your
                    database.
                database_name:
                  type: string
                  description: >
                    __Database Name__: Enter the database name if you want to
                    connect to a specific database.
                schema_name:
                  type: string
                  description: >
                    __Schema Name__: Enter the schema name for the tables in
                    which you are interested.   
        - $ref: '#/components/schemas/database_data_credential'
