    rest_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - auth.type
                - test.url
                - test.method
                - test.content.type
              properties:
                auth.type:
                  type: string
                  enum:
                    - NONE
                    - BASIC
                    - API_KEY
                    - TOKEN
                    - OAUTH1
                    - OAUTH2
                    - AWS_SIGNATURE
                    - gcp_service_account
                  description: >
                    __Authentication Mechanism__: Credentials can be configured
                    to allow API access through different rest connector
                    authentication mechanisms supported by the API. Select the
                    authentication mechanism that is best suited for your use
                    case.


                    __Tips__:


                    1. Select `NONE` if it is a public API. 


                    2. Select `NONE` and set appropriate `request.headers` if
                    the API requires hardcoded headers.


                    3. If the API requires API Key in header, while the option
                    above will work, we recommend selecting `API_KEY` and
                    setting appropriate options for how API Key is included in
                    Header.


                    3. Select `OAUTH2` for 2-legged or 3-legged Oauth2
                    Authentication. 


                    4. Choose appropriate settings if the API also requires
                    `JWT` or `HMAC` signature verification.


                    __Values__:

                    * `NONE`: __No Auth Mode__ Use this mode if the API does not
                    require any authentication, or if the authentication
                    information is sent as custom request headers or url query
                    parameters.


                    * `BASIC`: __Basic Auth__ - Use this mode for any API that
                    requires a verified username and password to be sent with
                    every request. This username password is sent as `Basic
                    <base-64 encoded username:password>` on the Authorization
                    request header.


                    * `API_KEY`: __Api Key__ - Use this mode for any API that a
                    key-value api key pair to be sent with every request, either
                    as a Request Header or a Query parameter.


                    * `TOKEN`: __Token__ - Use this mode for any API that
                    requires fetching a short-lived token before authenticated
                    calls can be made for other endpoints.


                    * `OAUTH1`: __OAuth 1.0__ - Use this mode for any API that
                    requires multi-step OAuth1.0 based authentication workflow.
                    Nexla supports 2-legged and 3-legged OAuth workflows and has
                    ability to automatically refresh short-lived tokens.


                    * `OAUTH2`: __OAuth 2.0__ - Use this mode for any API that
                    requires multi-step OAuth2.0 based authentication workflow.
                    Nexla supports 2-legged and 3-legged OAuth workflows and has
                    ability to automatically refresh short-lived tokens.


                    * `AWS_SIGNATURE`: __AWS Signature__ - Use this
                    authorization workflow for Amazon Web Services requests.
                    This is a special type of HMAC (Hash Message Authentication
                    Code) authentication specifically for AWS.


                    * `gcp_service_account`: __Google Service Account__ - Use
                    this authorization workflow for Google Service Account
                    authentication.
                basic.username:
                  type: string
                  description: >
                    __Username__: Enter the username field for basic
                    authentication. Nexla will automatically combine this with
                    the password and Base64-encode the pair.


                    __Applicable and required__ if `auth.type` is `BASIC` or
                    `TOKEN`
                basic.password:
                  type: string
                  description: >
                    __Password__: Enter the password field for basic
                    authentication. Nexla will automatically combine this with
                    the username and Base64-encode the pair.


                    __Applicable and required__ if `auth.type` is `BASIC` or
                    `TOKEN`
                api.key.include.mode:
                  type: string
                  enum:
                    - HEADER
                    - URL_PARAMETER
                  description: >
                    __Where to add api key on API requests__: Configure how the
                    api key should be included in subsequent requests.


                    __Applicable and required__ if `auth.type` is `API_KEY`
                api.key.auth.key:
                  type: string
                  description: >
                    __API Key Parameter Name__: If the API Key is sent as
                    __URL_PARAMETER__: Enter the URL query parameter name that
                    is used for sending the API Key as a URL parameter.


                    If the API Key is sent as __Header__: Enter the request
                    header name that should be used for sending the API Key.


                    __Applicable and required__ if `auth.type` is `API_KEY`
                api.key.auth.value:
                  type: string
                  description: >
                    __API Key Parameter Value__: If the API Key is sent as
                    __URL_PARAMETER__: Enter the value that should be sent with
                    the API Key Parameter Name query parameter.


                    If the API Key is sent as __Header__: Enter the Header value
                    that should be sent with the API Key Parameter Name request
                    header.



                    __Applicable and required__ if `auth.type` is `API_KEY`
                token.auth.url:
                  type: string
                  description: >
                    __Fetch Token URL: URL to get token__: Enter the Token URL
                    that should be accessed to fetch a token from the API token
                    server.


                    __Applicable and required__ if `auth.type` is `TOKEN`
                token.auth.method:
                  type: string
                  enum:
                    - GET
                    - POST
                    - PUT
                  description: >
                    __Fetch Token URL: HTTP method__: URL to get token__: Enter
                    the request method for the Token URL. This is usually
                    `POST`.


                    __Applicable and required__ if `auth.type` is `TOKEN`
                token.auth.token.header.name:
                  type: string
                  description: >
                    __Fetch Token URL: Header name for user/pwd__: Enter the
                    name of the request header if the token URL requires
                    authentication information like the username/password to be
                    sent in a header when requesting a token.


                    __Applicable and required__ if `auth.type` is `TOKEN`
                token.auth.body:
                  type: string
                  description: >
                    __Fetch Token URL: Request Body__: Enter the request body in
                    JSON-object format if the token URL requires a payload to be
                    sent when fetching a token.


                    __Applicable and required__ if `auth.type` is `TOKEN`
                token.auth.response.format:
                  type: string
                  enum:
                    - xml
                    - json
                    - plain
                  description: >
                    __Fetch Token URL: Response format__: Select the response
                    format of the Token URL request.


                    This is usually `json`


                    __Applicable and required__ if `auth.type` is `TOKEN`
                token.auth.token.path:
                  type: string
                  description: >
                    __Fetch Token URL Response: Path to Token__: Enter the path
                    of the token property in the response.


                    This should be a valid __JSON Path__ or __XPath__ input
                    depending on the __Fetch Token URL: Response format__



                    __Applicable and required__ if `auth.type` is `TOKEN` and
                    `token.auth.response.format` is `xml` or `json`
                token.auth.token.include.mode:
                  type: string
                  enum:
                    - HEADER
                    - URL_PARAMETER
                  description: >
                    __Where to add token on API requests__: Configure how the
                    generated token should be included in subsequent requests.


                    This is usually `HEADER`


                    __Applicable and required__ if `auth.type` is `TOKEN`
                token.auth.token.url.parameter:
                  type: string
                  description: >
                    __URL Parameter for Token in API Requests__: If the token is
                    sent as a __URL_PARAMETER__, enter the URL parameter name
                    used to send the token as a URL parameter.


                    __Applicable and required__ if `auth.type` is `TOKEN` and 
                    `token.auth.token.include.mode` is `URL_PARAMETER`
                token.auth.request.header.name:
                  type: string
                  description: >
                    __Header Name for Token in API Requests__: If the token is
                    sent as a __Header__, enter the header name used to send the
                    token.


                    __Applicable and required__ if `auth.type` is `TOKEN` and 
                    `token.auth.token.include.mode` is `HEADER`


                    Usually, this is `Authorization`
                token.auth.token.include.cookie:
                  type: boolean
                  description: >
                    __Send cookie in a header?__: If the
                    `token.auth.token.include.mode` is set to `Header`, the
                    platform can be configured to send a cookie together with a
                    token in a request header. Set this option if the vendor
                    requires a cookie for generating a token.              


                    __Applicable__ if `auth.type` is `TOKEN` and 
                    `token.auth.token.include.mode` is `HEADER`.


                    Default: `false`
                token.auth.request.header.prefix:
                  type: string
                  description: >
                    __Header Prefix for Token in API Requests__: If the token is
                    sent as a __Header__, enter the prefix (if applicable) that
                    should be prepended to the header value.


                    __Applicable and required__ if `auth.type` is `TOKEN` and 
                    `token.auth.token.include.mode` is `HEADER`.


                    Usually, this is `Bearer`.
                oauth1.token_exchange_type:
                  type: string
                  enum:
                    - 2-legged
                    - 3-legged
                  description: >
                    __Type of OAuth1 Exchange__: Choose whether the OAuth token
                    exchange should be 2-legged (i.e., server-server) or
                    3-legged (i.e., involving end-user authentication from the
                    UI).


                    __Note__: 3-legged OAuth clients require a Redirect URL when
                    setting up the client. Make sure you have set
                    `<your-nexla-ui-url>/oauth1Auth` as the redirect URL when
                    setting up the client. Replace  `<your-nexla-ui-url>` with
                    the root URL of your Nexla site.


                    __Applicable and required__ if `auth.type` is `OAUTH1`
                oauth1.request.url:
                  type: string
                  description: >
                    __URL for Request Token__: Enter the OAuth 1.0 Request URL
                    used for fetching the request token. This is the first step
                    of the 3-legged OAuth1.0 flow.


                    __Applicable and required__ if `auth.type` is `OAUTH1` and
                    `oauth1.token_exchange_type` is `3-legged`
                oauth1.request_url.req_url_params:
                  type: string
                  description: >
                    __(Optional) Request Token URL Parameters__: Enter any
                    optional parameters that should be attached to the Request
                    URL.


                    This should be in the form `key1=value1&key2=value2`. You
                    __do not__ need to include the `oauth_callback` and
                    `oauth_consumer_key`.


                    __Applicable__ if `auth.type` is `OAUTH1` and
                    `oauth1.token_exchange_type` is `3-legged`
                oauth1.auth.url:
                  type: string
                  description: >
                    __Authorization URL__: Enter the OAuth 1.0 Authorization URL
                    used to initiate user authorization. This is the second step
                    of the 3-legged OAuth1.0 flow.


                    __Applicable and required__ if `auth.type` is `OAUTH1` and
                    `oauth1.token_exchange_type` is `3-legged`
                oauth1.auth_url.auth_url_params:
                  type: string
                  description: >
                    __(Optional) Authorization URL Parameters__: Enter any
                    optional parameters that should be attached to the
                    Authorization URL.


                    This should be in the form `key1=value1&key2=value2`. You
                    __do not__ need to include properties that are autogenerated
                    or received in previous steps.


                    __Applicable__ if `auth.type` is `OAUTH1` and
                    `oauth1.token_exchange_type` is `3-legged`
                oauth1.token.url:
                  type: string
                  description: >
                    __Access Token URL__: Enter the OAuth 1.0 Token URL used to
                    convert the request token into an access token. This is the
                    final step of the 3-legged OAuth1.0 flow.


                    __Applicable and required__ if `auth.type` is `OAUTH1` and
                    `oauth1.token_exchange_type` is `3-legged`
                oauth1.token_url.token_url_params:
                  type: string
                  description: >
                    __(Optional) Access Token URL Parameters__: Enter any
                    optional parameters that should be attached to the Token
                    URL.


                    This should be in the form `0key1=value1&key2=value2`. You
                    __do not__ need to include properties that are autogenerated
                    or received in previous steps.


                    __Applicable__ if `auth.type` is `OAUTH1` and
                    `oauth1.token_exchange_type` is `3-legged`
                oauth1.signature.method:
                  type: string
                  enum:
                    - PLAINTEXT
                    - HMAC-SHA1
                    - HMAC-SHA256
                  description: >
                    __Signature Method__: Some API vendors require requests to
                    be signed with a dynamic signature algorithm. Select the
                    signature method that should be used to sign the requests.


                    Default Value: `PLAINTEXT`


                    __Applicable and required__ if `auth.type` is `OAUTH1`
                oauth1.consumer.key:
                  type: string
                  description: >
                    __Consumer Key__: Enter the consumer key for your OAuth 1.0
                    client.


                    __Applicable and required__ if `auth.type` is `OAUTH1`
                oauth1.consumer.secret:
                  type: string
                  description: >
                    __Consumer Secret__: Enter the consumer secret for your
                    OAuth 1.0 client.


                    __Applicable and required__ if `auth.type` is `OAUTH1`
                oauth1.access.token:
                  type: string
                  description: >
                    __Access Token__: Enter the access token for your OAuth 1.0
                    client.


                    __Applicable and required__ if `auth.type` is `OAUTH1`
                oauth1.access.token.secret:
                  type: string
                  description: >
                    __Access Token Secret__: Enter the access token secret for
                    your OAuth 1.0 client.


                    __Applicable and required__ if `auth.type` is `OAUTH1`
                oauth1.extra.parameters:
                  type: string
                  description: >
                    __OAuth1 Advanced Configuration (JSON)__: Enter any other
                    advanced configuration parameters like Realm, Version, etc.
                    that might be required. This information should be entered
                    as a valid JSON object.


                    Default Value: `{}`


                    __Applicable__ if `auth.type` is `OAUTH1`
                oauth2.token_exchange_type:
                  type: string
                  description: >
                    __Type of OAuth2 Exchange__: Choose whether the OAuth token
                    exchange should be 2-legged (i.e., server-server) or
                    3-legged (i.e., involving end-user authentication from the
                    UI).


                    __Note__: 3-legged OAuth clients require a Redirect URL when
                    setting up the client. Make sure you have set
                    `<your-nexla-ui-url>/oauth2Auth` as the redirect URL when
                    setting up the client. Replace `<your-nexla-ui-url>` with
                    the root URL of this site.


                    __Applicable and required__ if `auth.type` is `OAUTH2`
                oauth2.client.id:
                  type: string
                  description: >
                    __Client ID__: Enter the Client ID for your OAuth 2.0
                    client.


                    __Applicable and required__ if `auth.type` is `OAUTH2`
                oauth2.client.secret:
                  type: string
                  description: >
                    __Client Secret__: Enter the Client Secret for your OAuth
                    2.0 client.


                    __Applicable and required__ if `auth.type` is `OAUTH2`
                oauth2.auth.url:
                  type: string
                  description: >
                    __Authorization URL__: Enter the OAuth 2.0 Authorization URL
                    used to initiate user authorization. This is the first step
                    of the 3-legged OAuth1.0 flow.


                    __Applicable and required__ if `auth.type` is `OAUTH2` and
                    `oauth2.token_exchange_type` is `3-legged`
                oauth2.auth_url.auth_url_params:
                  type: string
                  description: >
                    __(Optional) Authorization Parameters__: Enter any optional
                    parameters that should be attached to the Authorization URL.


                    This should be in the form `key1=value1&key2=value2`. You
                    __do not__ need to include properties like the
                    __client_id__, __grant_type__, or __client_secret__.


                    __Applicable__ if `auth.type` is `OAUTH2` and
                    `oauth2.token_exchange_type` is `3-legged`
                oauth2.access.token.url:
                  type: string
                  description: >
                    __Access Token URL__: Enter the OAuth 2.0 Token URL used for
                    fetching tokens from the API token server.


                    __Applicable and required__ if `auth.type` is `OAUTH2`
                oauth2.token_url.token_url_params:
                  type: string
                  description: >
                    __(Optional) Access Token URL Parameters__: Enter any
                    optional parameters that should be attached to the
                    Authorization URL.


                    This should be in the form `key1=value1&key2=value2`. You
                    __do not__ need to include properties like the
                    __client_id__, __grant_type__, or __client_secret__.


                    __Applicable__ if `auth.type` is `OAUTH2` and
                    `oauth2.token_exchange_type` is `3-legged`
                oauth2.token.type.override:
                  type: string
                  description: >
                    __Token Type__: Enter the token type that should be used
                    when attaching the OAuth2.0 token to the request.


                    This is usually set to `Bearer` to indicate a Bearer token,
                    although some API vendors might use a different name or
                    case.


                    __Applicable and required__ if `auth.type` is `OAUTH2`
                oauth2.access.token.method:
                  type: string
                  enum:
                    - GET
                    - POST
                  description: >
                    __Access Token URL method__: Enter the request method used
                    for the OAuth 2.0 Token URL. This is usually `POST`.


                    __Applicable and required__ if `auth.type` is `OAUTH2`
                oauth2.client.auth.scheme:
                  type: string
                  enum:
                    - header
                    - form
                    - query
                  description: >
                    __Authentication Payload Mode__: Select how the OAuth2
                    Client ID and Client Secret should be sent with the Token
                    URL.


                    * `header`: __Encoded Header__ - The OAuth client ID and
                    secret information is attached to the Authentication header
                    as a Base-64 encoded pair.


                    * `form`: __Form Data__ - The OAuth client ID and secret
                    information are attached in the form of data payload
                    parameters.


                    *  `query`: __Query Parameters__ - The OAuth client ID and
                    secret information are attached to the Token query as query
                    parameters.


                    __Applicable and required__ if `auth.type` is `OAUTH2`.
                    Usually, this is `header`.
                oauth2.auth.body:
                  type: string
                  description: >
                    __OAuth2: Token Request Body__: Nexla automatically includes
                    standard OAuth2 token URL payload properties like
                    __grant_type__, __client_id__ and __client_secret__.
                    However, sometimes, OAuth servers require additional custom
                    payload properties to be sent with the token URL request.


                    Enter these __additional__ properties in the form of a JSON
                    dictionary.

                     __Applicable__ if `auth.type` is `OAUTH2`and `oauth2.token_exchange_type` is `2-legged`
                oauth2.auth.headers:
                  type: string
                  description: >
                    __OAuth2: Token Request Headers__: Sometimes OAuth servers
                    require additional custom headers to be sent with the token
                    URL request.


                    Add any additional request headers that must be sent as part
                    of token obtaining request. Please input as comma-separated
                    values e.g header1:value1,header2:value2.

                     __Applicable__ if `auth.type` is `OAUTH2`and `oauth2.token_exchange_type` is `2-legged`
                oauth2.access.token:
                  type: string
                  description: >
                    __Access Token__: Set this to the access token received when
                    you made the first token request as part of the 3-legged
                    OAuth 2.0 token fetching sequence.


                    __Applicable and required__ if `auth.type` is `OAUTH2`
                vendor.has_token_expiration_ts:
                  type: boolean
                  description: >
                    __Requires Auto-Refresh of Token__: Enable this option if
                    the access tokens are short-lived and the platform should
                    automatically continuously refresh the token to retain a
                    valid access token.

                     __Applicable __ if `auth.type` is `OAUTH2` 

                     Default value: `false`
                vendor.name:
                  type: string
                  description: >
                    __Nexla OAuth 2.0 connector codename__: Codename for the
                    Nexla token refresh mechanism, which is used to identify
                    this connector. Give any string value if this is a custom
                    OAuth2.0 connector.


                    __Applicable and required__ if `auth.type` is `OAUTH2` and
                    `vendor.has_token_expiration_ts` is `true`
                vendor.token_expires_in:
                  type: integer
                  description: >
                    __Access token expiration time__: Set this to the expiration
                    time (in seconds) of the access token received when you made
                    the first token request as part of the 3-legged OAuth 2.0
                    token fetching sequence. This is usually `3599` for a GCS
                    3-legged OAuth workflow.


                    __Applicable and required__ if `auth.type` is `OAUTH2` and
                    `vendor.has_token_expiration_ts` is `true` 
                vendor.token_type:
                  type: string
                  description: >
                    __Token Type__: Enter the token type that should be used
                    when attaching the OAuth2.0 token to the request.


                    This is usually set to `Bearer` to indicate a Bearer token,
                    although some API vendors might use a different name or
                    case.

                     __Applicable __ if `auth.type` is `OAUTH2` and `oauth2.token_exchange_type` is `3-legged`
                vendor.scopes:
                  type: string
                  description: >
                    __(Optional) API Scopes__: Enter any additional scopes that
                    should be added to the OAuth token calls. These should be
                    added as space-separated values (`scope1 scope2 scope3`).
                    Nexla will automatically attach them to the request as the
                    `scope` payload property.
                vendor.refresh_url:
                  type: string
                  description: >
                    __Refresh Token URL__: Enter the OAuth 2.0 Token Refresh URL
                    used for fetching a new access token using the current
                    access token and refresh token. This is usually the same as
                    the OAuth2.0 Token URL.


                    __Applicable and required__ if `auth.type` is `OAUTH2` and
                    `vendor.has_token_expiration_ts` is `true`
                vendor.auth_scheme:
                  type: string
                  enum:
                    - header
                    - form
                    - query
                  description: >
                    __Authentication Payload Mode__: Select how the OAuth2
                    Client ID and Client Secret should be sent with the Token
                    URL.


                    * `header`: __Encoded Header__ - The OAuth client ID and
                    secret information are attached to the Authentication header
                    as a Base-64 encoded pair.


                    * `form`: __Form Data__ -  The OAuth client ID and secret
                    information are attached in the form of data payload
                    parameters.


                    *  `query`: __Query Parameters__ - The OAuth client ID and
                    secret information are attached to the Token query as query
                    parameters.


                    __Applicable and required__ if `auth.type` is `OAUTH2` and
                    `vendor.has_token_expiration_ts` is `true` 
                vendor.access_token:
                  type: string
                  description: >
                    __Access Token__: Set this to the access token received when
                    you made the first token request as part of the 3-legged
                    OAuth 2.0 token fetching sequence. Note that this is the
                    same as `access_token` above but is required in the payload
                    to allow Nexla to automatically continuously refresh tokens.


                    __Applicable and required__ if `auth.type` is `OAUTH2` and
                    `vendor.has_token_expiration_ts` is `true`
                vendor.refresh_token:
                  type: string
                  description: >
                    __Refresh Token__: Set this to the refresh token received
                    when you made the first token request as part of the
                    3-legged OAuth 2.0 token fetching sequence.


                    __Applicable and required__ if `auth.type` is `OAUTH2` and
                    `vendor.has_token_expiration_ts` is `true`
                aws.access.key:
                  type: string
                  description: >
                    __AWS Access Key__: The access key id of the Access Key pair
                    that is used for verifying the identity of the requesting
                    user.


                    __Applicable and required__ if `auth.type` is
                    `AWS_SIGNATURE`.
                aws.secret.key:
                  type: string
                  description: >
                    __AWS Secret Key__: The access secret of the Access Key pair
                    that is used for verifying the identity of the requesting
                    user.


                    __Applicable and required__ if `auth.type` is
                    `AWS_SIGNATURE`.
                aws.region:
                  type: string
                  description: >
                    __AWS Region__: The region that is receiving the request.


                    __Applicable and required__ if `auth.type` is
                    `AWS_SIGNATURE`.
                aws.service:
                  type: string
                  description: >
                    __Service Name__: The service that is receiving the request.


                    __Applicable and required__ if `auth.type` is
                    `AWS_SIGNATURE`.          
                aws.session.token:
                  type: string
                  description: >
                    __Session Token__: Optional session token if the request
                    requires temporary security credentials. This is added to
                    the request as `x-amz-access-token` request header.


                    __Applicable__ if `auth.type` is `AWS_SIGNATURE`.
                gcp.service.account.credentials.json:
                  type: string
                  description: >
                    __Google Service Account Credentials JSON__: Enter the
                    content of the Service Content JSON file that was was
                    generated by Google Cloud IAM. This should be a valid JSON
                    object


                    __Applicable and required__ if `auth.type` is
                    `gcp_service_account`.
                gcp.service.account.oauth.scopes:
                  type: string
                  description: >
                    __Google Service Account OAuth Scopes__: Enter the OAuth 2.0
                    Scopes for Google APIs when using GCP Service Account
                    authentication. This should be a comma separated string of
                    one or more scopes.


                    __Applicable__ if `auth.type` is `gcp_service_account`.
                skip.validation:
                  type: boolean
                  description: >
                    __Skip Credential Validation__: Turn this option on to skip
                    validation of credential when the credential is being
                    created. Note that credential validation is still done when
                    the credential is used as part of a source/destination.
                    However, sometimes some APIs don't have a good endpoint that
                    can be used for just testing if the credential information
                    is accurate or not. This optional property helps avoid
                    setting `test.url` properties for such API vendors.


                    __Default__: `false`
                test.url:
                  type: string
                  description: >
                    __Credential Validation: URL__: Enter a URL from this API
                    vendor that should be used to check whether or not the
                    authentication mechanism works.


                    1. This does not need to be the same URL as the final
                    endpoint that you wish to use.


                    2. We recommend using an endpoint that does not incur a
                    noticeable response delay from the API server. For example,
                    fetch only one item if accessing an endpoint that sends an
                    array of items.


                    3. Use any public endpoint if you want to bypass credential
                    validation.


                    __Applicable and required__ if `skip.validation` is `false`
                    or not specified.          
                test.method:
                  type: string
                  enum:
                    - GET
                    - POST
                  description: >
                    __Credential Validation: API Method__: Enter the API method
                    used to execute the __Credential Validation: URL__. Usually,
                    you should set this to GET for record fetching.


                    __Applicable and required__ if `skip.validation` is `false`
                    or not specified.          
                test.body:
                  type: string
                  description: >
                    __Credential Validation: Request Body__: Enter the request
                    body in JSON-object format if the __Credential Validation:
                    URL__ requires a payload.


                    __Applicable and required__ if `skip.validation` is `false`
                    or not specified.          
                test.content.type:
                  type: string
                  enum:
                    - application/atom+xml
                    - application/x-www-form-urlencoded
                    - application/json
                    - application/json;charset=UTF-8
                    - application/octet-stream
                    - application/pdf
                    - application/problem+json
                    - application/problem+json;charset=UTF-8
                    - application/problem+xml
                    - application/rss+xml
                    - application/stream+json
                    - application/xhtml+xml
                    - application/xml
                  description: >
                    Credential Validation: Content type


                    Usually, this is `application/json`.


                    __Applicable and required__ if `skip.validation` is `false`
                    or not specified.          
                request.headers:
                  type: string
                  description: >
                    __Additional Request Headers__: Add any additional request
                    headers that must be sent as part of every request. Please
                    input these headers as comma-separated values. E.g.,
                    `header1:value1,header2:value2`.
                ignore.ssl.cert.validation:
                  type: boolean
                  description: >
                    __Ignore SSL certificate validation?__: Enable this option
                    if you need to allow an insecure SSL server connection by
                    bypassing the SSL certificate validation of the API
                    endpoint.


                    This is only needed if the API vendor's SSL Certificate has
                    expired.


                    Default value: `false`
                jwt.enabled:
                  type: boolean
                  description: >
                    __Enable JWT Authentication?__: Sometimes, API vendors
                    require JWT-based authorization as an added security layer
                    in addition to the normal authentication methods. For
                    example, vendors requiring __OAuth authentication__ might
                    use the additional __JWT assertion__ part of the OAuth
                    specification. 


                    Select this option and configure the associated properties
                    only if the API vendor requires this authentication
                    mechanism.


                    Default value: `false`
                jwt.auth.url:
                  type: string
                  description: >
                    __JWT: Token URL__: Enter the token URL that must be called
                    to initiate JWT authentication.


                    __Required__ if `jwt.enabled` is `true`
                jwt.auth.body:
                  type: string
                  description: >
                    __JWT: Token URL Request Body__: Enter the request body for
                    the JWT token URL. This must be entered as a valid JSON
                    object.


                    You can use the `{token}` macro to dynamically substitute
                    the JWT value.


                    __Applicable__ if `jwt.enabled` is `true`
                jwt.auth.content.type:
                  type: string
                  enum:
                    - application/atom+xml
                    - application/x-www-form-urlencoded
                    - application/json
                    - application/json;charset=UTF-8
                    - application/octet-stream
                    - application/pdf
                    - application/problem+json
                    - application/problem+json;charset=UTF-8
                    - application/problem+xml
                    - application/rss+xml
                    - application/stream+json
                    - application/xhtml+xml
                    - application/xml
                  description: >
                    __JWT: Token URL Content type__: Enter the content type for
                    the JWT Token URL.


                    Usually, this is `application/x-www-form-urlencoded`.


                    __Applicable__ if `jwt.enabled` is `true`
                jwt.auth.response.format:
                  type: string
                  enum:
                    - xml
                    - json
                    - plain
                  description: >
                    __JWT: Token Response Format__: Enter the response format of
                    the JWT Token URL request. 


                    This is usually `json` or `xml`.


                    __Applicable__ if `jwt.enabled` is `true`
                jwt.auth.token.path:
                  type: string
                  description: >
                    __JWT: Path to Token__: Enter the path of the token property
                    in the response.


                    This should be a valid __JSON Path__ or __XPath__ input
                    depending on the __JWT: Token Response Format__.


                    __Applicable__ if `jwt.enabled` is `true`
                jwt.auth.token.type.path:
                  type: string
                  description: >
                    __JWT: Path to Token Type__: Enter the path of the
                    token-type property in the response.


                    This should be a valid __JSON Path__ or __XPath__ input
                    depending on the __JWT: Token Response Format__.


                    __Applicable__ if `jwt.enabled` is `true`
                jwt.token.include.mode:
                  type: string
                  enum:
                    - HEADER
                    - URL_PARAMETER
                  description: >
                    __JWT: Token Include Mode__: Configure how the generated JWT
                    token should be included in subsequent requests.


                    __Applicable__ if `jwt.enabled` is `true`
                jwt.token.url.parameter:
                  type: string
                  description: >
                    __JWT: Token URL parameter__: If the __Token Include Mode__
                    is __URL_PARAMETER__, enter the URL parameter name used to
                    send the JWT token as a URL parameter.


                    __Applicable__ if `jwt.enabled` is `true` and
                    `jwt.token.include.mode` is `URL_PARAMETER`
                jwt.token.header:
                  type: string
                  description: >
                    __JWT: Token Header Name__: If the __Token Include Mode__ is
                    __Header__, enter the request header name used to send the
                    JWT token as a header.


                    __Applicable__ if `jwt.enabled` is `true` and
                    `jwt.token.include.mode` is `HEADER`
                jwt.token.header.type:
                  type: string
                  description: >
                    __JWT: Token Header Type Prefix__: If the __Token Include
                    Mode__ is __Header__, enter the prefix (if applicable) that
                    should be prepended to the header value.
                jwt.claim.expiration.sec:
                  type: integer
                  description: >
                    __JWT: Token Expiration Duration(sec)__: Enter the duration
                    in seconds over which the JWT token is valid.


                    __Applicable__ if `jwt.enabled` is `true`
                jwt.token.secret:
                  type: string
                  description: >
                    __JWT: Token Secret__: Enter the secret key used to sign the
                    JWT request and payload.


                    This is not always required.


                    __Applicable__ if `jwt.enabled` is `true`
                jwt.token.algorithm:
                  type: string
                  enum:
                    - NONE
                    - HS256
                    - HS384
                    - HS512
                    - RS256
                    - RS384
                    - RS512
                    - ES256
                    - ES384
                    - ES512
                    - PS256
                    - PS384
                    - PS512
                  description: >
                    __JWT: Signature Algorithm__: Select the algorithm used to
                    generate the JWT token signature.


                    This is usually `HS256`.


                    __Applicable__ if `jwt.enabled` is `true`
                jwt.claim.scope:
                  type: string
                  description: >
                    __JWT: Scope Claim__: Enter the value of the scope claim
                    used for token generation.


                    __Applicable__ if `jwt.enabled` is `true`
                jwt.claim.audience:
                  type: string
                  description: >
                    __JWT: Audience Claim__: Enter the value of the audience
                    claim used for token generation.


                    __Applicable__ if `jwt.enabled` is `true`
                jwt.claim.issuer:
                  type: string
                  description: >
                    __JWT: Issuer Claim__: Enter the value of the issuer claim
                    used for token generation.


                    __Applicable__ if `jwt.enabled` is `true`
                jwt.claim.extra.json:
                  type: string
                  description: >
                    __JWT: Extra Claims__: In addition to the standard claims of
                    __audience__, __scope__ and __issuer__, you can also
                    configure extra claims that must be verified.


                    Enter any extra claims here. The input should be entered in
                    the form of a valid JSON object.


                    __Applicable__ if `jwt.enabled` is `true`
                hmac.enabled:
                  type: boolean
                  description: >
                    __Enable HMAC Signature Based Authentication?__: Select this
                    mode if the API vendor requires requests to be signed with a
                    Signature generated using a custom HMAC algorithm.


                    Provide details about the signature-generation algorithm in
                    the associated input fields.


                    Default value: `false`
                hmac.api.key:
                  type: string
                  description: >
                    __HMAC: API Key__: Enter the API key that will be used to
                    sign requests. This is provided by the API vendor.


                    __Applicable__ if `hmac.enabled` is `true`
                hmac.api.secret:
                  type: string
                  description: >
                    __HMAC: API Secret__: API vendors often require an API
                    secret to also be used for HMAC signature authentication.
                    Check the vendor's API documentation for more information.


                    __Applicable__ if `hmac.enabled` is `true`
                hmac.func:
                  type: string
                  description: >
                    __HMAC: Signature Generator Function__: Enter the signature
                    generator function that will generate the appropriate
                    signature for each request.


                    We currently support the __Base64-Encoded Scala function__
                    for generating HMAC signatures.


                    Please contact your Nexla Account Manager for assistance
                    with this input.


                    __Applicable__ if `hmac.enabled` is `true`
                ui.cert_signed:
                  type: boolean
                  description: >
                    __Sign Requests with Certificates?__: Select this mode if
                    the API vendor requires requests to be signed with a shared
                    certificate.


                    Provide details about the certificate in the associated
                    input fields.


                    Default value: `false`
                client.p12:
                  type: string
                  description: >
                    __Client Certificate in P12 format__: Enter the content of
                    the P12-formatted certificate file that will be used to sign
                    the API requests.


                    The P12 file typically consists of the private key and
                    certificate chain. You can open the file in any text editor
                    and copy its content here.



                    __Applicable and required__ if `ui.cert_signed` is `true`
                client.p12.password:
                  type: string
                  description: >
                    __P12 PassPhrase__: Enter the passphrase associated with the
                    certificate file.


                    __Applicable__ if `ui.cert_signed` is `true`
    s3_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - s3_auth_type
              properties:
                s3_auth_type:
                  type: string
                  enum:
                    - Access Key
                    - ARN
                    - Instance Role
                  description: >-
                    __Authentication Mechanism__ Credentials can be configured
                    to allow S3 access through different AWS permissions
                    mechanisms. Select the type of Authentication method you
                    wish to use.

                    * `Access Key` - Select this option if you wish to use AWS
                    Access and Secret keys for your S3.

                    * `ARN` - Select this option if you wish to use IAM ARN for
                    authentication.

                    * `Instance Role` - Select this option if you wish to access
                    S3 using an IAM Instance Role. 
                access_key:
                  type: string
                  description: |
                    __AWS Access Key__

                    __Required__ if `s3_auth_type` is `Access Key`
                secret_key:
                  type: string
                  description: |
                    __AWS Secret Key__

                    __Required__ if `s3_auth_type` is `Access Key`
                external_id:
                  type: string
                  description: >
                    __External Id__: The external ID if S3 has been configured
                    for federated access.


                    __Required__ if `s3_auth_type` is
                    `ARN`                                            
                region:
                  type: string
                  description: |
                    Region for AWS S3 Account.

                    Default value: `us-east-1`
                arn:
                  type: string
                  description: >
                    __IAM ARN__: The IAM Amazon Resource Name (ARN) for which
                    these permissions are applicable. This should be entered in
                    the format `arn:partition:service:region:account:resource`.
                test.path:
                  type: string
                  description: >
                    __S3 Path list access is limited to__: Set this property to
                    `<bucket-name>` or `<bucket-name>/<folder-name>` if your AWS
                    admin has restricted access to only a specific bucket or a
                    path inside a bucket.
                has_client_encryption:
                  type: boolean
                  description: >
                    __Enable Client Side Encryption?__: The platform can be
                    configured to encrypt/decrypt S3 objects that require
                    client-side encryption using the AWS Key Management System
                    (KMS). Set this option if KMS encryption is applicable.


                    Default value: `false`
                encryption_mode:
                  type: string
                  enum:
                    - EncryptionOnly
                    - AuthenticatedEncryption
                    - StrictAuthenticatedEncryption
                  description: >
                    __Client Side Encryption Mode__: Select the type of KMS
                    encryption mode that is applicable for this credential.


                    __Required__ if `has_client_encryption` is `true`
                kms_key:
                  type: string
                  description: >
                    __Amazon KMS Key for Encryption__: The KMS Key used for
                    encrypting/decrypting objects. Please ensure that this user
                    has appropriate KMS permissions.


                    __Required__ if `has_client_encryption` is `true`
                sse.enabled:
                  type: boolean
                  description: >
                    __Enable Server Side Encryption?__: The platform can be
                    configured to encrypt/decrypt S3 objects that require
                    server-side encryption.


                    This can be done using either __Amazon S3-managed encryption
                    keys (SSE-S3)__ or the __AWS Key Management Service
                    (SSE-KMS)__. Set this option if server-side encryption is
                    applicable.


                    Default value: `false`      
                sse.kms_key.arn:
                  type: string
                  description: >
                    __Key ARN for SSE with KMS__: The Key ARN if you want
                    server-side encryption to be performed via the AWS Key
                    Management System. You can leave this field blank if you
                    want to use Amazon S3-managed encryption keys.


                    __Required__ if `sse.enabled` is `true`
        - $ref: '#/components/schemas/file_data_credential'
    s3_iceberg_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - s3_auth_type
              properties:
                s3_auth_type:
                  type: string
                  enum:
                    - Access Key
                    - ARN
                    - Instance Role
                  description: >
                    __Authentication Mechanism__

                    Credentials can be configured to allow S3 access through
                    different AWS permissions mechanisms. Select the type of
                    Authentication method you wish to use.


                    * `Access Key` - Select this option if you wish to use AWS
                    Access and Secret keys for your S3.

                    * `ARN` - Select this option if you wish to use IAM ARN for
                    authentication.

                    * `Instance Role` - Select this option if you wish to access
                    S3 using an IAM Instance Role.
                access_key_id:
                  type: string
                  description: |
                    __AWS Access Key__
                    __Required__ if `s3_auth_type` is `Access Key`
                secret_key:
                  type: string
                  description: |
                    __AWS Secret Key__
                    __Required__ if `s3_auth_type` is `Access Key`
                arn:
                  type: string
                  description: >
                    __IAM ARN__: The IAM Amazon Resource Name (ARN) for which
                    these permissions are applicable. This should be entered in
                    the format `arn:partition:service:region:account:resource`.
                external_id:
                  type: string
                  description: >
                    __External Id__: The external ID if S3 has been configured
                    for federated access.

                    __Required__ if `s3_auth_type` is `ARN`
                region:
                  type: string
                  description: |
                    Region for AWS S3 Account.
                    Default value: `us-east-1`
                test.path:
                  type: string
                  description: >
                    __S3 Path list access is limited to__: Set this property to
                    `<bucket-name>` or `<bucket-name>/<folder-name>` if your AWS
                    admin has restricted access to only a specific bucket or a
                    path inside a bucket.
    sharepoint_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - oauth2.token_exchange_type
                - tenant_id
              properties:
                oauth2.token_exchange_type:
                  type: string
                  enum:
                    - 3-legged
                    - 2-legged
                  description: >
                    __Authentication Type__: Select the type of OAuth2
                    authentication mechanism you wish to use.


                    * `3-legged`: Use 3-legged OAuth for authentication.

                    * `2-legged`: Use 2-legged OAuth for authentication.
                tenant_id:
                  type: string
                  description: |
                    __Tenant ID__: The Tenant ID for your SharePoint account.
                access_token:
                  type: string
                  description: >
                    __Access Token__: Click the button above to fetch a new
                    token.


                    __Required__ if `oauth2.token_exchange_type` is `3-legged`
                vendor.name:
                  type: string
                  enum:
                    - sharepoint
                  description: |
                    __API Vendor__: The API vendor for SharePoint.

                    __Required__ if `oauth2.token_exchange_type` is `3-legged`
                vendor.token_type:
                  type: string
                  description: |
                    __Vendor Token Type__: The token type for the vendor.

                    __Required__ if `oauth2.token_exchange_type` is `3-legged`
                vendor.access_token:
                  type: string
                  description: |
                    __Vendor Access Token__: The access token for the vendor.

                    __Required__ if `oauth2.token_exchange_type` is `3-legged`
                vendor.refresh_token:
                  type: string
                  description: |
                    __Vendor Refresh Token__: The refresh token for the vendor.

                    __Required__ if `oauth2.token_exchange_type` is `3-legged`
                vendor.last_refreshed_at:
                  type: string
                  description: >
                    __Vendor Refresh Time UTC__: The last refresh time for the
                    vendor token.


                    __Required__ if `oauth2.token_exchange_type` is `3-legged`
                vendor.has_token_expiration_ts:
                  type: boolean
                  description: >
                    __Vendor info contains expiration__: Indicates whether the
                    vendor token contains expiration information.


                    __Required__ if `oauth2.token_exchange_type` is `3-legged`
                vendor.token_expires_in:
                  type: integer
                  description: >
                    __Vendor Token Expiration Time__: The expiration time for
                    the vendor token.


                    __Required__ if `oauth2.token_exchange_type` is `3-legged`
                vendor.other_info:
                  type: string
                  description: >
                    __Other Vendor Info__: Additional information for the
                    vendor.


                    __Required__ if `oauth2.token_exchange_type` is `3-legged`
                oauth2.client.id:
                  type: string
                  description: |
                    __Client ID__: The Client ID of your OAuth 2.0 client.

                    __Required__ if `oauth2.token_exchange_type` is `2-legged`
                oauth2.client.secret:
                  type: string
                  description: >
                    __Client Secret__: The Client Secret of your OAuth 2.0
                    client.


                    __Required__ if `oauth2.token_exchange_type` is `2-legged`
                auth.type:
                  type: string
                  enum:
                    - OAUTH2
                  description: |
                    __Authentication Type__: The type of authentication used.

                    Default Value: `OAUTH2`
                oauth2.access.token.method:
                  type: string
                  enum:
                    - POST
                  description: >
                    __Access Token URL method__: The request method used for the
                    OAuth 2.0 Token URL.


                    Default Value: `POST`
                oauth2.client.auth.scheme:
                  type: string
                  enum:
                    - form
                  description: >
                    __Client Authentication Scheme__: The authentication scheme
                    used for the OAuth 2.0 client.


                    Default Value: `form`
                oauth2.token.type.override:
                  type: string
                  enum:
                    - Bearer
                  description: >
                    __Token Type__: The token type that should be used when
                    attaching the OAuth2.0 token to the request.


                    Default Value: `Bearer`
                skip.validation:
                  type: boolean
                  description: |
                    __Skip Validation__: Indicates whether to skip validation.

                    Default Value: `false`
                test.content.type:
                  type: string
                  description: |
                    __Test Content Type__: The content type used for testing.

                    Default Value: `application/json`
                test.method:
                  type: string
                  description: |
                    __Test Method__: The request method used for testing.

                    Default Value: `GET`
                test.url:
                  type: string
                  description: |
                    __Test URL__: The URL used for testing.

                    Recommended Value: `https://graph.microsoft.com/v1.0/sites`
                vendor.scopes:
                  type: string
                  description: >
                    __API Scopes__: The scopes that should be added to the OAuth
                    token calls.


                    Recommended Value: `https://graph.microsoft.com/.default`
        - $ref: '#/components/schemas/file_data_credential'
    snowflake_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - host
                - port
                - snowflake.auth.type
                - username
                - database_name
                - warehouse_name
                - schema_name
                - database.field.QUERY_TAG
              properties:
                host:
                  type: string
                  description: >
                    __Host__: Enter the hostname for your database. This is
                    usually in the format
                    `<account_name>.snowflakecomputing.com`. Do not include the
                    connection protocol.
                port:
                  type: integer
                  description: |
                    __Port__: Enter the port used to access your database.
                snowflake.auth.type:
                  type: string
                  enum:
                    - basic
                    - key_pair
                  description: >
                    __Snowflake Authentication Type__: Credentials can be
                    configured to allow Snowflake access through different
                    Snowflake permissions mechanisms. Select the type of
                    authentication method you wish to use.


                    * `basic`: __Basic Authentication__: Select this option if
                    you wish to use the Username and Password for Snowflake
                    access.


                    * `key_pair`: __Key Pair Authentication__: Select this
                    option if you wish to use the Key Pair authentication
                    mechanism to connect to your Snowflake account.
                username:
                  type: string
                  description: >
                    __Username__: Enter the username used to access your
                    database.
                password:
                  type: string
                  description: >
                    __Password__: Enter the password used to access your
                    database.


                    __Applicable and required__ if `snowflake.auth.type` is
                    `basic`
                snowflake.privateKey:
                  type: string
                  description: >
                    __Private Key__: Enter the file content of the private key
                    file as a `base64` encoded string. To retrieve the file
                    content, open the PEM file in any text editor, and copy over
                    its content as the payload. Then `base64`-encode that
                    content before adding it to the payload.


                    __Applicable and required__ if `snowflake.auth.type` is
                    `key_pair`
                snowflake.privateKey.passphrase:
                  type: string
                  description: >
                    __Passphrase for Private Key__: If the private key file was
                    generated with a passphrase, please enter the passphrase
                    here.


                    __Applicable__ if `snowflake.auth.type` is `key_pair` 
                warehouse_name:
                  type: string
                  description: >
                    __Warehouse__: The Snowflake warehouse to which you wish to
                    connect.
                database_name:
                  type: string
                  description: >
                    __Database Name__: Enter the database name if you want to
                    connect to a specific database.
                schema_name:
                  type: string
                  description: >
                    __Schema Name__: Enter the schema name for the database to
                    which you wish to connect.
                database.field.role:
                  type: string
                  description: >
