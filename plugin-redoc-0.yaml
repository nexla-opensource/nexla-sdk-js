    vector_db_data_sink:
      type: object
      properties:
        create_destination:
          type: boolean
          description: >
            __Create Table In Destination__ If the desired table doesn't exist
            in your database, you can instruct Nexla to create a table when this
            destination is first activated. 


            Default Value: `false` 
        sink_config:
          type: object
          required:
            - sink_type
            - table
            - insert.mode
            - mapping
          properties:
            database:
              type: string
              description: >
                __Database__: If the Destination credentials allow access to
                multiple databases, specify the database to which the
                destination table belongs. This is only needed if the
                `data_credentials` entry for this destination is not limited to
                one database.
            table:
              type: string
              description: >
                __Table__: Set the table to which you wish to push Nexset
                records.
            insert.mode:
              type: string
              enum:
                - INSERT
                - UPSERT
              description: >
                __Table Update Mode__: Select whether records should be inserted
                or upserted into the database.
            primary.key:
              type: string
              description: >
                __Primary Key Columns__: Set all columns that should be set as
                primary keys of the table. For multiple columns, enter a
                comma-separated list of column names.


                __Required__ if `insert.mode` is set to `UPSERT`
            mapping:
              type: object
              required:
                - mode
                - tracker_mode
              description: >
                __Mapping__: Set rules for how Nexset record attributes should
                be written into Database Columns.
              properties:
                mode:
                  type: string
                  enum:
                    - manual
                  description: >
                    Most databases require manual mapping of attributes into
                    columns. With manual mapping, you can set a single attribute
                    to be written into multiple columns. Additionally, you can
                    specify the desired data format for each column.



                    * `auto`: Automatically map attributes to database columns.
                    Column data types will be inferred from record values, and
                    the nesting of attributes will be preserved. __Only
                    available for select warehouses and databases.__


                    * `manual`: Explicitly define attribute mapping and database
                    columns.
                mapping:
                  type: object
                  description: >
                    __Attribute to Database Column Mapping__: Define how
                    attributes should be mapped to database columns.


                    __Required__ if `mapping.mode` is `manual`


                    __Object Definition Rules__: 


                    1. Each Nexset record attribute that needs to be written to
                    one or more columns should be listed as a property of this
                    `mapping` object. In the example, the properties are
                    `nexset_attr_1` and `nexset_attr_2`.


                    2. Each database column to which the attribute needs to be
                    written is a property of the attribute object above. In the
                    example, `nexset_attr_1` is set to write to columns
                    `db_col_1` and `db_col_2`.


                    3. Each database column property has a value that defines
                    the desired data format allowed by the database. Here, data
                    written to `db_col_1` will be written as `TEXT`.


                    __Example__
                      ```
                      {
                          "nexset_attr_1":
                          {
                              "db_col_1": "TEXT",
                              "db_col_2": "TEXT"
                          },
                          "nexset_attr_2":

                          {
                              "db_col_3": "FLOAT64"
                          }
                      }
                    ```
                  additionalProperties:
                    type: object
                    x-additionalPropertiesName: nexset_attribute_name
                    description: >-
                      __Property Name__:  Attribute name of each nexset
                      attribute that needs to be written to one or more columns.
                      Use dot notation for attributes that are present as nested
                      properties inside a Nexset Record.
                    additionalProperties:
                      type: string
                      x-additionalPropertiesName: db_column_name
                      description: >-
                        __Property Name__: Database column name"(s)" of the
                        column"(s)" to which this attribute needs to be written.


                        __Property Value__: Data format of the data in the
                        column"(s)".


                        1. Each database column to which attribute needs to be
                        written is a property of this object.


                        2. Each property has a value that defines the desired
                        data format allowed by the database.
                tracker_mode:
                  type: string
                  enum:
                    - NONE
                    - RECORD
                  description: >
                    __Tracker Mode__: Each record that flows through Nexla has
                    an associated unique tracker ID. Set this to `RECORD` to
                    configure the tracker ID to be written out to a database
                    column along with the Nexset record.


                    * `NONE`: The tracker ID won't be written to the database.

                    * `RECORD`: The short form tracker ID containing all
                    required lineage information will be written out in the
                    relevant column.
                tracker_name:
                  type: string
                  description: >
                    __Column Name for Nexla Tracker__: Name of the column used
                    for the Nexla record tracker information.


                    __Applicable and Required__ if `tracker.mode` is set to
                    `RECORD`
                             
            upsert.nulls:
              type: boolean
              description: >
                __Allow column updates with nulls__: Set as false to allow
                partial upsert of a record with only non-null values.


                Only valid if `insert.mode` is `UPSERT`


                Default Value: `true`
