    databricks_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - databricks_auth_type
                - ui.url_format
                - databricks.cloud.type
              properties:
                databricks_auth_type:
                  type: string
                  enum:
                    - token
                    - oidc
                  description: >
                    __Authentication Type__: Select the authentication type for
                    your databricks instance.


                    * `token` - Token Based Authentication: Use this
                    authentication method if you are using a personal access
                    token to authenticate with Databricks. See
                    https://docs.databricks.com/aws/en/dev-tools/auth/pat#pat-user
                    for more information.
                      
                    * `oidc` -  OAuth Authentication: Use this authentication
                    method if you are using OAuth2.0 to authenticate with
                    Databricks. This method is recommended for production
                    environments.
                ui.url_format:
                  type: string
                  enum:
                    - jdbc_url
                    - http_path_parts
                  description: >
                    __URL Format__: You can set the Databricks authentication
                    information as a JDBC URL or as parts that will be combined
                    by Nexla to create the connection string.


                    * `jdbc_url` - JDBC URL: Set the JDBC URL to your databricks
                    location. This should be in the form `jdbc:spark:/...` or
                    `jdbc:databricks:/...`.


                    * `http_path_parts` - HTTP Path Parts: Set the HTTP Path for
                    the SQL Endpoint. This is usually in the form
                    `sql/protocolv1/o/<id>/0916-102516-naves603` and available
                    in __JDBC settings__ in your databricks console.
                url:
                  type: string
                  description: >
                    __JDBC URL__: Enter the JDBC URL to your databricks
                    location. This should be in the form `jdbc:databricks:/...`
                    or `jdbc:spark:/...`.


                    **Note**: For **OAuth Authentication** please ensure that
                    the URL does not include the `AuthMech` and `Auth_Flow`
                    parameters. The Databricks Console for copying connection
                    strings often includes these parameters, so you may need to
                    remove them before using the connection string in Nexla.


                    __Required__ if `ui.url_format` is `jdbc_url`.
                host:
                  type: string
                  description: >
                    __Host__: Enter the hostname for your database. This is in
                    the format `company.domain.com`. Do not include the
                    connection protocol.

                    __Required__ if `ui.url_format` is `http_path_parts`.
                port:
                  type: integer
                  description: |
                    __Port__: Enter the port used to access your database.
                    __Required__ if `ui.url_format` is `http_path_parts`.
                http_path:
                  type: string
                  description: >
                    __HTTP Path__: Enter the HTTP Path of the SQL Endpoint.

                    This is usually in the form
                    `sql/protocolv1/o/<id>/0916-102516-naves603` and is
                    available in __JDBC settings__ in your Databricks console.

                    __Required__ if `ui.url_format` is `http_path_parts`.
                username:
                  type: string
                  description: >
                    __Username__: Enter the username used to access your
                    database.

                    __Required__ if `ui.url_format` is `http_path_parts`.
                password:
                  type: string
                  description: >
                    __Password__: Enter the password used to access your
                    database.

                    __Required__ if `databricks_auth_type` is `token` and
                    `ui.url_format` is `http_path_parts`.
                databricks.field.AuthMech:
                  type: string
                  enum:
                    - 11
                  description: >
                    __OAuth2 Authentication Mechanism__: Set the authentication
                    mechanism for your databricks instance.

                    __Required__ if `databricks_auth_type` is `oidc`.

                    __Applicable__ only if `databricks_auth_type` is `oidc`.
                databricks.field.Auth_Flow:
                  type: string
                  enum:
                    - 1
                  description: >
                    __OAuth2 Authentication Flow__: Set the authentication flow
                    for your databricks instance.

                    __Required__ if `databricks_auth_type` is `oidc`.

                    __Applicable__ only if `databricks_auth_type` is `oidc`.
                databricks.field.OAuth2ClientId:
                  type: string
                  description: >
                    __Service Principal UUID/Application ID__: Enter the Service
                    Principal UUID/Application ID for the Databricks warehouse
                    you wish to connect to.

                    __Required__ if `databricks_auth_type` is `oidc`.

                    __Applicable__ only if `databricks_auth_type` is `oidc`.
                databricks.field.OAuth2Secret:
                  type: string
                  description: >
                    __Service Principal Secret__: Enter the Service Principal
                    Secret for the Databricks you wish to connect to.

                    __Required__ if `databricks_auth_type` is `oidc`.

                    __Applicable__ only if `databricks_auth_type` is `oidc`.
                database_name:
                  type: string
                  description: >
                    __Database Name__: Enter the database name if you want to
                    connect to a specific database.

                    Usually, this is set to: `spark`.
                schema_name:
                  type: string
                  description: >
                    __Schema Name__: Enter the schema name for the database to
                    which you wish to connect.

                    Usually, this is set to `default`.
                databricks.cloud.type:
                  type: string
                  enum:
                    - AWS
                    - Azure
                    - databricks
                    - GCP
                  description: >
                    __Databricks Cloud Type__: Select the cloud environment type
                    of your Databricks instance.

                    Usually, this is the Databricks cloud environment, but we
                    also support connecting to Databricks instances running in
                    other cloud environments.
                databricks.cloud.credentials.id:
                  type: integer
                  description: >
                    __Nexla Credential ID for temporary data staging__: Before
                    loading data to Databricks we need to stage the data
                    temporarily. In the default configuration, the staging data
                    is stored in a Nexla private location, but you can configure
                    the platform to stage data in your custom Cloud storage
                    location.

                    Enter the __Nexla Credential ID__ of your S3 or Azure Blob
                    storage account where you want Nexla to write temporary and
                    final data. Leave this blank if you want Nexla to handle
                    temporary data storage.

                    __Applicable__ if `databricks.cloud.type` is `AWS` or
                    `Azure`.

                    Ignore this property if you do not want to use your custom
                    data-staging area.
                databricks.temp.s3.bucket:
                  type: string
                  description: >
                    __S3 Path for Temporary Data Staging__: If you are choosing
                    to store temporary data in your own AWS S3 location, please
                    configure the S3 path where the temporary data should be
                    staged. Note that this path must be accessible to the Nexla
                    Credential ID entered in the previous field.

                    __Applicable and required__ only if `databricks.cloud.type`
                    is `AWS` and you are setting a valid credential ID for
                    `databricks.cloud.credentials.id`.
                databricks.destination.s3.bucket:
                  type: string
                  description: >
                    __S3 Path for Delta Tables__: If you are choosing to store
                    temporary data in your own AWS S3 location, please configure
                    the S3 path where the delta tables should be staged. Note
                    that this path must be to Nexla Credential ID provided
                    earlier.

                    Leave this blank for creating Delta tables in DBFS.

                    __Applicable and required__ only if `databricks.cloud.type`
                    is `AWS` and you are setting a valid credential ID for
                    `databricks.cloud.credentials.id`.
                databricks.temp.azure.bucket:
                  type: string
                  description: >
                    __Azure Path for Temporary Data Staging__: If you are
                    choosing to store temporary data in your own Azure Blob
                    location, please configure the path where the temporary data
                    should be created. Note that this path must be accessible to
                    the Nexla Credential ID entered in the previous field.

                    __Applicable and required__ only if `databricks.cloud.type`
                    is `Azure` and you are setting a valid credential ID for
                    `databricks.cloud.credentials.id`.
                databricks.destination.azure.bucket:
                  type: string
                  description: >
                    __Azure Path for Delta Tables__: If you are choosing to
                    store temporary data in your own Azure Blob location, please
                    configure the path where the delta tables should be created.
                    Note that this path must be accessible to the Nexla
                    Credential ID provided earlier.

                    Leave this blank for creating Delta tables in DBFS.

                    __Applicable and required__ only if `databricks.cloud.type`
                    is `Azure` and you are setting a valid credential ID for
                    `databricks.cloud.credentials.id`.
        - $ref: '#/components/schemas/database_data_credential'
    db2_data_credential:
