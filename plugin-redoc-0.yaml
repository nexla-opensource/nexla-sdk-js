                    __Anonymous Access?__: Select this option if the connection
                    should be made as an anonymous user.


                    Only applicable if `ftp.type` is `ftp` or `ftps`


                    Default value: `false`    
                username:
                  type: string
                  description: >
                    __Username__: Enter the username used to access your FTP
                    server.


                    Only applicable if `ftp.type` is `ftp` or `ftps` or
                    `anonymous` is `false`.
                password:
                  type: string
                  description: >
                    __Password__: Enter the password used to access your FTP
                    server.


                    Only applicable if `ftp.type` is `ftp` or `ftps` or
                    `anonymous` is `false` and you are not using `private.key`
                    for authentication
                private.key:
                  type: string
                  description: >
                    __Private Key__: You can use a private key for
                    authentication instead of a password.


                    Only applicable if you are not using `password` for
                    authentication
                passphrase:
                  type: string
                  description: >
                    __Passphrase for Private Key__: Enter the passphrase for the
                    private key file if it was generated with one.


                    Only applicable if `ftp.type` is `sftp` and the
                    `private.key` has a passphrase
                ftp.mode:
                  type: string
                  enum:
                    - active
                    - passive.local
                    - passive.remote
                  description: >
                    __FTP mode__: Select whether the connection should be
                    established in active or passive FTP connection mode.
