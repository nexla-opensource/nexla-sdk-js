        process is completed (email is verified, manual approval by admin may be
        required),

        user can set a password and login to the system.

        Email verification link is sent to the email provided by the user.


        Optionally, it allows for logged in user to be called. In this case,
        email verification will be skipped, and new org is created immediately.
      tags:
        - Self Sign-Up
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
