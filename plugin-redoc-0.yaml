                    access to objects in the system. Roles are granted access
                    privileges for objects in the system.


                    Usually, you can leave this field blank. However, if your
                    Snowflake configuration requires a special, non-default role
                    to be applied to access the objects in which you are
                    interested, you can set the Role here.
                database.field.QUERY_TAG:
                  type: string
                  description: >
                    __Query Tag__: Snowflake query tags allow users to associate
