  /token:
    post:
      operationId: login_with_basic_auth
      summary: Login with Basic Authentication
      description: >
        Use this endpoint for authentication if your organization allows basic
        authentication. A successful authentication attempt will result in an
        `access_token` that can be used to make authenticated requests to other
        API endpoints. The `access_token` automatically expires after a fixed
        duration, but you can also call the `/logout` endpoint to invalidate the
        access token at the end of your session.


        Nexla supports various methods of authentication, including Basic
        (email/password), Google SSO, and custom SAML- or OIDC-based SSO. One or
        more of these methods might be allowed in any organization, depending on
        the configuration chosen by the administrators. Instead of using this
        endpoint to start a session programmatically, we recommend performing
        authentication through the Nexla UI and using the Nexla Session Token
        (available in Tools >> Nexla Session Token) to connect to the API
        programmatically.


        > Note: A user might belong to multiple organizations. This method
        initiates an authenticated session in their default organization.
      security:
        - basicAuth: []
      tags:
        - Session Management
      responses:
        '200':
          $ref: '#/components/responses/token'
        '401':
          description: Unauthorized
  /token/logout:
    post:
      operationId: logout
      summary: Logout
      description: >
        Ends the current session and invalidates the `NexlaSessionToken` for
        future requests.
      tags:
        - Session Management
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
