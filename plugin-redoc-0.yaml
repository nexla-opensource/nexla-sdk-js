                The ID of the data source which is the root node of this flow
                chain.


                Unless the flow chain has been created from a shared Nexset,
                flow definitions start from the source as the root node. This
                property reflects the source that is the root node of this
                flow.          
        - type: object
          properties:
            data_set_id:
              type: integer
              description: >
                The ID of the Nexset which is the root node of this flow chain.


                This property is not null only if the flow was created from a
                shared Nexset. In that case, this value reflects the ID of the
                derived dataset created from the shared Nexset.           
