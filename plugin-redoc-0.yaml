              metrics:
                type: object
                properties:
                  data:
                    description: >
                      Flow metrics data aggregated by resource id for the time
                      period specified. If the request includes `groupby=runId`
                      then the metrics are further grouped by `runId` to
                      separate number of records processed per run id per
                      resource.
                    oneOf:
                      - type: object
                        additionalProperties:
                          x-additionalPropertiesName: run_id
                          description: |
                            Response format if request includes `groupby=runId`.
                          type: object
                          properties:
                            data_sources:
                              type: array
