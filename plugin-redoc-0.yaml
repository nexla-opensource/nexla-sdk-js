        UI.
      tags:
        - Notifications
      parameters:
        - name: read
          in: path
          description: >
            Set the read query parameter to 0 to fetch only notifications that
            have not yet been read, or set it to 1 to fetch only those that have
            been read.
          schema:
            type: integer
        - name: level
          in: query
          description: >
            Filter by level of notifications. Values are: 'DEBUG', 'INFO',
            'WARN', 'ERROR', 'RECOVERED', 'RESOLVED'."
          schema:
            type: string
            enum:
              - DEBUG
              - INFO
              - WARN
              - ERROR
              - RECOVERED
        - name: from
          in: query
          description: >
            Filter notifications starting from timestamp. Format is unix
            timestamp.
          schema:
            type: integer
        - name: to
          in: query
          description: |
            Filter notifications ending at timestamp. Format is unix timestamp.
          schema:
            type: integer
