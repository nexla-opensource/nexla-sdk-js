    s3_iceberg_data_sink:
      allOf:
        - $ref: '#/components/schemas/data_sink'
        - type: object
          properties:
            sink_config:
              type: object
              required:
                - iceberg.warehouse.dir
                - iceberg.table.name
              properties:
                iceberg.warehouse.dir:
                  type: string
                  description: >
                    __Warehouse Directory__: Path to the directory where you
                    want the Iceberg table to be created/updated.

                    Nexla uses the path-based Hadoop catalog to write to tables
                    in S3. So if you wish to write to Iceberg table `sales` in
                    `s3://my-nexla-bucket/product/sales`, then set this property
                    to `my-nexla-bucket/product`.
                iceberg.table.name:
                  type: string
                  description: >
                    __Table name__: Name of the table where data will be
                    appended.

                    Nexla uses the path-based Hadoop catalog to write to tables
                    in S3. So if you wish to write to Iceberg table `sales` in
                    `s3://my-nexla-bucket/product/sales`, then set this property
                    to `sales` to write to the table.
                iceberg.insert.mode:
                  type: string
                  enum:
                    - insert
                    - upsert
                  description: >
                    __Update Mode__: Select the mode to insert data into the
                    table. The default mode is `insert` which appends data to
                    the table. The `upsert` mode will update records if they
                    already exist in the table.
                  default: upsert
                iceberg.id-fields:
                  type: string
                  description: >
                    __ID Fields for Upserts__: Comma separated list of column
                    names that will be used to identify records for upserts. If
                    this field is not set, Nexla will append data to the table.
                cdc.enabled:
                  type: boolean
                  description: >
                    __Enable Change Data Capture (CDC)__: Select this option if
                    you would like the platform to monitor database transaction
                    logs for ingesting data.

                    Note that your DBA will need to grant necessary Change Data
                    Capture permissions for Nexla to access transaction logs.
                    Contact Nexla support for relevant instructions.

                    If there are limitations preventing you from enabling CDC
                    controls on your database, you can still setup this source
                    for incremental ingestion by disabling this option and
                    instead selecting incremental table ingestion rules.
                  default: true
                table_name_prefix:
                  type: string
                  description: |
                    __Table name prefix__: Prefix for table name.
                table_name_suffix:
                  type: string
                  description: |
                    __Table name suffix__: Suffix for table name.
                iceberg.partition-keys:
                  type: string
                  description: >
                    __Partition keys__: Comma separated list of column names to
                    use for partitioning when creating a new table. If the table
                    already exists we will not modify the table spec and this
                    option will be ignored.
