      type: object
      properties:
        time:
          type: string
          format: date
          description: |
            The date (in UTC) that the metrics in this entry are applicable for.
        records:
          type: integer
          format: int32
          description: >
            The total number of records that were processed on the date
            indicated by the `time` property.                 
        size:
          type: integer
          format: int32
          description: >
            The total volume (in bytes) of records that were processed on the
            date indicated by the `time` property.           
        errors:
          type: integer
          format: int32
          description: >
            The total number of data processing errors that occurred on the date
            indicated by the `time` property. 
    ResourceMetricByRun:
      type: object
      properties:
        runId:
          type: integer
          description: >
            The run ID / ingestion cycle the the metrics in this entry are
            applicable for.
        lastWritten:
          type: integer
          description: >
            The destination write batch id the the metrics in this entry are
            applicable for. 


            > *Note*: This entry is present and applicable only if the request
            was made for a destination *and* the request was for grouping by
            `lastWritten` instead of `runId`
        dataSetId:
          type: integer
          description: >
            The Nexset ID these records were applicable for. For a data source,
            this indicates the nexset that received the records these metrics
            correspond to. For a data sink, this indicates the nexset that had
            the records these metrics correspond to.        
        records:
          type: integer
          format: int32
          description: >
            The total number of records that were processed during the ingestion
            cycle indicated by `runId`                
        size:
          type: integer
          format: int32
          description: >
            The total volume (in bytes) of records that processed during the
            ingestion cycle indicated by `runId`            
        errors:
          type: integer
          format: int32
          description: >
            The total number of data processing errors that occurred during the
            ingestion cycle indicated by `runId` 
