    TransformMutable:
      type: object
      required:
        - name
        - output_type
        - reusable
        - code
        - code_type
        - code_encoding
      properties:
        name:
          type: string
        description:
          type: string
        output_type:
          type: string
          enum:
            - record
          description: >
            Type of code container. This must be set to `record` to signify that
            this code container is to be used to convert an input record of a
            Nexset into an output record for that Nexset.
        reusable:
          type: boolean
          description: >
            Whether or not this transform can be referenced by multiple Nexsets.
            This should always be `true` for reusable record transforms.     
        code_type:
          type: string
          enum:
            - jolt_custom
            - jolt_standard
          description: >-
            Type of code in the `code` block. Use `jolt_custom` if the code in
            the code block is a `python`, `python3` or `javascript` transform
            code block wrapped inside a Jolt operation block.
        code_encoding:
          type: string
          enum:
            - none
          description: >
            Whether or not the code in the `code` block is encoded. Set this to
            `none` for reusable record transforms.
        code:
          description: >
            Code to be executed for transforming records. 

            If you wish to execute a Python or Javascript code snippet during
            transformation, you'll need to `base64`-encode that code snippet and
            wrap it inside the following Jolt operation object.


            For example, if you want to execute this Python code as a reusable
            record transform 

            ```python

            def transform(input, metadata, args):
              # Sample python transform to pass all attributes through
            return input

            ```

            the corresponding `code` object would be

            ```json

            [
              {
                "operation": "nexla.custom",
                "spec": {
                  "language": "python",
                  "encoding": "base64",
                  "script": "ZGVmIHRyYW5zZm9ybShpbnB1dCwgbWV0YWRhdGEsIGFyZ3MpOgogICMgU2FtcGxlIHB5dGhvbiB0cmFuc2Zvcm0gdG8gcGFzcyBhbGwgYXR0cmlidXRlcyB0aHJvdWdoCiAgcmV0dXJuIGlucHV0"
                }
              }
            ]

            ```  
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  operation:
                    type: string
                    enum:
                      - nexla.custom
                    description: >
                      Jolt operation for this code block. For `python`,
                      `python3` and `javascript`, it must be `nexla.custom`.
                  spec:
                    type: object
                    description: >
                      Jolt specification for this block. See the Python example
                      above for sample specs.
                    properties:
                      language:
                        type: string
                        enum:
                          - python
                          - python3
                          - javascript
                        description: |
                          Code language of the encoded script.
                      encoding:
                        type: string
                        enum:
                          - base64
                        description: >
                          Python or Javascript code snippets must always be
                          Base64-encoded.
                      script:
                        type: string
                        description: >
                          Base64-encoded Python or Javascript code snippet that
                          must be executed for transforming records.
            - type: array
              items:
                type: object
                additionalProperties:
                  type: object
                  x-additionalPropertiesName: Jolt operation block
                  description: >
                    Standard Jolt operation blocks to be executed for
                    transforming records.                  
        custom_config:
          type: object
          description: >
            Configuration block useful for converting code into Nexla UI's
            Nexset Designer Rule blocks. 


            This should not be sent in the payload unless the transform is being
            created using the Nexla UI's Nexset Designer screen.
        tags:
          type: array
          items:
            type: string
    code_containers_ResourceType:
      type: string
      enum:
        - transform
        - ai_function
        - source
        - sink
        - error
        - validator
      description: >
        The type of resource that this code container is to be used for. 

        - `transform`: For user defined code that is used in a Nexset transform.

        - `ai_function`: For user defined code that is used in an AI function.
        See `ai_function_type` for the scenarios where this is used.

        - `source`: For user defined code in a source.

        - `sink`: For user defined code in a sink.

        - `error`: For user defined code that acts as an error handler.

        - `validator`: For user defined code that acts as a validator.
    code_containers_OutputType:
      type: string
      enum:
        - record
        - attribute
        - custom
      description: >
        The type of output that this code container produces.


        - `record`: Produces a full Nexset record. Used only when the code
        container is used to modify a Nexset, i.e output_type: `transform`

        - `attribute`: Produces value for an attribute inside a Nexset record.
        Used only when the code container is used to modify a value inside a
        Nexset, i.e output_type: `transform`

        - `custom`: Produces custom output. Used as a catch-all output format
        when a code container is used in any context other than for Nexset
        modification.
    code_containers_CodeType:
      type: string
      enum:
        - jolt_standard
        - jolt_custom
        - python
        - python3
        - javascript
    CodeContainerMutable:
      type: object
      required:
        - name
        - output_type
        - reusable
        - code
        - code_type
        - code_encoding
      properties:
        name:
          type: string
          example: test
        description:
          type: string
          example: test
        data_credentials_id:
          type: integer
          format: nullable
          description: >
            Credential ID for accessing the code repository (e.g., Github). This
            is for code containers in which the code is saved in a remote
            repository.


            Note that this is not required for script connectors in which the
            script is hosted in a Nexla Github repository.
        resource_type:
          $ref: '#/components/schemas/code_containers_ResourceType'
        ai_function_type:
          type: string
          enum:
            - chunker
            - context_enricher
            - query_rewriter
            - reranker
          description: >
            The type of AI function that this code container is used for.

            - `chunker`:  Used to chunk parsed file content into smaller chunks
            in a Document Ingestion flow.

            - `context_enricher`: Used to enrich the context of a query in a RAG
            flow.

            - `query_rewriter`: Used to rewrite a query in a RAG flow.

            - `reranker`: Used to rerank a list of results in a RAG
            flow.        
        output_type:
          $ref: '#/components/schemas/code_containers_OutputType'
        code_type:
          $ref: '#/components/schemas/code_containers_CodeType'
        code_encoding:
          type: string
          enum:
            - none
            - base64
          description: >
            Whether or not the code in the `code` block is encoded. Set this to
            `none` for reusable record transforms.      
        code:
          description: >
            Code to be executed in this code container.


            Please refer to the endpoints for `transforms`,
            `attribute_transforms` and `validators` for respective `code` block
            requirements.
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  operation:
                    type: string
                    example: nexla.custom
                  spec:
                    type: object
                    properties:
                      language:
                        type: string
                        example: python
                      encoding:
                        type: string
                        example: base64
                      script:
                        type: string
        reusable:
          type: boolean
          description: >
            Whether or not this transform can be referenced by multiple
            resources. This should always be `true` for reusable record and
            attribute transforms.       
        tags:
          type: array
          items:
            type: string
        custom_config:
          type: object
