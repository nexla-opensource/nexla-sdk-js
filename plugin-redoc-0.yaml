        This call to `/data_maps` **does not** return data map entries, as they
        can be a large array of objects for big data maps. 


        You can include the `expand` query parameter to fetch the data map
        entries of smaller static data maps.
      parameters:
        - name: data_map_id
          in: path
          description: The unique ID of the data map that needs to be fetched.
          required: true
          schema:
