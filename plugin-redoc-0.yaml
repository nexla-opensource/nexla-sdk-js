    min_io_s3_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              required:
                - nx_external_host
                - nx_external.auth.type
                - nx_external.auth.props
              properties:
                nx_external_host:
                  type: string
                  description: |
                    __MinIO Host__: The custom host URL for MinIO.
                nx_external.auth.type:
                  type: string
                  enum:
                    - min_io_s3
                  description: >
                    __Authentication Type__: The authentication mechanism for
                    MinIO.


                    * `min_io_s3`: Use this option to authenticate with MinIO
                    S3.
                nx_external.auth.props:
                  type: string
                  description: >
                    __MinIO S3 Credentials__: Authentication credentials as a
                    JSON string. Should include 'access_key_id' and
                    'secret_key'.
                access_key:
                  type: string
                  description: |
                    MinIO Access Key for accessing the MinIO S3 bucket.
                secret_key:
                  type: string
                  description: |
                    MinIO Secret Key for accessing the MinIO S3 bucket.
                test.path:
                  type: string
                  description: >
                    __S3 Path list access is limited to__: Set this property to
                    `<bucket-name>` or `<bucket-name>/<folder-name>` if your AWS
                    admin has restricted access to only a specific bucket or a
                    path inside a bucket.
                has_client_encryption:
                  type: boolean
                  description: >
                    __Enable Client Side Encryption?__: The platform can be
                    configured to encrypt/decrypt S3 objects that require
                    client-side encryption using the AWS Key Management System
                    (KMS). Set this option if KMS encryption is applicable.


                    Default value: `false`
                encryption_mode:
                  type: string
                  enum:
                    - EncryptionOnly
                    - AuthenticatedEncryption
                    - StrictAuthenticatedEncryption
                  description: >
                    __Client Side Encryption Mode__: Select the type of KMS
                    encryption mode that is applicable for this credential.


                    __Required__ if `has_client_encryption` is `true`
                kms_key:
                  type: string
                  description: >
                    __Amazon KMS Key for Encryption__: The KMS Key used for
                    encrypting/decrypting objects. Please ensure that this user
                    has appropriate KMS permissions.


                    __Required__ if `has_client_encryption` is `true`
                sse.enabled:
                  type: boolean
                  description: >
                    __Enable Server Side Encryption?__: The platform can be
                    configured to encrypt/decrypt S3 objects that require
                    server-side encryption.


                    This can be done using either __Amazon S3-managed encryption
                    keys (SSE-S3)__ or the __AWS Key Management Service
                    (SSE-KMS)__. Set this option if server-side encryption is
                    applicable.


                    Default value: `false`      
                sse.kms_key.arn:
                  type: string
                  description: >
                    __Key ARN for SSE with KMS__: The Key ARN if you want
                    server-side encryption to be performed via the AWS Key
                    Management System. You can leave this field blank if you
                    want to use Amazon S3-managed encryption keys.


                    __Required__ if `sse.enabled` is `true`
        - $ref: '#/components/schemas/file_data_credential'
    mongo_data_credential:
      allOf:
        - $ref: '#/components/schemas/data_credential'
        - type: object
          properties:
            credentials:
              type: object
              properties:
                ui.url_format:
                  type: string
                  enum:
                    - connection_url
                    - http_path_parts
                  description: >
                    __URL Format__: You can enter the MongoDB authentication
                    information as a MongoDB Java Connection URL (Version 3.4 or
                    later) or as parts that will be combined by Nexla to create
                    the connection string.


                    * `connection_url`: __MongoDB Connection URL__ - Enter the
                    MongoDB Java connection URL. For example, in MongoDB Atlas,
                    please select connect your application → Driver: Java →
                    version 3.4 or later.


                    * `http_path_parts`: __HTTP Path Parts__
                url:
                  type: string
                  description: >
                    __Connection URL__: Enter the MongoDB Connection URL of your
                    MongoDB instance location. This should be in the form
                    `mongodb://...`.


                    For example, in MongoDB Atlas, please select connect your
                    application → Driver: Java → version 3.4 or later.


                    Note that currently, we only support connection URLs that
                    direct to a specific database, so your connection string
                    must be in the form
                    `mongodb://<user>:<password>@.../<database>?ssl=true...`.


                    __Applicable and Required__ if `ui.url_format` is
                    `connection_url`.
                host:
                  type: string
                  description: >
                    __Host__: Enter the hostname for your database. This is
                    usually an IP address or text in the format
                    __company.domain.com__. Do not include the connection
                    protocol.


                    __Applicable and Required__ if `ui.url_format` is
                    `http_path_parts`.
                port:
                  type: integer
                  description: >
                    __Port__: Enter the port number for your database.


                    Default value: `27017`.


                    __Applicable and Required__ if `ui.url_format` is
                    `http_path_parts`.
                username:
                  type: string
                  description: >
                    __Username__: Enter the username for your database.


                    __Applicable and Required__ if `ui.url_format` is
                    `http_path_parts`.
                password:
                  type: string
                  description: >
                    __Password__: Enter the password for your database.


                    __Applicable and Required__ if `ui.url_format` is
                    `http_path_parts`.
                database:
                  type: string
                  description: |
                    __Database__: Limit access to a specific database.

                    __Applicable__ if `ui.url_format` is `http_path_parts`.
        - $ref: '#/components/schemas/nosql_data_credential'
