  /{resource_type}/{resource_id}/activate:
    put:
      tags:
        - Flows
      operationId: flow_activate_with_resource_id
      summary: Activate a Flow (with Resource ID)
      description: >
        To activate the entire flow include the ?all=1 or ?full_tree=1 query
        parameter.
          
        >**Note**: 

        > 1. All endpoints for activating or pausing a flow operate on the
        specific resource given and all of the flow nodes downstream from that
        resource. This allows for pausing and activating sub-flows while leaving
        the rest of the flow state unchanged.

        > 2. This is a variant of flow endpoints where the flow node can
        referenced not by its own ID, but by the ID of the unique resource that
        is linked to that flow node.
      parameters:
        - name: resource_type
          in: path
          description: >
            The type of node linked to the flow you want to reference. For ex,
            set this to `data_sources` if you want to refer to the flow
            originating in a `data_source`.
          required: true
          schema:
            type: string
            enum:
              - data_sources
              - data_sinks
              - data_sets
        - name: resource_id
          in: path
          description: >
            The unique id of the resource whose flow you want to reference.  For
            ex, set this to id of the `data_source` if you want to refer to the
            flow originating in a specific `data_source`.
          required: true
          schema:
            type: integer
        - name: all
          in: path
          description: >
            Set this query parameter if the resource ID you are making a call
            with is not an origin flow node but you want to activate the full
            flow chain.

            Not necessary if the flow node is an origin flow node.
          schema:
            type: integer
            enum:
              - 1
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          $ref: '#/components/responses/FlowsOne'
        '403':
          description: Forbidden
        '404':
          description: Not found
