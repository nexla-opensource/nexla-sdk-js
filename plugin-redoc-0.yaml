openapi: 3.1.0
info:
  version: v1
  title: Nexla Rest API
  termsOfService: https://nexla.com/terms-of-service/
  contact:
    name: Nexla Support
    url: https://docs.nexla.com
    email: support@nexla.com
  license:
    name: Nexla
    url: https://nexla.com
  x-logo:
    url: https://cdn.nexla.io/ui/assets/brand/v2/nexla-logo-color-portrait.svg
    backgroundColor: '#ffffff'
  description: >-
    # Introduction


    The Nexla API is a REST-ful API used to easily create and manage resources
    in Nexla in ways that best fit any use case. It can be used to configure and
    monitor data flows for different data-integration use cases and to perform
    all aspects of data engineering automation offered by the Nexla platform.


    The Nexla API supports all data flow-creation and -management actions in the
    platform, as well as administrative user- and organization-level
    account-management tasks. Note that all other client packages, such as the
    Nexla CLI and Nexla UI, also connect to the overall Nexla infrastructure
    through the Nexla API.


    The API references in this document lists all API endpoints and the
    corresponding payloads.


    Check out the [API Developer
    Guides](https://developers.nexla.com/docs/nexla-api) to view guides and
    tutorials for recommended use cases for different endpoints.


    # API Data Format and Versions


    The API uses JSON for all data exchanges.


    You __should__ specify the API version that should be used in the Accept
    header of each request. For example, to access Version 1 of the API, the
    Accept header should be the following:

    ```

    Accept: application/vnd.nexla.api.v1+json

    ```


    The Nexla API also supports a generic version header, which will default
    your access to the latest version of the data source/destination API.



    ```

    Accept: application/json

    ```


    # Authentication


    Most Nexla API endpoints require `Bearer Token` authentication mechanism for
    making an authenticated request to the API. While this token can be
    generated programmatically outside Nexla UI by starting a session with an
    `api_key`, unless unavoidable, we recommend starting your session from the
    Nexla UI and using the `Nexla Session Token` from the Nexla UI as the
    Authorization header for calls to the Nexla API.


    <SecurityDefinitions />
servers:
  - url: https://{nexla-api-host}
    variables:
      nexla-api-host:
        default: dataops.nexla.io/nexla-api
        description: Nexla API URL your Nexla instance
security:
  - NexlaSessionToken: []
tags:
  - name: Session Management
    description: >
      Operations for managing your Nexla session programmatically. 


      > Note: Unless unavoidable, we recommend starting your session from the
      Nexla UI and using the `Nexla Session Token` from the Nexla UI as the
      Authorization header for calls to the Nexla API.
  - name: Flows
    description: Operations for managing flows.
  - name: Sources
    description: Operations for managing data sources.
  - name: Destinations (Data Sinks)
    description: >
      Operations for managing data sinks. Note that Destinations on the Nexla UI
      are aliased as `data_sinks` in the Nexla API reference model, so all
      endpoints and responses use the term `data_sinks` instead of
      `destinations`.
  - name: Nexsets (Data Sets)
    description: >
      Operations for managing Nexsets. Note that Nexsets on the Nexla UI are
      aliased as `data_sets` in the Nexla API reference model, so all endpoints
      and responses use the term `data_sets` instead of `nexsets`.
  - name: Custom Data Flows
    description: >
      Operations for managing Custom Data Flows. Custom Data Flows are platform
      entities that are created to maintain references to off-platform data
      processing flows (e.g. some Airflow dags). These resources are created
      primarily to track and report data processing metrics of such flows.


      > Note: These are internal-only endpoints that should not be shared
      externally. These endpoints will be deprecated shortly in favor of more
      scalable endpoints for such data flows.
          
  - name: Credentials
    description: Operations for managing data credentials.
  - name: Lookups (Data Maps)
    description: >
      Operations for managing data maps. Note that Lookups on the Nexla UI are
      aliased as `data_maps` in the Nexla API reference model, so all endpoints
      and responses use the term `data_maps` instead of `lookups`. 
  - name: Webhooks
    description: Operations for sending events to the Nexla `webhook` connector.
  - name: Organizations
    description: Operations for managing the user's organization.
  - name: Users
    description: Operations for managing user settings.
  - name: Teams
    description: Operations for managing teams.
  - name: Projects
    description: Operations for managing projects.
  - name: Transforms
    description: Operations for managing reusable attribute and record transforms.
  - name: Code Containers
    description: >

      Code containers are a general-purpose resource in the platform for storing
      user-defined functions that can be referenced by different modules for
      different purposes.


      These containers can either hold the code in the database or reference the
      repository where the code is saved.


      Common use cases are - 

      1. `transform` for code blocks that are used to transform Nexsets.

      2. `ai_function` for code blocks that can be used for AI functions.


      For convenience, in addition to allowing direct access to any type of
      code_container, the API also provides some aliased versions of commonly
      used types of code containers. For ex, all endpoints for `transforms` are
      just aliases to endpoints for code_containers that can only be used for
      transforming Nexset record,
  - name: Notifications
    description: Operations for managing notifications.
  - name: Metrics
    description: Operations for retrieving metrics.
  - name: Audit Logs
    description: Operations for reviewing the change history of resources.
  - name: Access Control
    description: Operations for managing access control to resources
  - name: Quarantine Settings
    description: Operations for managing quarantine settings.
  - name: Gen AI Recommendations
    description: Operations for requesting AI recommendations for documentation.
  - name: Approval Requests
    description: Operations for managing all requests made by users without permissions.
  - name: Limits
    description: Rate limit endpoints
  - name: 'Env: Org Management'
    description: Operations for managing organizations in an environment.
  - name: 'Env: Vendor Management'
    description: Operations for managing vendors in an environment.
  - name: 'Env: General Settings'
    description: Operations for managing different environment settings.
  - name: Org authentication configs
    description: Operations for managing organization authentication configurations.
  - name: Marketplace
    description: Operations for managing the marketplace domains and items.
  - name: Self Sign-Up
    description: Operations for self-signup and verification.
  - name: Self Sign-Up Admin
    description: Operations for approving self-signup requests.
  - name: Async Tasks
    description: Operations for managing asynchronous tasks.
  - name: Custom Runtimes
    description: Operations for managing custom runtimes.
  - name: GenAI Configurations
    description: Operations for managing GenAI configurations.
paths:
  /data_credentials:
    get:
      tags:
        - Credentials
      operationId: get_data_credentials
      summary: Get All Credentials
      description: |
        Returns all data credentials accessible to the authenticated user.
      parameters:
        - $ref: '#/components/parameters/access_roles'
        - $ref: '#/components/parameters/accept'
        - name: credentials_type
          in: query
          description: >
            (Optional) Set this to the type of credentials you want to filter
            by. Connection type or vendor name can be used there.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/data_credential_many'
        '403':
          description: Forbidden
        '404':
          description: Not found
    post:
      tags:
        - Credentials
      operationId: create_data_credential
      summary: Create a Credential
      description: >
        Creates a Nexla data credential with the specified configuration in your
        Nexla account.


        > Note: `name`, `credentials_type`, and `credentials` are required.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/data_credential'
                - required:
                    - name
                    - credentials_type
                    - credentials
      responses:
        '200':
          $ref: '#/components/responses/data_credential_one'
        '400':
          description: Unauthorized
  /data_credentials/{credential_id}:
    get:
      tags:
        - Credentials
      operationId: get_data_credential
      summary: Get Credential by ID
      description: |
        Returns a credential object if a valid ID is provided.
      parameters:
        - name: credential_id
          in: path
          description: The unique ID of the credential that needs to be fetched.
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          $ref: '#/components/responses/data_credential_one'
        '403':
          description: Forbidden
        '404':
          description: Not found error
    put:
      tags:
        - Credentials
      operationId: update_data_credential
      summary: Update Credential
      description: >
        Updates a data credential in the authenticated user's account. 


        > Note: This method does not perform partial updating of the
        `credentials` object. The entire `credentials` object will be updated if
        this is added to the payload.
      parameters:
        - name: credential_id
          in: path
          description: The unique ID of the credential that needs to be fetched.
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/accept'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/data_credential'
      responses:
        '200':
          $ref: '#/components/responses/data_credential_one'
        '403':
          description: Forbidden
        '404':
          description: Not found error
    delete:
      tags:
        - Credentials
      operationId: delete_data_credential
      summary: Delete a Credential
      description: Deletes a credential from your Nexla account.
      parameters:
        - name: credential_id
          in: path
          description: The unique ID of the credential that needs to be deleted.
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    description: Response status code
                  message:
                    type: string
                    description: Response status text
        '404':
          description: Not found error
  /data_credentials/{credential_id}?expand=1:
    get:
      tags:
        - Credentials
      operationId: get_data_credential_expanded
      summary: Get Credential by ID with expanded references
      description: >-
        Returns a credential object along with advanced information about
        associated references if a valid ID is provided.
      parameters:
        - name: credential_id
          in: path
          description: The unique ID of the credential that needs to be fetched
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/expand'
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          $ref: '#/components/responses/data_credential_one'
        '403':
          description: Forbidden
        '404':
          description: Not found error
  /data_credentials/{credential_id}/probe:
    get:
      tags:
        - Credentials
      operationId: data_credential_probe
      summary: Test credential validity
      description: |
        Use this endpoint to check whether or not a credential is valid.
      parameters:
        - name: credential_id
          in: path
          description: The unique ID of the credential being used.
          required: true
          schema:
            type: integer
        - name: async
          in: query
          description: >-
            If set to 'true', request will be executed in a deferred way, and
            results will be provided later.
          required: false
          schema:
            type: boolean
        - name: request_id
          in: query
          description: >-
            The unique ID of the asynchronous request. In case it's provided,
            returns info about the deferred request.
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/probe_response_with_async_results'
        '401':
          description: Unauthorized
        '403':
          description: Invalid credential
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                      - 403
                  message:
                    type: string
                    description: |
                      Detailed reason for the credential authentication failure.
        '404':
          description: Not Found
  /data_credentials/{credential_id}/probe/tree:
    post:
      tags:
        - Credentials
      operationId: preview_storage_structure
      summary: Preview Storage Structure
      description: >-
        Use this endpoint to preview the structure/hierarchy of storage to which
        this credential grants access. For example, you can use this endpoint to
        see the folder and file structure of a file storage system or the
        table-column structure of a database.

        This can be used to inspect the directory hierarchy of file content
        storage or the database schema of a database/warehouse storage system.
        Note that this endpoint is only valid for credentials for storage
        systems wherein a storage structure needs to be reviewed.
      parameters:
        - name: credential_id
          in: path
          description: The unique ID of the credential being used.
          required: true
          schema:
            type: integer
        - name: async
          in: query
          description: >-
            If set to 'true', request will be executed in a deferred way, and
            results will be provided later.
          required: false
          schema:
            type: boolean
        - name: request_id
          in: query
          description: >-
            The unique ID of the asynchronous request. In case it's provided,
            returns info about the deferred request.
          required: false
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - depth
                  properties:
                    depth:
                      type: integer
                      description: >
                        Specify the hierarchy depth that should be scanned and
                        returned in the response. 


                        If no other payload properties are provided, the depth
                        is relative to the storage root. If this request
                        contains instructions about the slice of storage to be
                        previewed (using the path/database/table properties),
                        the depth will be applied relative to that storage
                        slice.


                        We recommend using a depth = 1 to ensure that only
                        small, relevant slices of the storage system are
                        scanned.
                    path:
                      type: string
                      description: >
                        Folder or subfolder path for which you wish to retrieve
                        the content structure. The path string should be
                        structured from the root of the location to the
                        credential. For example, `demo-out.nexla.com/users/test`
                        will return the folder tree for the contents of the
                        `test` subfolder.


                        This is relevant for file-type connectors.
                - type: object
                  required:
                    - depth
                  properties:
                    depth:
                      type: integer
                      description: >
                        Specify the hierarchy depth that should be scanned and
                        returned in the response. 


                        If no other payload properties are provided, the depth
                        is relative to the storage root. If this request
                        contains instructions about the slice of storage to be
                        previewed (using the path/database/table properties),
                        the depth will be applied relative to that storage
                        slice.


                        We recommend using a depth = 1 to ensure that only
                        small, relevant slices of storage are scanned.
                    database:
                      type: string
                      description: >
                        Name of the database from which you wish to fetch table
                        names or collections. 


                        Relevant for Database and NoSql document-type
                        connectors. 
                    table:
                      type: string
                      description: >
                        Name of the table of which you wish to fetch the column
                        structure. 


                        Relevant for database-type connectors.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/probe_tree_with_async'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  /data_credentials/{credential_id}/probe/sample:
    post:
      tags:
        - Credentials
      operationId: preview_connector_content
      summary: Preview Connector Content
      description: >
        Use this endpoint to preview the data content in a storage system.


        1. For file systems, this can be used to preview the file content of any
        specific file. 

        2. For database systems, it can be used to preview sample rows from a
        table or query result. 

        3. For the rest connector, it can be used to preview the results of any
        API request.

        4. For streaming connectors, it can be used to preview some records in a
        topic.


        For most connectors, it can also be used to determine the type of
        records that might be detected in the resulting Nexset.
      parameters:
        - name: credential_id
          in: path
          description: The unique ID of the credential being used.
          required: true
          schema:
            type: integer
        - name: async
          in: query
          description: >-
            If set to 'true', request will be executed in a deferred way, and
            results will be provided later.
          required: false
          schema:
            type: boolean
        - name: request_id
          in: query
          description: >-
            The unique ID of the asynchronous request. In case it's provided,
            returns info about the deferred request.
          required: false
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    path:
                      type: string
                      description: >
                        __For file type connectors__: Set the path to the file
                        from which you wish to preview content.
                - type: object
                  additionalProperties:
                    type:
                      - string
                      - object
                      - number
                      - array
                    x-additionalPropertiesName: connector_source_config_property
                    description: >
                      __For Rest, Database, Soap, and Stream Connectors__: Add
                      all properties from the connector `source_config`.    
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/probe_sample_with_async'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  /flows:
    get:
      tags:
        - Flows
      operationId: get_flows
      summary: Get All Flows
      description: |
        Returns all flows accessible to the authenticated user.
      parameters:
        - name: flows_only
          in: query
          schema:
            type: integer
            enum:
              - 1
            description: >
              By default, flows responses include sub-lists of the resources
              included in the `flows`, such as `data_sources`, `data_sets` and
              `data_sinks`. If you do not need resource details and just need
              flow chain, include the `flows_only` query parameter in your
              request. This option can improve request response time
              significantly.
        - name: include_run_metrics
          in: query
          schema:
            type: integer
            enum:
              - 1
            description: >
              By default, flows responses do not include run metrics. If you
              want to include run metrics in the response, include the
              `include_run_metrics` query parameter in your request.
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/access_roles'
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          $ref: '#/components/responses/FlowsManyWithMetric'
        '403':
          description: Forbidden
        '404':
          description: Not found
  /flows/{flow_id}:
    get:
      tags:
        - Flows
      summary: Get Flow by ID
      description: |
        Returns a flow object if a valid flow ID is provided.
      operationId: get_flow_by_id
      parameters:
        - name: flow_id
          in: path
          description: The unique ID of the flow that needs to be fetched.
          required: true
          schema:
            type: integer
        - name: flows_only
          in: query
          schema:
            type: integer
            enum:
              - 1
            description: >
              By default, flows responses include sub-lists of the resources
              included in the `flows`, such as `data_sources`, `data_sets` and
              `data_sinks`. If you do not need resource details and just need
              flow chain, include the `flows_only` query parameter in your
              request. This option can improve request response time
              significantly.
                      
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          $ref: '#/components/responses/FlowsOne'
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags:
        - Flows
      summary: Delete a Flow
      description: Deletes a flow from your Nexla account.
      operationId: delete_flow
      parameters:
        - name: flow_id
          in: path
          description: The unique ID of the flow that needs to be deleted.
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    description: Response status code
                  message:
                    type: string
                    description: Response status text
        '404':
          description: Not found error
  /flows/{flow_id}/activate:
    put:
      tags:
        - Flows
      operationId: flow_activate_with_flow_id
      summary: Activate a Flow
      description: >
        To activate the entire flow, use either the `origin_node_id` from any
        data source, set or sink in the flow, or include the ?all=1 or
        ?full_tree=1 query parameter.
          
        >**Note**: 

        > 1. All endpoints for activating or pausing a flow operate on the
        specific resource given and all of the flow nodes downstream from that
        resource. This allows for pausing and activating sub-flows while leaving
        the rest of the flow state unchanged.

        > 

        >  2. You can also activate a flow by using the id of the `data_source`/
        `data_set` / `data_sink` that the flow node is linked to. See relevant
        endpoints in the API references for those resources.  
      parameters:
        - name: flow_id
          in: path
          description: The unique ID of the flow that needs to be activated.
          required: true
          schema:
            type: integer
        - name: all
          in: path
          description: >
            Set this query parameter if the flow node ID you are making a call
            with is not an origin flow node but you want to activate the full
            flow chain.

            Not necessary if the flow node is an origin flow node.
          schema:
            type: integer
            enum:
              - 1
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          $ref: '#/components/responses/FlowsOne'
        '403':
          description: Forbidden
        '404':
          description: Not found
  /flows/{flow_id}/pause:
    put:
      tags:
        - Flows
      operationId: flow_pause_with_flow_id
      summary: Pause a Flow
      description: >
        To pause the entire flow, use either the `origin_node_id` from any data
        source, set or sink in the flow, or include the ?all=1 or ?full_tree=1
        query parameter.
          
        >**Note**: 

        > 1. All endpoints for activating or pausing a flow operate on the
        specific resource given and all of the flow nodes  downstream from that
        resource. This allows for pausing and activating sub-flows while leaving
        the rest of the flow state unchanged.

        > 

        >  2. You can also pause a flow by using the id of the `data_source`/
        `data_set` / `data_sink` that the flow node is linked to. See relevant
        endpoints in the API references for those resources.    
      parameters:
        - name: flow_id
          in: path
          description: The unique ID of the flow that needs to be paused.
          required: true
          schema:
            type: integer
        - name: all
          in: path
          description: >
            Set this query parameter if the flow node ID you are making a call
            with is not an origin flow node but you want to pause the full flow
            chain.

            Not necessary if the flow node is an origin flow node.
          schema:
            type: integer
            enum:
              - 1
        - name: async
          in: query
          description: >-
            If set to 'true', request will be executed in a deferred way, and
            results will be provided later. Notice: only works with all=1 or
            full_tree=1.
          required: false
          schema:
            type: boolean
        - name: request_id
          in: query
          description: >-
            The unique ID of the asynchronous request. In case it's provided,
            returns info about the deferred request.
          required: false
          schema:
            type: integer
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/flow_one_with_async'
        '403':
          description: Forbidden
        '404':
          description: Not found
  /flows/{flow_id}/copy:
    post:
      tags:
        - Flows
      operationId: flow_copy_with_flow_id
      summary: Copy a Flow
      description: |
        Use this endpoint to create a copy of an existing flow. 
      parameters:
        - name: flow_id
          in: path
          description: The unique ID of the flow that needs to be paused.
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/vnd.nexla.api.v1+json:
            schema:
              type: object
              properties:
                reuse_data_credentials:
                  type: boolean
                  description: >
                    Set this to `true` if you do want to reuse the credentials
                    of this flow instead of creating a clone of the credentials
                    also.
                copy_access_controls:
                  type: boolean
                  description: >
                    Set this to `true` if you want the new flow to be accessible
                    by all users who have access to the this flow. 
                copy_dependent_data_flows:
                  type: boolean
                  description: >
                    This is relevant for flows where one or more destinations
                    have sources as their children. Set this to `true` if you
                    want to create a clone of the flows that originate from
                    those sources also. 
                owner_id:
                  type: integer
                  description: >
                    The default API behavior is to create the new flow in the
                    account of the authenticated user making this call. Set this
                    property if you want a different user to be the owner of the
                    new flow.
                org_id:
                  type: integer
                  description: >
                    The default API behavior is to create the new flow in the
                    org that the authenticated user making this call belongs to.
                    Set this property if you want the flow to be created in a
                    different org.
      responses:
        '200':
          $ref: '#/components/responses/FlowsOne'
        '403':
          description: Forbidden
        '404':
          description: Not found
  /flows/{flow_id}/docs/recommendation:
    post:
      tags:
        - Flows
        - Gen AI Recommendations
      operationId: flow_docs_recommendation
      summary: Generate an AI suggestion for flow documentation
      description: >
