      summary: Copy a Sink
      description: |
        Use this endpoint to create a copy of an existing data sink. 
      parameters:
        - name: sink_id
          in: path
          description: The unique ID of the sink that needs to be copied.
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/vnd.nexla.api.v1+json:
            schema:
              type: object
              properties:
                reuse_data_credentials:
                  type: boolean
                  description: >
                    Set this to `true` if you do want to reuse the credentials
                    of this sink instead of creating a clone of the credentials
                    also.
                copy_access_controls:
                  type: boolean
                  description: >
                    Set this to `true` if you want the new sink to be accessible
                    by all users who have access to the this sink.  
                owner_id:
                  type: integer
                  description: >
                    The default API behavior is to create the new sink in the
                    account of the authenticated user making this call. Set this
                    property if you want a different user to be the owner of the
                    new sink.
                org_id:
                  type: integer
                  description: >
                    The default API behavior is to create the new sink in the
                    org that the authenticated user making this call belongs to.
                    Set this property if you want the sink to be created in a
                    different org.
