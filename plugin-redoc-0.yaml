        each node of the flow for the specified time range. They can be be
        further grouped by run id to indicate the number of records processed
        during each ingestion cycle of this flow.


        > Note: This is a variant of flow endpoints where the flow node can
        referenced not by its own ID, but by the ID of the unique resource that
        is linked to that flow node.
      parameters:
        - name: resource_type
          in: path
          description: >
            The type of node linked to the flow you want to reference. For ex,
            set this to `data_sources` if you want to refer to the flow
            originating in a `data_source`.
          required: true
          schema:
            type: string
            enum:
              - data_sources
              - data_sinks
              - data_sets
        - name: resource_id
          in: path
          description: >
            The unique id of the resource whose flow you want to reference.  For
            ex, set this to id of the `data_source` if you want to refer to the
            flow originating in a specific `data_source`.
          required: true
          schema:
            type: integer
        - name: from
          in: query
          description: >
            The date that should be considered as the start of the metrics
            aggregation period.
          required: true
          schema:
            type: string
            format: date-time
            example: '2023-01-10'
        - name: to
          in: query
          description: >
            The date that should be considered as the end of the metrics
            aggregation period. In the absence of this parameter, the API
            returns metrics aggregated up to the current date.
          schema:
            type: string
            format: date-time
            example: '2023-01-17'
        - name: groupby
          in: path
          schema:
            type: string
            enum:
              - runId
          description: >
            Specify the rule based on which metrics should be grouped for
            aggregation. This is an optional property. 


            If present and set to `runId` the response will contain one entry
            per run id, with each entry containing metrics for all resources
            that processed data during that run.
        - name: orderby
          in: path
          schema:
            type: string
            enum:
              - runId
              - created_at
          description: |
            Specify the order in which paginated results should be sorted.
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          $ref: '#/components/responses/FlowMetricsResponse'
        '403':
          description: Forbidden
        '404':
          description: Not found error
  /data_flows/{resource_type}/{resource_id}/logs:
    get:
      tags:
        - Metrics
      operationId: get_flow_logs_for_run_id
      summary: Get Flow Execution Logs for Run ID of a Flow
      description: >
        Retrieves flow execution logs for a specific run id of a flow.


        > Note: This is a variant of flow endpoints where the flow node can
        referenced not by its own ID, but by the ID of the unique resource that
        is linked to that flow node.
      parameters:
        - name: resource_type
          in: path
          description: >
            The type of node linked to the flow you want to reference. For ex,
            set this to `data_sources` if you want to refer to the flow
            originating in a `data_source`.
          required: true
          schema:
            type: string
            enum:
              - data_sources
              - data_sinks
              - data_sets
        - name: resource_id
          in: path
          description: >
            The unique id of the resource whose flow you want to reference.  For
            ex, set this to id of the `data_source` if you want to refer to the
            flow originating in a specific `data_source`.
          required: true
          schema:
            type: integer
        - name: run_id
          in: query
          description: >-
            The run id (denoting the ingestion cycle) for which logs have to be
            fetched.
          required: true
          schema:
            type: integer
            example: 1695442864636
        - name: from
          in: query
          description: >-
            The timestamp that should be considered as the start of the logs
            reporting period.
          required: true
          schema:
            type: integer
            format: unix epoch in milliseconds
            example: 1695442864636
        - name: to
          in: query
          description: >
            The timestamp that should be considered as the end of the logs
            reporting period. In the absence of this parameter, the API returns
            metrics up to the current time.
          schema:
            type: integer
            format: unix epoch in milliseconds
            example: 1695442864636
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          $ref: '#/components/responses/FlowLogsResponse'
        '403':
          description: Forbidden
        '404':
          description: Not found error
