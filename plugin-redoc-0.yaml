  /users/{user_id}/quarantine_settings:
    get:
      tags:
        - Quarantine Settings
      operationId: get_user_quarantine_data_export_settings
      summary: Get Quarantine Data Export Settings for A User
      description: >
        Retrieve Quarantine Data Export Settings for all resources owned by a
        user. 


        Nexla detects errors during different stages of data flow such as
        ingestion, transformation, and output. Error records are quarantined and
        accessible to the user via APIs as well as files. With Quarantine Data
        Export Settings, you can configure Nexla to write files containing
        information about erroneous records across all resources owned by a
        user.


        > This endpoint returns a 404 status code if no Quarantine Data Export
        Settings have been configured for the user.
      parameters:
        - $ref: '#/components/parameters/accept'
        - name: user_id
          in: path
          description: >-
            The unique ID of the user whose quarantine settings you wish to
            retrieve.
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/quarantine_settings_one'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    post:
      tags:
        - Quarantine Settings
      operationId: create_quarantine_data_export_settings
      summary: Set Quarantine Data Export Settings for A User
      description: >
        Sets Quarantine Data Export Settings for all resources owned by a user
        so that all erroneous records can be automatically exported by the
        platform to a file system regularly.
      parameters:
        - $ref: '#/components/parameters/accept'
        - name: user_id
          in: path
          description: The unique ID of the user.
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/vnd.nexla.api.v1+json:
            schema:
              $ref: '#/components/schemas/QuarantineSettingCreate'
      responses:
        '200':
          $ref: '#/components/responses/quarantine_settings_one'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    put:
      tags:
        - Quarantine Settings
      operationId: update_user_quarantine_data_export_settings
      summary: Update Quarantine Data Export Settings for A User
      description: >
        Updates Quarantine Data Export Settings for all resources owned by a
        user so that all erroneous records can be automatically exported by the
        platform to a file system regularly.
      parameters:
        - $ref: '#/components/parameters/accept'
        - name: user_id
          in: path
          description: The unique ID of the user.
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/vnd.nexla.api.v1+json:
            schema:
              $ref: '#/components/schemas/QuarantineSettingMutable'
      responses:
        '200':
          $ref: '#/components/responses/quarantine_settings_one'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    delete:
      tags:
        - Quarantine Settings
      operationId: delete_user_quarantine_data_export_settings
      summary: Delete Quarantine Data Export Settings for A User
      description: >
        Deletes Updates Quarantine Data Export Settings for all resources owned
        by a user. Deleting this setting will ensure the platform stops
        exporting all erroneous records for resources owned by the user to a
        file storage.
      parameters:
        - name: user_id
          in: path
          description: The unique id of the user.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
