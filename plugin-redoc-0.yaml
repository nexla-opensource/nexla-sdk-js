  /orgs/{org_id}/flows/account_metrics:
    get:
      tags:
        - Metrics
      operationId: org_account_metrics_total
      summary: Get Total Account Metrics for An Organization
      description: >
        Retrieves total account utilization metrics for an organization. The
        result consists of aggregated information about records processed within
        the specified date range by all resources owned by users in the
        organization.
      parameters:
        - name: org_id
          in: path
          description: >
            The unique ID of the organization. The result will be an aggregate
            of metrics for all resources owned by users in the organization.
          required: true
          schema:
            type: integer
        - name: from
          in: query
          description: >-
            The date that should be considered as the start of the metrics
            aggregation period.
          required: true
          schema:
            type: string
            format: date-time
            example: '2023-01-10'
        - name: to
          in: query
          description: >
            The date that should be considered as the end of the metrics
            aggregation period. In the absence of this parameter, the API
            returns metrics aggregated up to the current date.
          schema:
            type: string
            format: date-time
            example: '2023-01-17T20:24:35Z'
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          $ref: '#/components/responses/flows_account_metrics'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found error
  /users/{user_id}/flows/account_metrics:
    get:
      tags:
        - Metrics
      operationId: user_account_metrics_total
      summary: Get Total Account Metrics for a User
      description: >
        Retrieves total account utilization metrics for a user in an
        organization. The result consists of aggregated information about
        records processed within the specified date range by all resources owned
        by the user.
      parameters:
        - name: user_id
          in: path
          description: >
            The unique ID of the user. The result will be an aggregate of
            metrics for all resources owned by this user.
          required: true
          schema:
            type: integer
        - name: org_id
          in: query
          description: >
            The ID of the organization this user belongs to. This parameter is
            relevant for users who belong to multiple organizations. In the
            absence of this parameter, the API returns an aggregate of metrics
            for all resources owned by the user in the user's default
            organization. Set this query parameter to fetch metrics for a
            different organization.
          schema:
            type: integer
        - name: from
          in: query
          description: >-
            The date that should be considered as the start of the metrics
            aggregation period.
          required: true
          schema:
            type: string
            format: date-time
            example: '2023-01-10'
        - name: to
          in: query
          description: >
            The date that should be considered as the end of the metrics
            aggregation period. In the absence of this parameter, the API
            returns metrics aggregated up to the current date.
          schema:
            type: string
            format: date-time
            example: '2023-01-17'
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          $ref: '#/components/responses/flows_account_metrics'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found error
  /users/{user_id}/flows/dashboard:
    get:
      tags:
        - Metrics
      operationId: user_24_hour_flow_stats
      summary: Get 24 Hour Flow Stats for a User
      description: >
        Retrieves the metrics and processing status of each flow that processed
        data in the last 24 hours. 


        Each item reflects the total number of records processed by each stage
        of all flows accessible by the user that processed any data in the
        specified time window. 
      parameters:
        - name: user_id
          in: path
          description: |
            The unique ID of the user whose flows are to be fetched.
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/access_roles'
        - $ref: '#/components/parameters/accept'
      responses:
        '200':
          $ref: '#/components/responses/flows_dashboard'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found error
  /users/{user_id}/metrics:
    get:
      tags:
        - Metrics
      operationId: user_metrics_daily
      summary: Get Daily Data Processing Metrics for a User
      description: >
        Retrieves daily data processing metrics of all sources or all
        destinations owned by a user.
      parameters:
        - name: user_id
          in: path
          description: >
            The unique ID of the user. The result will be an aggregate of
            metrics for all resources owned by this user.
          required: true
          schema:
            type: integer
        - name: org_id
          in: query
          description: >
            The ID of the organization this user belongs to. This parameter is
            relevant for users who belong to multiple organizations. In the
            absence of this parameter, the API returns an aggregate of metrics
            for all resources owned by the user in the user's default
            organization. Set this query parameter to fetch metrics for a
            different organization.
          schema:
            type: integer
        - name: resource_type
          in: query
          description: >
            The type of resource that metrics should be fetched for. Select
            `SOURCE` for the total data ingested by all sources owned by the
            user. Select `SINK` for the total data written out by all sinks
            owned by the user.
          required: true
          schema:
            type: string
            enum:
              - SOURCE
              - SINK
        - name: from
