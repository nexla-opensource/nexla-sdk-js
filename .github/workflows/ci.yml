name: CI

on:
  push:
    branches: [ main ]
    paths:
      - "packages/ts-sdk/**"
      - "plugin-redoc-0.yaml"
      - "openapi/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".changeset/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "packages/ts-sdk/**"
      - "plugin-redoc-0.yaml"
      - "openapi/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".changeset/**"
      - ".github/workflows/ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm must be on PATH before setup-node resolves `cache: pnpm`.
      # The version comes from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22  # size-limit 14 needs fs/promises.glob (Node >= 22)
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Releases publish on merge, so each PR must commit its own version bump.
      - name: Require versioned changesets
        run: |
          pending=$(find .changeset -name '*.md' ! -name 'README.md')
          if [ -n "$pending" ]; then
            echo "::error::Unversioned changesets: $pending. Run 'pnpm changeset version' and commit the result."
            exit 1
          fi

      - name: Validate generated coverage and spec metadata
        run: pnpm -C packages/ts-sdk check:generated

      # NEXLA_BACKEND_OPENAPI is a repository variable: the path to a fresh public backend spec on the runner.
      # Public CI does not set it, so the step prints a skip notice and passes.
      - name: Backend drift check
        env:
          NEXLA_BACKEND_OPENAPI: ${{ vars.NEXLA_BACKEND_OPENAPI }}
        run: pnpm -C packages/ts-sdk check:backend-drift

      - name: Generate SDK artifacts
        run: |
          pnpm -C packages/ts-sdk gen
          git diff --exit-code

      - name: Lint
        run: pnpm -C packages/ts-sdk lint

      - name: Format check
        run: pnpm -C packages/ts-sdk format:check

      - name: Typecheck
        run: pnpm -C packages/ts-sdk typecheck

      - name: Test
        run: pnpm -C packages/ts-sdk coverage

      - name: Build
        run: pnpm -C packages/ts-sdk build

      - name: Package metadata (publint)
        run: pnpm -C packages/ts-sdk publint

      - name: Package types (attw)
        run: pnpm -C packages/ts-sdk attw

      - name: Bundle size
        run: pnpm -C packages/ts-sdk size

  consumer-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -C packages/ts-sdk build

      # Packs the tarball, installs it in a fresh project, and checks ESM, CJS and types.
      - name: Consumer smoke test
        run: pnpm -C packages/ts-sdk smoke:consumer
