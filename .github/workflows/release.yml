name: Release

# A release PR runs `pnpm changeset version` and commits the version bump and
# CHANGELOG. Merging that PR to main publishes the new version. `changeset
# publish` skips any version that is already on npm, so other pushes are no-ops.
on:
  push:
    branches: [ main ]
    paths:
      - "packages/ts-sdk/package.json"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm must be on PATH before setup-node resolves `cache: pnpm`.
      # The version comes from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `changeset publish` creates annotated git tags, which need an identity.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # prepublishOnly runs build and tests before each publish.
      - name: Publish versions not yet on npm
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release tags
        run: git push origin --tags
